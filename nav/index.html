<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的导航</title>
  <link rel="stylesheet" href="style.css?v=99">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌐</text></svg>">
  <style>
    /* ===== Loading Skeleton ===== */
    .loading-screen { position: fixed; inset: 0; z-index: 9999; background: var(--bg-primary);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
      transition: opacity .5s; }
    .loading-screen.hide { opacity: 0; pointer-events: none; }
    .loader { width: 38px; height: 38px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-screen p { color: var(--text-tertiary); font-size: .9rem; letter-spacing: 1px; }
  </style>
  <!-- 法定节假日数据源：chinese-workday（jsDelivr 静态包，数据内置，免 CORS 代理；file:// 下经 <script> 加载不受跨域限制） -->
  <script src="https://cdn.jsdelivr.net/npm/chinese-workday@2.0.0/dist/chinese-workday.min.js" onerror="window.__wsCwFailed=true"></script>
</head>
<body class="bg-aurora">
  <!-- Loading -->
  <div class="loading-screen" id="loadingScreen">
    <div class="loader"></div>
    <p>正在加载导航…</p>
  </div>

  <div class="bg-canvas"></div>
  <div class="toast" id="toast"></div>

  <!-- 未绑定配置文件时的提示条 -->
  <div class="bind-banner" id="bindBanner" style="display:none">
    <span>💾 数据仅存本浏览器，绑定配置文件后可多浏览器同步。</span>
    <button onclick="bindConfigFile()">绑定配置文件</button>
    <button class="bind-close" onclick="this.parentNode.style.display='none'" title="关闭">✕</button>
  </div>

  <!-- Settings -->
  <div class="settings-overlay" id="settingsOverlay" onclick="closeSettings(event)"></div>
  <div class="settings-panel" id="settingsPanel">
    <div class="settings-header">
      <h2>⚙️ 导航设置</h2>
      <button class="settings-close" onclick="closeSettings()">&times;</button>
    </div>
    <div class="settings-body" id="settingsBody"></div>
  </div>

  <!-- 工作台设置抽屉 -->
  <div class="ws-settings-overlay" id="wsSettingsOverlay" onclick="closeWsSettings(event)"></div>
  <div class="ws-settings-panel" id="wsSettingsPanel">
    <div class="ws-settings-header">
      <h3>⚙️ 工作台设置</h3>
      <button class="ws-settings-close" onclick="closeWsSettings()">&times;</button>
    </div>
    <div class="ws-settings-body" id="wsSettingsBody"></div>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modalOverlay"><div class="modal" id="modalContent"></div></div>
  <!-- 专注模式全屏遮罩 -->
  <div class="focus-overlay" id="focusOverlay" aria-hidden="true">
    <div class="focus-panel">
      <div class="focus-head" id="focusHead">专注模式</div>
      <div class="focus-timer" id="focusTimer">00:00</div>
      <div class="focus-task" id="focusTask"></div>
      <div class="focus-actions">
        <button class="btn btn-secondary" id="focusPauseBtn" onclick="wsFocusTogglePause()">暂停</button>
        <button class="btn btn-secondary focus-reset-btn" onclick="wsFocusReset()" title="重置计时">
          <span class="reset-ico">⟳</span> 重置
        </button>
        <button class="btn btn-primary" onclick="wsFocusStop(true)">停止并退出</button>
      </div>
    </div>
  </div>
  <!-- 专注模式弹窗（可拖动，非全屏遮挡，不影响其它操作） -->
  <div class="focus-popup" id="focusPopup" aria-hidden="true">
    <div class="focus-popup-bar" onpointerdown="wsFocusPopupDragStart(event)">
      <span class="focus-popup-title" id="focusPopupHead">专注模式</span>
      <span class="focus-popup-close" onclick="wsFocusStop(true)" title="停止并退出">×</span>
    </div>
    <div class="focus-popup-body">
      <div class="focus-popup-timer" id="focusPopupTimer">00:00</div>
      <div class="focus-popup-task" id="focusPopupTask"></div>
      <div class="focus-popup-actions">
        <button class="btn btn-secondary focus-popup-pause" onclick="wsFocusTogglePause()"><span id="focusPopupPause">暂停</span></button>
        <button class="btn btn-secondary focus-popup-reset" onclick="wsFocusReset()" title="重置计时">
          <span class="reset-ico">⟳</span> 重置
        </button>
      </div>
    </div>
  </div>
  <!-- 本地相册全屏轮播遮罩 -->
  <div class="album-overlay" id="albumOverlay" aria-hidden="true">
    <div class="album-top"><span id="albumTitle">本地相册</span></div>
    <button class="album-close" onclick="wsAlbumClose()" title="退出 (Esc)">×</button>
    <button class="album-nav album-prev" onclick="wsAlbumNav(-1)" title="上一张 (←)">‹</button>
    <img class="album-img" id="albumImg" src="" alt="照片">
    <button class="album-nav album-next" onclick="wsAlbumNav(1)" title="下一张 (→)">›</button>
    <div class="album-dots" id="albumDots"></div>
    <div class="album-actions">
      <button class="btn btn-secondary" id="albumPlayBtn" onclick="wsAlbumTogglePlay()">暂停</button>
      <button class="btn btn-primary" onclick="wsAlbumClose()">退出</button>
    </div>
  </div>
  <!-- 天气详情弹窗 -->
  <div class="weather-overlay" id="weatherOverlay" aria-hidden="true" onclick="if(event.target===this)wsWeatherClose()">
    <div class="weather-pop"></div>
    <div class="weather-pop-status" id="weatherPopStatus"></div>
  </div>
  <!-- 城市菜单（脱离 widget 层叠上下文，避免被遮挡） -->
  <div class="city-menu" id="cityMenu"></div>

  <!-- 半隐藏模式：左侧触发区（鼠标移入自动展开侧边栏） -->
  <div class="side-trigger-zone" id="sideTriggerZone"></div>
  <!-- 左侧漂浮菜单（内容由 renderSideNav 按配置动态生成） -->
  <nav class="side-nav" id="sideNav" aria-label="页面导航"></nav>

  <!-- App -->
  <div class="app" id="app">
    <!-- Top bar -->
    <div class="top-bar">
      <div class="top-bar-left">
        <div class="brand" id="brand"></div>
        <div class="nav-tabs" id="navTabs"></div>
      </div>
      <div class="top-bar-right">
        <div class="theme-toggle" id="themeToggle" onclick="cycleTheme()" title="切换主题">🌙</div>
        <button class="icon-btn settings" onclick="openSettings()" title="设置">&#9881;</button>
      </div>
    </div>

    <!-- Hero -->
    <div class="hero">
      <!-- 时钟区：时间 + 日期同框，天气迁入此处与左右对齐美观 -->
      <div class="datetime" id="datetime">
        <div class="clock-card">
          <div class="clock" id="clock">--:--</div>
        </div>
        <div class="info-card">
          <div class="info-date">
            <div class="date" id="dateStr"></div>
            <div class="weekday" id="weekdayStr"></div>
          </div>
          <div class="weather-inline" id="weatherWidget">
            <div class="w-icon" id="wIcon">🌤️</div>
            <div class="w-main">
              <div class="w-temp" id="wTemp">--℃</div>
              <div class="w-city" id="wCity" onclick="toggleCityMenu(event)" title="点击切换城市">--</div>
            </div>
            <div class="w-meta" id="wMeta"></div>
          </div>
        </div>
      </div>

      <div class="search-box" id="searchBox">
        <button class="engine-switch" id="engineBtn" onclick="toggleEngineMenu(event)">
          <span id="engineName">百度</span><span class="caret">▾</span>
        </button>
        <input type="text" id="searchInput" placeholder="搜索网页，或输入网址直达…" onkeydown="onSearchKey(event)" oninput="onSearchInput()" autocomplete="off">
        <button class="ai-btn" id="aiBtn" onclick="askAI()" title="问 AI">✦ 问AI</button>
        <button type="button" class="search-icon" onclick="doSearch()" title="搜索" aria-label="搜索">🔍</button>
        <div class="engine-menu" id="engineMenu"></div>
      </div>

      <div class="favorites" id="favorites"></div>
    </div>

    <!-- Widgets -->
    <div class="widgets" id="widgets">
      <div class="widget countdown" id="offWorkWidget">
        <div class="w-label">⏰ 下班倒计时</div>
        <div class="w-value" id="offWorkVal">--:--:--</div>
        <div class="w-sub" id="offWorkSub"></div>
      </div>
      <div class="widget countdown" id="paydayWidget">
        <div class="w-label">💰 发薪倒计时</div>
        <div class="w-value" id="paydayVal">-- 天</div>
        <div class="w-sub" id="paydaySub"></div>
      </div>
    </div>

    <!-- Content -->
    <div id="content"></div>

    <!-- Footer -->
    <footer class="footer" id="footer"></footer>
  </div>

  <!-- 热榜页 -->
  <main class="hot-page" id="hotPage" aria-hidden="true">
    <div class="hot-header">
      <h1>🔥 今日热榜</h1>
      <div class="hot-meta">聚合主流平台实时热点 · 点击条目直达</div>
    </div>
    <div class="hot-toolbar">
      <button type="button" class="hot-refresh" onclick="renderHotPage(true)" title="刷新全部">🔄 刷新</button>
      <span class="hot-update" id="hotUpdate"></span>
    </div>
    <div class="hot-grid" id="hotGrid">
      <div class="hot-loading">正在加载热榜数据…</div>
    </div>
  </main>

  <!-- 工作台页 -->
  <main class="ws-page" id="wsPage" aria-hidden="true">
    <div class="ws-topbar">
      <div class="ws-brand">
        <div class="ws-avatar">💻</div>
        <div class="ws-title-wrap">
          <div class="ws-title">我的工作台</div>
          <div class="ws-subdate" id="wsSubDate"></div>
        </div>
        <div class="ws-settings-btn-group" id="wsSettingsBtnGroup"></div>
      </div>
      <div class="ws-weekend" id="wsWeekend"></div>
      <div class="ws-stat" id="wsTodoStat"></div>
      <div class="ws-stat" id="wsSparkStat"></div>
    </div>
    <div class="ws-diy-zone" id="wsDiyZone">
      <div class="ws-diy-grid" id="wsDiyGrid"></div>
    </div>
    <div class="ws-body">
      <!-- 左：日历 -->
      <div class="ws-col">
        <div class="ws-card ws-cal-card">
          <div class="ws-cal-head">
            <select id="wsCalYear" onchange="wsRenderCalendar()"></select>
            <button type="button" class="ws-cal-nav" onclick="wsCalNav(-1)">‹</button>
            <select id="wsCalMonth" onchange="wsRenderCalendar()"></select>
            <button type="button" class="ws-cal-nav" onclick="wsCalNav(1)">›</button>
            <button type="button" class="ws-cal-today" onclick="wsCalToday()">今天</button>
            <span class="ws-card-icon ws-cal-icon" id="wsCalIcon" title="点击刷新法定假期" role="button" tabindex="0" onclick="wsRefreshHolidays(parseInt(document.getElementById('wsCalYear').value))">📅</span>
          </div>
          <div class="ws-cal-weekdays">
            <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span class="rest">六</span><span class="rest">日</span>
          </div>
          <div class="ws-cal-grid" id="wsCalGrid"></div>
          <div class="ws-cal-detail" id="wsCalDetail"></div>
        </div>
      </div>
      <!-- 中：我的待办 -->
      <div class="ws-col">
        <div class="ws-card">
          <div class="ws-card-title"><span>我的待办</span><span class="ws-card-icon" title="我的待办">✅</span></div>
          <div class="ws-todo-add">
            <input type="text" id="wsTodoInput" placeholder="添加待办，#标签 写内容，回车保存" maxlength="200" autocomplete="off">
          </div>
          <div class="ws-todo-scroll"><div class="ws-todo-list" id="wsTodoList"></div></div>
          <div class="ws-card-foot" id="wsTodoHint">待办即刻写，避免转头忘</div>
        </div>
      </div>
      <!-- 右：灵感火花 -->
      <div class="ws-col">
        <div class="ws-card">
          <div class="ws-card-title"><span>灵感火花</span><span class="ws-card-icon" title="灵感火花">💡</span></div>
          <div class="ws-spark-add">
            <textarea id="wsSparkInput" placeholder="随手记灵感，#标签 写内容，回车保存" rows="3" maxlength="500"></textarea>
          </div>
          <div class="ws-spark-scroll"><div class="ws-spark-list" id="wsSparkList"></div></div>
          <div class="ws-card-foot">灵感随时记，别让它溜走</div>
        </div>
      </div>
    </div>
  </main>

  <!-- 待办：右下角漂浮待办（复用工作台「我的待办」模块能力） -->
  <button type="button" class="sticky-fab" id="todoFab" onclick="toggleTodoPanel()" title="待办" aria-label="待办">📋</button>
  <div class="sticky-panel" id="todoPanel" aria-hidden="true">
    <div class="sticky-panel-head">
      <span class="sticky-title">我的待办</span>
      <button type="button" class="sticky-close" onclick="toggleTodoPanel(false)" title="关闭">×</button>
    </div>
    <div class="ws-todo-add">
      <input type="text" id="homeTodoInput" placeholder="添加待办，#标签 写内容，回车保存" maxlength="200" autocomplete="off" onkeydown="homeTodoKey(event)">
    </div>
    <div class="ws-todo-list" id="homeTodoList"></div>
    <div class="sticky-hint">点击状态可切换 · X 删除 · 可拖拽排序</div>
  </div>

  <script src="config.js?v=6"></script>
  <script>
  // =====================================================================
  //  常量
  // =====================================================================
  const ENGINES = {
    baidu:      { name: "百度",   url: "https://www.baidu.com/s?wd=" },
    baidu_map:  { name: "地图",   url: "https://map.baidu.com/?newmap=1&s=s%26wd%3D" },
    bilibili:   { name: "B站",    url: "https://search.bilibili.com/all?keyword=" },
    weixin:     { name: "微信",   url: "https://weixin.sogou.com/weixin?type=2&query=" },
    jd:         { name: "京东",   url: "https://search.jd.com/Search?keyword=" },
    taobao:     { name: "淘宝",   url: "https://s.taobao.com/search?q=" }
  };
  const AI_ASSISTANTS = {
    deepseek:  { name: "DeepSeek",  url: "https://chat.deepseek.com" },
    doubao:    { name: "豆包",      url: "https://www.doubao.com" },
    kimi:      { name: "Kimi",      url: "https://kimi.moonshot.cn" },
    chatgpt:   { name: "ChatGPT",   url: "https://chatgpt.com" },
    yuanbao:   { name: "元宝",      url: "https://yuanbao.tencent.com" },
    qwen:      { name: "通义千问",  url: "https://tongyi.aliyun.com" }
  };
  const BG_PRESETS = {
    aurora:  "极光紫", sunset: "落日橙", ocean: "深海蓝",
    forest:  "森林绿", midnight: "午夜黑", candy: "粉樱"
  };
  // 预设背景对应的渐变（用于设置面板色块预览）
  const BG_SWATCH = {
    aurora:   "linear-gradient(135deg,#0f0f1a 0%,#1a1040 42%,#0f0f1a 72%,#1a0a2e 100%)",
    sunset:   "linear-gradient(135deg,#2b1055 0%,#7597de 50%,#ff7e5f 100%)",
    ocean:    "linear-gradient(135deg,#0a192f 0%,#112d4e 50%,#3f72af 100%)",
    forest:   "linear-gradient(135deg,#0b2018 0%,#14452f 50%,#1f7a4d 100%)",
    midnight: "linear-gradient(135deg,#05060a 0%,#0d1117 60%,#161b29 100%)",
    candy:    "linear-gradient(135deg,#2d1b3d 0%,#7b2d6b 50%,#e0859b 100%)"
  };
  const FONT_STACKS = {
    "":         "-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif",
    yahei:      "'Microsoft YaHei', 'PingFang SC', sans-serif",
    pingfang:   "'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif",
    song:       "'SimSun', 'Songti SC', serif",
    kai:        "'KaiTi', 'Kaiti SC', serif",
    hei:        "'SimHei', 'Heiti SC', sans-serif",
    mono:       "'Consolas', 'Courier New', monospace"
  };
  const FONT_NAMES = { "": "系统默认", yahei: "微软雅黑", pingfang: "苹方", song: "宋体", kai: "楷体", hei: "黑体", mono: "等宽" };
  // WMO 天气代码 -> 图标 + 文字
  const WMO = {
    0:["☀️","晴"],1:["🌤️","多云"],2:["⛅","局部多云"],3:["☁️","阴"],
    45:["🌫️","雾"],48:["🌫️","雾凇"],51:["🌦️","毛毛雨"],53:["🌦️","毛毛雨"],55:["🌧️","毛毛雨"],
    56:["🌧️","冻雨"],57:["🌧️","冻雨"],61:["🌧️","小雨"],63:["🌧️","中雨"],65:["🌧️","大雨"],
    66:["🌧️","冻雨"],67:["🌧️","冻雨"],71:["🌨️","小雪"],73:["🌨️","中雪"],75:["❄️","大雪"],77:["🌨️","雪粒"],
    80:["🌦️","阵雨"],81:["🌧️","阵雨"],82:["⛈️","强阵雨"],85:["🌨️","阵雪"],86:["❄️","阵雪"],
    95:["⛈️","雷阵雨"],96:["⛈️","雷阵雨伴雹"],99:["⛈️","强雷暴"]
  };
  function windDirText(deg) {
    if (deg == null || isNaN(deg)) return "未知";
    const dirs = ["北风","东北风","东风","东南风","南风","西南风","西风","西北风"];
    return dirs[Math.round(deg / 45) % 8];
  }
  function uvLevel(v) {
    if (v == null || isNaN(v)) return ["", ""];
    if (v <= 2) return [v + " 最弱", "good"];
    if (v <= 4) return [v + " 弱", "moderate"];
    if (v <= 6) return [v + " 中等", "moderate"];
    if (v <= 9) return [v + " 强", "bad"];
    return [v + " 很强", "bad"];
  }
  function aqiLevel(v) {
    if (v == null || isNaN(v)) return ["--", "good"];
    if (v <= 50) return ["优", "good"];
    if (v <= 100) return ["良", "moderate"];
    if (v <= 150) return ["轻度", "bad"];
    if (v <= 200) return ["中度", "bad"];
    if (v <= 300) return ["重度", "bad"];
    return ["严重", "bad"];
  }
  function windLevel(mps) {
    if (mps == null || isNaN(mps)) return "0级";
    if (mps < 0.3) return "0级";
    if (mps < 1.6) return "1级";
    if (mps < 3.4) return "2级";
    if (mps < 5.5) return "3级";
    if (mps < 8) return "4级";
    if (mps < 10.8) return "5级";
    if (mps < 13.9) return "6级";
    if (mps < 17.2) return "7级";
    if (mps < 20.8) return "8级";
    return "9级+";
  }

  // =====================================================================
  //  状态
  // =====================================================================
  let CONFIG = null;
  let STORAGE_KEY = "navpage_config_v2";
  let FS_HANDLE = null;
  // 最近一次写入/读取磁盘配置文件的 JSON 签名；用于判断文件是否被「其他浏览器」真正修改，
  // 避免本地仅存在于内存中的瞬时状态（如天气组件 cache）被误判为外部修改而反复同步。
  let lastFsWriteSig = null;
  let activeCategory = "all";
  let activeSearch = "";
  let editState = null;
  let editingEventId = null;
  let tickTimer = null;

  // =====================================================================
  //  初始化
  // =====================================================================
  document.addEventListener("DOMContentLoaded", init);
  function init() {
    setTimeout(() => { const l = document.getElementById("loadingScreen"); if (l && !l.classList.contains("hide")) l.classList.add("hide"); }, 4000);
    loadConfig().then(() => bootstrap()).catch(() => {
      CONFIG = JSON.parse(JSON.stringify(window.NAV_CONFIG_DEFAULT || {}));
      bootstrap();
    });
  }
  // 配置加载优先级：已绑定磁盘 JSON（多浏览器共享）> localStorage > 默认配置
  async function loadConfig() {
    const h = await idbGetHandle();
    if (h) {
      FS_HANDLE = h;
      const cfg = await fsReadConfig();
      if (cfg) { CONFIG = cfg; lastFsWriteSig = JSON.stringify(CONFIG); return; }
    }
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) { CONFIG = JSON.parse(saved); return; }
    } catch (e) {}
    CONFIG = JSON.parse(JSON.stringify(window.NAV_CONFIG_DEFAULT || {}));
  }
  function bootstrap() {
    if (!CONFIG.settings) CONFIG.settings = {};
    if (!CONFIG.categories) CONFIG.categories = [];
    if (!CONFIG.favorites) CONFIG.favorites = [];
    if (!CONFIG.stickyNotes) CONFIG.stickyNotes = [];
    if (!CONFIG.workspace) CONFIG.workspace = {};
    if (!CONFIG.sideItems) {
      CONFIG.sideItems = JSON.parse(JSON.stringify((window.NAV_CONFIG_DEFAULT && window.NAV_CONFIG_DEFAULT.sideItems) || [
        { id: "home", name: "主页", icon: "🏠", enabled: true, sort: 1 },
        { id: "work", name: "工作台", icon: "💼", enabled: true, sort: 2 },
        { id: "hot",  name: "热榜", icon: "🔥", enabled: true, sort: 3 }
      ]));
    }
    document.title = CONFIG.title || "我的导航";
    applyTheme();
    watchSystemTheme();

  // 日出日落模式：根据当前时区日出/日落时间自动切换深浅色
  function isSunDark() {
    const now = new Date();
    const tz = -now.getTimezoneOffset(); // 分钟
    try {
      const saved = JSON.parse(localStorage.getItem("nav_sun_tz") || "null");
      if (saved && saved.ts && Date.now() - saved.ts < 7 * 24 * 3600e3 && saved.min !== tz) {
        localStorage.removeItem("nav_sun_tz");
        localStorage.removeItem("nav_sun_pos");
      }
    } catch (e) {}
    let pos = null;
    try { pos = JSON.parse(localStorage.getItem("nav_sun_pos") || "null"); } catch (e) {}
    if (pos && pos.lat != null && pos.lng != null) {
      const st = sunTimes(now, pos.lat, pos.lng);
      if (st) return now < st.rise || now >= st.set;
    }
    // 无定位信息时，回退跟随系统
    return window.matchMedia("(prefers-color-scheme: dark)").matches;
  }
  // 计算某地当日日出/日落（本地时刻），纬度为北负南
  function sunTimes(date, lat, lng) {
    const toRad = d => d * Math.PI / 180;
    const y = date.getFullYear(), mo = date.getMonth(), d = date.getDate();
    const dayOfYear = Math.floor((new Date(y, mo, d) - new Date(y, 0, 0)) / 86400000);
    const lngHour = lng / 15;
    const tzHours = -date.getTimezoneOffset() / 60; // 时区相对 UTC 的小时数
    const calc = (isRise) => {
      const t = dayOfYear + ((isRise ? 6 : 18) - lngHour) / 24;
      const M = (0.9856 * t) - 3.289;
      let L = M + (1.916 * Math.sin(toRad(M))) + (0.020 * Math.sin(toRad(2 * M))) + 282.634;
      L = ((L % 360) + 360) % 360;
      let RA = Math.atan(0.91764 * Math.tan(toRad(L)));
      RA = ((RA * 180 / Math.PI % 360) + 360) % 360;
      const Lquad = Math.floor(L / 90) * 90, RAquad = Math.floor(RA / 90) * 90;
      RA = (RA + (Lquad - RAquad)) / 15;
      const sinDec = 0.39782 * Math.sin(toRad(L));
      const cosDec = Math.cos(Math.asin(sinDec));
      const cosH = (Math.cos(toRad(90.833)) - sinDec * Math.sin(toRad(lat))) / (cosDec * Math.cos(toRad(lat)));
      if (cosH > 1 || cosH < -1) return null; // 极昼/极夜
      let H = (isRise ? 360 - Math.acos(cosH) * 180 / Math.PI : Math.acos(cosH) * 180 / Math.PI) / 15;
      let T = H + RA - (0.06571 * t) - 6.622;
      let UT = T - lngHour;
      UT = ((UT % 24) + 24) % 24;
      let local = UT + tzHours;
      local = ((local % 24) + 24) % 24;
      const hh = Math.floor(local), mm = Math.round((local - hh) * 60);
      return new Date(y, mo, d, hh, mm, 0, 0);
    };
    const rise = calc(true), set = calc(false);
    if (rise == null || set == null) return null;
    return { rise, set };
  }
  // 定位到经纬度（供日出日落模式使用）
  function sunPosition() {
    let pos = null;
    try { pos = JSON.parse(localStorage.getItem("nav_sun_pos") || "null"); } catch (e) {}
    if (pos && pos.lat != null && pos.lng != null) return pos;
    const resolve = async () => {
      let city = (CONFIG.settings.weatherCity || "").trim();
      if (!city || city.toLowerCase() === "auto") {
        try { city = await detectCityByIP(); } catch (e) {}
      }
      const c = await geocodeCity(city);
      if (c) {
        localStorage.setItem("nav_sun_pos", JSON.stringify(c));
        localStorage.setItem("nav_sun_tz", JSON.stringify({ min: -new Date().getTimezoneOffset(), ts: Date.now() }));
        applyTheme();
      }
    };
    resolve();
    return null;
  }
  async function geocodeCity(city) {
    city = (city || "").trim();
    if (!city) return null;
    try {
      const r = await fetch("https://geocoding-api.open-meteo.com/v1/search?name=" + encodeURIComponent(city) + "&count=1&language=zh&format=json");
      const j = await r.json();
      if (j.results && j.results[0]) return { lat: j.results[0].latitude, lng: j.results[0].longitude };
    } catch (e) {}
    return null;
  }

  function applyBackground() {

  // 本地背景 IndexedDB
  const BG_IMG_DB_NAME = "navpage_bg";
  const BG_IMG_DB_STORE = "image";
  function bgImgIDB() {
    return new Promise(function (res, rej) {
      const req = indexedDB.open(BG_IMG_DB_NAME, 1);
      req.onupgradeneeded = function () { req.result.createObjectStore(BG_IMG_DB_STORE); };
      req.onsuccess = function () { res(req.result); };
      req.onerror = function () { rej(req.error); };
    });
  }
  function saveLocalBgImage(dataUrl, cb) {
    bgImgIDB().then(function (db) {
      const tx = db.transaction(BG_IMG_DB_STORE, "readwrite");
      const req = tx.objectStore(BG_IMG_DB_STORE).put(dataUrl, "localBg");
      tx.oncomplete = function () { db.close(); if (cb) cb(true); };
      tx.onerror = function () { db.close(); if (cb) cb(false); };
    }).catch(function () { if (cb) cb(false); });
  }
  function loadLocalBgImage(cb) {
    bgImgIDB().then(function (db) {
      const tx = db.transaction(BG_IMG_DB_STORE, "readonly");
      const r = tx.objectStore(BG_IMG_DB_STORE).get("localBg");
      r.onsuccess = function () { db.close(); cb && cb(r.result || ""); };
      r.onerror = function () { db.close(); cb && cb(""); };
    }).catch(function () { cb && cb(""); });
  }
  function clearLocalBgImage(cb) {
    bgImgIDB().then(function (db) {
      const tx = db.transaction(BG_IMG_DB_STORE, "readwrite");
      tx.objectStore(BG_IMG_DB_STORE).delete("localBg");
      tx.oncomplete = function () { db.close(); if (cb) cb(true); };
      tx.onerror = function () { db.close(); if (cb) cb(false); };
    }).catch(function () { if (cb) cb(false); });
  }
  function handleLocalBgUpload(input) {
    const file = input && input.files && input.files[0];
    if (!file) return;
    if (!file.type || file.type.indexOf("image/") !== 0) { showToast("请选择图片文件"); return; }
    showToast("正在处理背景图片…");
    // 复用相册压缩函数，限制最大 1920px，JPEG 0.85
    if (typeof wsAlbumFileToDataURL !== "function") {
      const reader = new FileReader();
      reader.onload = function () { saveLocalBgImage(reader.result, finish); };
      reader.readAsDataURL(file);
    } else {
      wsAlbumFileToDataURL(file, 1920, function (dataUrl) {
        if (!dataUrl) { showToast("图片处理失败"); return; }
        saveLocalBgImage(dataUrl, finish);
      });
    }
    function finish(ok) {
      if (!ok) { showToast("背景缓存失败，请重试"); return; }
      CONFIG.settings.bgMode = "local";
      if (!CONFIG.settings.localBg) CONFIG.settings.localBg = { mask: 20, blur: 0 };
      saveConfig(); applyBackground(); renderSettingsBody();
      showToast("本地背景已应用");
    }
  }

  function setLocalBgMask(v) {

    // 禁用项不可切换

    if (sit && !sit.enabled) return;
    currentPage = page;
    wsHideHotTip(); // 离开热榜页时收起标题浮层
    const app = document.getElementById("app");
    const hot = document.getElementById("hotPage");
    const ws = document.getElementById("wsPage");
    document.querySelectorAll(".side-item[data-page]").forEach(btn => {
      btn.classList.toggle("active", btn.dataset.page === page);
    });
    if (page === "home") {
      app.style.display = "";
      if (hot) { hot.style.display = "none"; hot.setAttribute("aria-hidden", "true"); }
      if (ws) { ws.style.display = "none"; ws.setAttribute("aria-hidden", "true"); }
    } else if (page === "hot") {
      app.style.display = "none";
      if (hot) { hot.style.display = "flex"; hot.setAttribute("aria-hidden", "false"); renderHotPage(); }
      if (ws) { ws.style.display = "none"; ws.setAttribute("aria-hidden", "true"); }
    } else if (page === "work") {
      app.style.display = "none";
      if (hot) { hot.style.display = "none"; hot.setAttribute("aria-hidden", "true"); }
      if (ws) { ws.style.display = "flex"; ws.setAttribute("aria-hidden", "false"); wsInit(); wsAutoLoadHolidays(parseInt(document.getElementById("wsCalYear").value) || new Date().getFullYear()); }

  // 热榜缓存：本地缓存一份，避免每次点击热榜都等待网络
  const HOT_CACHE_KEY = "hotCache_v1";
  const HOT_CACHE_TTL = 60 * 60 * 1000; // 1 小时
  function wsLoadHotCache() {
    try {
      const raw = localStorage.getItem(HOT_CACHE_KEY);
      if (!raw) return null;
      const obj = JSON.parse(raw);
      if (!obj || !obj.updated || !obj.items) return null;
      return obj;
    } catch (e) { return null; }
  }
  function wsSaveHotCache(items) {
    try { localStorage.setItem(HOT_CACHE_KEY, JSON.stringify({ updated: Date.now(), items })); } catch (e) {}
  }
  // 一次性抓取所有渠道（带容错），返回 { key: { list, error } }
  async function wsFetchAllHot() {
    const items = {};
    await Promise.all(HOT_SOURCES.map(async src => {
      try {
        const { list, error } = await fetchHot(src);
        items[src.key] = { list: list || [], error: error || null };
      } catch (e) {
        items[src.key] = { list: [], error: "加载失败，请刷新重试" };
      }
    }));
    return items;
  }
  // 打开页面时后台静默预取：仅当没有缓存或缓存已过期（>1h）才发起请求
  function wsPrefetchHot() {
    const cache = wsLoadHotCache();
    if (cache && (Date.now() - cache.updated) <= HOT_CACHE_TTL) return;
    wsFetchAllHot().then(items => { wsSaveHotCache(items); }).catch(() => {});
  }
  // 用「缓存或新数据」映射渲染热榜卡片
  function wsRenderHotFromItems(itemsMap) {
    const grid = document.getElementById("hotGrid");
    if (!grid) return;
    grid.innerHTML = "";
    HOT_SOURCES.forEach(src => {
      const entry = itemsMap[src.key];
      // 加载失败或没数据的渠道：直接隐藏该模块，避免显示「加载失败」占位
      if (!entry || !entry.list || !entry.list.length) return;
      const card = document.createElement("div");
      card.className = "hot-card";
      const head = '<div class="hot-card-head"><span class="hot-icon" style="background:' + src.color + '">' + src.icon + '</span><span class="hot-name">' + escapeHtml(src.name) + '</span></div>';
      const body = entry.list.slice(0, 10).map((it, idx) => {
        const title = escapeHtml(it.title || "");
        const url = escapeHtml(it.url || "");
        const hot = (it.hot_value != null && it.hot_value !== "") ? it.hot_value : "";
        const hotText = hot ? '<span class="hot-value">' + formatHot(hot) + '</span>' : "";
        return '<a class="hot-row" href="' + url + '" target="_blank" rel="noopener"><span class="hot-rank">' + (idx + 1) + '</span><span class="hot-title">' + title + '</span>' + hotText + '</a>';
      }).join("");
      card.innerHTML = head + '<div class="hot-card-body">' + body + '</div>';
      grid.appendChild(card);
    });
    // 若所有渠道都不可用，给出轻量提示而不是空白
    if (!grid.children.length) {
      grid.innerHTML = '<div class="hot-empty" style="grid-column:1/-1;text-align:center;color:var(--text-tertiary);padding:40px 0;">暂无可用的热榜数据，稍后下拉刷新或点顶部刷新再试 🔄</div>';
    }
  }
  async function renderHotPage(force) {
    const grid = document.getElementById("hotGrid");
    if (!grid) return;
    const cache = wsLoadHotCache();
    const hasCache = !!(cache && cache.items && Object.keys(cache.items).length);
    const stale = !cache || (Date.now() - cache.updated) > HOT_CACHE_TTL;
    const needRefresh = force || stale;

    if (hasCache && !needRefresh) {
      // 缓存很新：直接秒开，不发起任何请求
      wsRenderHotFromItems(cache.items);
      document.getElementById("hotUpdate").textContent = "缓存于 " + new Date(cache.updated).toLocaleTimeString();
      return;
    }
    if (hasCache) {
      // 有缓存但已过期：先展示缓存（秒开），再后台静默刷新
      wsRenderHotFromItems(cache.items);
      document.getElementById("hotUpdate").textContent = "缓存于 " + new Date(cache.updated).toLocaleTimeString() + " · 正在刷新…";
    } else {
      // 无缓存：先展示骨架

      HOT_SOURCES.forEach(src => {

    }
    // 后台获取（无论是否过期都会更新并写入缓存）
    const items = await wsFetchAllHot();
    wsSaveHotCache(items);
    // 若用户仍在热榜页，则重新渲染最新数据

    }
  }
  // 今日热榜：标题过长时，悬停对应行用浮层显示完整标题（仅截断时显示）
  let wsHotTipEl = null, wsHotTipRow = null, wsHotTipTimer = null;
  function wsGetHotTip() {
    if (!wsHotTipEl) {
      wsHotTipEl = document.createElement("div");

  function wsShowHotTip(row) {
    const tip = wsGetHotTip();
    const titleEl = row.querySelector(".hot-title");
    if (!titleEl) return;
    // 仅当标题被截断（横向溢出）时才显示浮层，短标题保持原样
    if (titleEl.scrollWidth <= titleEl.clientWidth) { wsHideHotTip(); return; }
    tip.textContent = (titleEl.textContent || "").trim();
    tip.style.display = "block";
    const r = row.getBoundingClientRect();
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    let top = r.top - th - 8;
    if (top < 8) top = r.bottom + 8; // 顶部空间不足则显示在行下方
    let left = r.left;
    if (left + tw > window.innerWidth - 8) left = window.innerWidth - tw - 8;
    if (left < 8) left = 8;
    tip.style.top = top + "px";
    tip.style.left = left + "px";
    requestAnimationFrame(() => { if (wsHotTipEl) wsHotTipEl.classList.add("show"); });
  }
  function wsHideHotTip() {
    wsHotTipRow = null;
    if (wsHotTipEl) { wsHotTipEl.classList.remove("show"); wsHotTipEl.style.display = "none"; }
  }
  function wsInitHotTooltip() {
    const grid = document.getElementById("hotGrid");
    if (!grid || grid.dataset.tipInit) return;
    grid.dataset.tipInit = "1";
    grid.addEventListener("mouseover", e => {
      const row = e.target.closest(".hot-row");
      if (row === wsHotTipRow) return; // 同一行内移动不重复触发
      wsHotTipRow = row;
      clearTimeout(wsHotTipTimer);
      if (row) wsHotTipTimer = setTimeout(() => wsShowHotTip(row), 120);
      else wsHideHotTip();
    });
    grid.addEventListener("mouseout", e => {
      const to = e.relatedTarget;
      if (to && to.closest && to.closest(".hot-row") === wsHotTipRow) return; // 仍在同行内

  // 导航卡片标题：宽度不足被截断（横向溢出）时，悬停浮层展示完整名称（同热点新闻效果）
  let wsNavTipEl = null, wsNavTipCur = null, wsNavTipTimer = null;
  function wsGetNavTip() {

    if (!span || span.scrollWidth <= span.clientWidth) { wsHideNavTip(); return; }

    tip.style.display = "block";
    const r = span.getBoundingClientRect();

  // 兼容多种接口返回结构：字符串数组 / [{title,url,hot}] / {data:[]} / {data:{list:[]}} 等
  function extractList(data) {
    if (!data) return [];
    let arr = null;
    if (Array.isArray(data)) arr = data;
    else if (data.data && Array.isArray(data.data)) arr = data.data;
    else if (data.data && Array.isArray(data.data.data)) arr = data.data.data;
    else if (data.data && Array.isArray(data.data.list)) arr = data.data.list;
    else if (Array.isArray(data.list)) arr = data.list;
    else if (data.result && Array.isArray(data.result)) arr = data.result;
    if (!arr) return [];
    return arr.slice(0, 12).map(x => {
      if (typeof x === "string") return { title: x };
      if (x && typeof x === "object") {
        return {
          title: x.title || x.word || x.name || x.hotword || x.query || "",
          url: x.url || x.link || x.mobil_url || x.href || "",
          hot_value: (x.hot_value != null ? x.hot_value : (x.hot != null ? x.hot : (x.heat != null ? x.heat : "")))
        };
      }
      return { title: String(x) };
    }).filter(it => it.title);
  }
  async function fetchHot(src) {
    // 多候选容错：依次尝试各 CORS 直连接口（支持 file:// 直接跨域），
    // 最后才用 CORS 代理兜底；每个请求 6s 超时，避免整页卡死。
    const TIMEOUT = 6000;
    const candidates = [];
    (src.apis || []).forEach(u => candidates.push({ url: u }));
    const ub = "https://uapis.cn/api/v1/misc/hotboard?type=" + encodeURIComponent(src.key) + "&limit=10";
    candidates.push({ url: "https://api.allorigins.win/raw?url=" + encodeURIComponent(ub) });
    candidates.push({ url: "https://api.codetabs.com/v1/proxy/?quest=" + encodeURIComponent(ub) });
    for (const c of candidates) {
      try {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), TIMEOUT);
        const res = await fetch(c.url, { signal: ctrl.signal, cache: "no-store" });
        clearTimeout(timer);
        if (!res.ok) continue;
        const data = await res.json();
        const list = extractList(data);
        if (!list.length) continue;
        list.forEach(it => { if (!it.url && src.searchUrl) it.url = src.searchUrl + encodeURIComponent(it.title); });
        return { src, list, error: null };
      } catch (e) { /* 尝试下一个候选 */ }
    }
    return { src, list: [], error: "加载失败，请刷新重试" };
  }
  function formatHot(n) {
    const num = Number(String(n).replace(/[^0-9.]/g, ""));
    if (isNaN(num)) return String(n);
    if (num >= 10000) return (num / 10000).toFixed(1) + "w";
    return String(Math.round(num));
  }

  function stringColor(str) {

    const palette = ["#9aa7c4","#9cc0b8","#aec4a6","#c6c9a4","#d6c8a8","#d8b1aa","#c8b2c4","#b0aac6","#a4b4c6","#a6c2bc","#b0c6a4","#c6c09a","#d6bda8","#c8b0c0","#bcb0c8","#a6c2d4"];

  function enterSortMode(grid, btn) {
    btn.textContent = "✓";
    btn.title = "完成排序";
    btn.classList.add("sorting-active");
    const sec = btn.closest(".category-section");
    sec.querySelectorAll(".ch-btn:not(.sorting-active)").forEach(b => b.disabled = true);
    const menu = sec.querySelector(".ch-menu"); if (menu) menu.classList.add("disabled");
    grid.classList.add("sorting");
    // 排序模式下卡片可拖拽（卡片本身是 <a> 链接，故直接让卡片承接拖拽）
    grid.querySelectorAll(".card").forEach(c => c.setAttribute("draggable", "true"));
    grid.querySelectorAll(".card").forEach(card => {
      card.addEventListener("dragstart", e => {
        if (e.target.closest(".card-actions")) { e.preventDefault(); return; } // 抓取编辑/删除按钮时不启动排序拖拽
        wsActiveDrag = true;
        card.classList.add("dragging");
        e.dataTransfer.effectAllowed = "move";
        try { e.dataTransfer.setData("text/plain", card.dataset.id || ""); } catch (_) {}
      });
      card.addEventListener("dragend", () => {
        wsActiveDrag = false;
        card.classList.remove("dragging");
        grid.querySelectorAll(".card.drop-before").forEach(c => c.classList.remove("drop-before"));
      });
      card.addEventListener("dragover", e => {
        e.preventDefault();
        const dragging = grid.querySelector(".card.dragging");
        if (!dragging || dragging === card) return;
        const box = card.getBoundingClientRect();
        const isAfter = e.clientY > box.top + box.height / 2;
        // 实时把被拖卡片移动到光标所在卡片的位置，所见即所得
        grid.insertBefore(dragging, isAfter ? card.nextSibling : card);
      });
      card.addEventListener("drop", e => {
        e.preventDefault();
        grid.querySelectorAll(".card.drop-before").forEach(c => c.classList.remove("drop-before"));
      });
    });
    const onClick = (e) => { if (e.target.closest(".card")) e.preventDefault(); }; // 排序模式禁止点击跳转
    grid.addEventListener("click", onClick);
    // 全局兜底：任一拖拽排序进行中，任意 dragover/drop 都阻止浏览器默认行为（避免链接/文本被拖出打开新页面）
    if (!document._wsSortDragGuard) {

  // =====================================================================
  //  法定节假日：数据源 = chinese-workday（jsDelivr 静态 JS 包，数据内置）
  //  经 <head> 的 <script> 标签加载，暴露全局 chineseWorkday；file:// 下
  //  <script> 不受跨域限制，故无需 CORS 代理，浏览器可稳定取数。
  //  运行时用其 isHoliday / isAdditionalWorkday / getFestival 按年构建字典，
  //  输出格式与 WS_HOLIDAY 一致：{ "YYYY-MM-DD": {rest:true/false, name} }。
  //  当年已缓存则优先读缓存；无缓存才构建一次并缓存（按年永久缓存 localStorage）。
  //  库未加载（网络/CDN 不可用）时：当年当无国家法定假期数据（不影响年月与农历显示），
  //  且不写缓存，下次打开/点击刷新仍可重试。下方 WS_HOLIDAY 仅作人工配置导出源。
  //  注意：@2.0.0 内置数据覆盖 2024–2026；库未覆盖的年份按"无数据"处理。
  // =====================================================================
  const WS_HOLIDAY_CACHE_PREFIX = "wsHolidays_v1_";
  const _wsHolidayMem = {}; // 内存缓存：年 -> { "YYYY-MM-DD": {rest, name} }

  // 取某年法定假期字典：内存 -> localStorage；均无则返回 {}（接口异常即无数据，符合需求）
  function wsGetHolidays(year) {
    if (_wsHolidayMem[year]) return _wsHolidayMem[year];
    try {
      const raw = localStorage.getItem(WS_HOLIDAY_CACHE_PREFIX + year);
      if (raw) { _wsHolidayMem[year] = JSON.parse(raw); return _wsHolidayMem[year]; }
    } catch (e) {}
    return {};
  }

  // 用 chinese-workday 库按年构建法定假期字典（与 WS_HOLIDAY 同格式 {rest,name}）。
  // 库未加载则不应调用本函数（wsFetchHolidays 会先判空）。
  function wsBuildHolidaysFromLib(year) {
    const dict = {};
    const d = new Date(year, 0, 1);
    const end = new Date(year, 11, 31);
    while (d <= end) {
      const y = d.getFullYear();
      const mm = ("0" + (d.getMonth() + 1)).slice(-2);
      const dd = ("0" + d.getDate()).slice(-2);
      const key = y + "-" + mm + "-" + dd;
      const isAddWork = chineseWorkday.isAdditionalWorkday(key); // 注意：isAddtionalWorkday(拼写错) 已废弃，勿用
      if (isAddWork) {
        dict[key] = { rest: false, name: "调休上班" };
      } else {
        // 仅当 getFestival 返回具体节假名称才算法定休：库对未覆盖年份会把周末也判为 isHoliday，
        // 且 getFestival 会返回"周末"/"工作日"，须排除，否则会把每个周末错标成"休"。
        const nm = chineseWorkday.getFestival(key);
        if (nm && nm !== "工作日" && nm !== "周末") dict[key] = { rest: true, name: nm };
      }
      d.setDate(d.getDate() + 1);
    }
    return dict;
  }

  // 真正取数：返回 Promise<{ "YYYY-MM-DD": {rest,name} }>。
  // 数据源为内置 JS 库 chinese-workday（<head> 已加载）；同步构建，即时返回。
  // 库未加载（CDN 不可用 / 离线）-> reject，由上层按"异常当无数据"处理。
  // 库已加载但该年无数据（如 2027+ 库未覆盖）-> resolve({})，当年不显示法定假期。
  function wsFetchHolidays(year, signal) {
    return new Promise(function (resolve, reject) {
      if (typeof chineseWorkday === "undefined" || !chineseWorkday) {
        reject(new Error("法定假期库(chinese-workday)未加载，请检查网络或稍后点击📅重试"));
        return;
      }
      resolve(wsBuildHolidaysFromLib(year));
    });
  }

  // 更新日历图标状态：loading(刷新中) / ok(已加载) / failed(获取失败，可点击重试)
  function wsHolidayIconState(state, msg) {
    const icon = document.getElementById("wsCalIcon");
    if (!icon) return;
    if (state === "loading") { icon.classList.add("loading"); icon.classList.remove("failed"); icon.setAttribute("title", "刷新中…"); }
    else if (state === "ok") { icon.classList.remove("loading", "failed"); icon.setAttribute("title", "点击刷新法定假期"); }
    else if (state === "failed") { icon.classList.remove("loading"); icon.classList.add("failed"); icon.setAttribute("title", msg || "假期数据获取失败，点击📅重试"); }
  }

  // 首次打开/切到工作台时调用：当年无缓存才请求接口；成功永久缓存；失败当无数据（不影响年月/农历）。
  // 同年并发多次调用只发一次网络请求（其余走回调队列）。
  const _wsHolidayLoading = {}; // 年 -> { _started:true, cbs:[fn] }
  function wsLoadHolidays(year, onReady) {
    if (_wsHolidayMem[year]) { if (onReady) onReady(_wsHolidayMem[year]); return; }
    try {
      const raw = localStorage.getItem(WS_HOLIDAY_CACHE_PREFIX + year);
      if (raw) { _wsHolidayMem[year] = JSON.parse(raw); if (onReady) onReady(_wsHolidayMem[year]); return; }
    } catch (e) {}
    if (!_wsHolidayLoading[year]) _wsHolidayLoading[year] = { _started: false, cbs: [] };
    if (onReady) _wsHolidayLoading[year].cbs.push(onReady);
    if (_wsHolidayLoading[year]._started) return; // 已在请求中，等待回调
    _wsHolidayLoading[year]._started = true;
    const ctrl = (typeof AbortController !== "undefined") ? new AbortController() : null;
    const timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 15000); // 自动加载放宽到 15s（手动刷新仍 10s）
    function settle(dict, ok) {
      clearTimeout(timer);
      _wsHolidayMem[year] = dict;
      if (ok) {
        try { localStorage.setItem(WS_HOLIDAY_CACHE_PREFIX + year, JSON.stringify(dict)); } catch (e) {}
        wsHolidayIconState("ok");
      } else {
        // 接口异常：当无国家法定假期数据（不影响年月/农历显示）；不写缓存，下次打开/点击刷新仍可重试
        wsHolidayIconState("failed", "假期数据获取失败，点击📅重试");
      }
      const cbs = (_wsHolidayLoading[year] || { cbs: [] }).cbs;
      delete _wsHolidayLoading[year];
      cbs.forEach(function (cb) { try { cb(dict); } catch (e) {} });
    }
    wsFetchHolidays(year, ctrl ? ctrl.signal : null)
      .then(function (dict) { settle(dict, true); })
      .catch(function () { settle({}, false); }); // 接口异常：当无数据，不写缓存，下次仍可重试
  }

  // 打开页面/切到工作台时触发：静默加载当年假期并刷新日历
  function wsAutoLoadHolidays(year) {
    wsLoadHolidays(year, function () {
      const grid = document.getElementById("wsCalGrid");
      if (grid) { try { wsRenderCalendar(); wsUpdateCalDetail(); } catch (e) {} }
    });
  }

  // 手动点击日历图标刷新：强制重新请求（绕过缓存），支持 10 秒超时与成功/失败提示。
  function wsRefreshHolidays(year) {
    year = year || new Date().getFullYear();
    const icon = document.getElementById("wsCalIcon");
    if (icon) { icon.classList.add("loading"); icon.classList.remove("failed"); icon.setAttribute("title", "刷新中…"); }
    const ctrl = (typeof AbortController !== "undefined") ? new AbortController() : null;
    const timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 10000); // 手动刷新保持 10s 超时（按需求）
    wsFetchHolidays(year, ctrl ? ctrl.signal : null)
      .then(function (dict) {
        clearTimeout(timer);
        _wsHolidayMem[year] = dict;
        try { localStorage.setItem(WS_HOLIDAY_CACHE_PREFIX + year, JSON.stringify(dict)); } catch (e) {}
        wsRenderCalendar();
        wsUpdateCalDetail();
        wsHolidayIconState("ok");
        showToast("刷新成功");
      })
      .catch(function (e) {
        clearTimeout(timer);
        let msg;
        if (ctrl && ctrl.signal.aborted) msg = "法定假期刷新失败，接口无响应";
        else msg = "法定假期刷新失败：" + ((e && e.message) ? e.message : e);
        wsHolidayIconState("failed", msg + "（点击📅重试）");
        showToast(msg);
      })
      .finally(function () {
        if (icon) icon.classList.remove("loading");
      });
  }

  // 公历转农历
  function wsSolarToLunar(y, m, d) {
    const date = new Date(y, m - 1, d);
    const years = Object.keys(WS_LUNAR).map(Number).sort();
    let lunarYear = null;
    for (const ly of years) {
      const s = WS_LUNAR[ly].start;
      const next = ly + 1;
      const start = new Date(ly, s[0] - 1, s[1]);
      const nextStart = WS_LUNAR[next] ? new Date(next, WS_LUNAR[next].start[0] - 1, WS_LUNAR[next].start[1]) : new Date(ly + 1, 11, 31);
      if (date >= start && date < nextStart) { lunarYear = ly; break; }
    }
    if (!lunarYear) return null;
    const data = WS_LUNAR[lunarYear];
    const startDate = new Date(lunarYear, data.start[0] - 1, data.start[1]);
    let days = Math.floor((date - startDate) / 86400000);
    for (let i = 0; i < data.months.length; i++) {
      if (days < data.months[i]) return { year: lunarYear, month: i + 1, day: days + 1 };
      days -= data.months[i];
    }
    return null;
  }

  // 工作台数据初始化
  const WS_TODO_STATUS = { todo: "待办", doing: "进行中", done: "已完成" };
  const WS_TODO_SEQ = ["todo", "doing", "done"];
  const WS_TODO_PRIORITY = {
    P0: { label: "P0", color: "#ef4444" },
    P1: { label: "P1", color: "#ec4899" },
    P2: { label: "P2", color: "#eab308" },
    P3: { label: "P3", color: "#22c55e" },
    P4: { label: "P4", color: "#9ca3af" }
  };
  const WS_TODO_PRIO_SEQ = ["P0", "P1", "P2", "P3", "P4"];
  // 将文本中的 #标签 渲染为彩色 chip（先转义再替换，避免 XSS）
  function wsTagHtml(text) {
    const esc = escapeHtml(text || "");
    return esc.replace(/#([^\s#]+)/g, '<span class="ws-tag">#$1</span>');
  }
  function wsEnsure() {
    if (!CONFIG.workspace) CONFIG.workspace = {};
    if (!Array.isArray(CONFIG.workspace.sparks)) CONFIG.workspace.sparks = [];
    if (!Array.isArray(CONFIG.workspace.components)) CONFIG.workspace.components = [];
    // todos 复用 stickyNotes，添加 order 字段用于拖拽排序
    if (!Array.isArray(CONFIG.workspace.todos)) {
      CONFIG.workspace.todos = (CONFIG.stickyNotes || []).map((n, i) => ({
        id: n.id, text: n.text, status: n.status || "todo",
        order: i, created: n.created || Date.now()
      }));
    } else {
      // 迁移旧布尔值 done 到新状态
      CONFIG.workspace.todos.forEach(t => {
        if (typeof t.done === "boolean") { t.status = t.done ? "done" : "todo"; delete t.done; }
        if (!t.status) t.status = "todo";
        if (!t.priority) t.priority = "P4";
      });
    }
    // 清理已移除功能的旧数据
    delete CONFIG.workspace.progress;
    delete CONFIG.workspace.bg;
  }
  function wsGenId() { return "ws_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6); }

  // 初始化工作台
  let wsCurrentDate = new Date();
  let wsSelectedDate = null;
  let wsInited = false;
  function wsInit() {
    wsEnsure();
    if (!wsInited) {
      // 年份下拉
      const yearSel = document.getElementById("wsCalYear");
      if (yearSel) {
        yearSel.innerHTML = "";
        [2025, 2026, 2027, 2028].forEach(y => {
          const o = document.createElement("option");
          o.value = y; o.textContent = y + "年";
          yearSel.appendChild(o);
        });
      }
      // 月份下拉
      const monSel = document.getElementById("wsCalMonth");
      if (monSel) {
        monSel.innerHTML = "";
        for (let m = 1; m <= 12; m++) {
          const o = document.createElement("option");
          o.value = m; o.textContent = m + "月";
          monSel.appendChild(o);
        }
      }
      // 事件绑定
      const todoInput = document.getElementById("wsTodoInput");
      if (todoInput) todoInput.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); wsAddTodo(); } });
      const sparkInput = document.getElementById("wsSparkInput");
      if (sparkInput) {
        let sparkPendingEnter = false;
        sparkInput.addEventListener("compositionstart", () => { sparkPendingEnter = false; });
        sparkInput.addEventListener("keydown", e => {
          if (e.key !== "Enter" || e.shiftKey) return;
          // 中文输入法组合状态下按回车是「确认候选词」，应交给输入法，不触发保存
          if (e.isComposing || e.keyCode === 229) { sparkPendingEnter = true; return; }
          e.preventDefault();
          e.stopPropagation();
          wsAddSpark();
        });
        sparkInput.addEventListener("compositionend", () => {
          // 若刚才是用回车确认的输入法，则中文已上屏，自动保存这条灵感
          if (sparkPendingEnter) { sparkPendingEnter = false; wsAddSpark(); }
        });
      }
      wsInited = true;
    }
    wsCurrentDate = new Date();
    wsSelectedDate = wsSelectedDate || new Date(wsCurrentDate.getFullYear(), wsCurrentDate.getMonth(), wsCurrentDate.getDate());
    const ySel = document.getElementById("wsCalYear");
    const mSel = document.getElementById("wsCalMonth");
    if (ySel) ySel.value = wsCurrentDate.getFullYear();
    if (mSel) mSel.value = wsCurrentDate.getMonth() + 1;
    wsRenderCalendar();
    wsRenderTodos();
    wsRenderSparks();
    wsRenderWeekend();
    wsRenderTopStats();
    wsRenderDIY();
    wsStartComponentTick();
  }
  
    // 日历渲染
  function wsCalNav(dir) {
    let m = parseInt(document.getElementById("wsCalMonth").value);
    let y = parseInt(document.getElementById("wsCalYear").value);
    m += dir;
    if (m < 1) { m = 12; y--; }
    if (m > 12) { m = 1; y++; }
    document.getElementById("wsCalYear").value = y;
    document.getElementById("wsCalMonth").value = m;
    wsRenderCalendar();
  }
  function wsCalToday() {
    const now = new Date();
    document.getElementById("wsCalYear").value = now.getFullYear();
    document.getElementById("wsCalMonth").value = now.getMonth() + 1;
    wsSelectedDate = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    wsRenderCalendar();
  }
  function wsFmtKey(y, m, d) { return y + "-" + String(m).padStart(2, "0") + "-" + String(d).padStart(2, "0"); }
  function wsRenderCalendar() {
    const grid = document.getElementById("wsCalGrid");
    if (!grid) return;
    grid.innerHTML = "";
    const y = parseInt(document.getElementById("wsCalYear").value);
    const m = parseInt(document.getElementById("wsCalMonth").value);
    const today = new Date();
    const todayKey = wsFmtKey(today.getFullYear(), today.getMonth() + 1, today.getDate());
    // 当月第一天
    const first = new Date(y, m - 1, 1);
    // 周一为一周开始：getDay() 返回 0=周日，调整为 0=周一
    const firstDay = (first.getDay() + 6) % 7;
    // 上月填充
    const prevLast = new Date(y, m - 1, 0).getDate();
    for (let i = firstDay - 1; i >= 0; i--) {
      const d = prevLast - i;
      const prevM = m === 1 ? 12 : m - 1;
      const prevY = m === 1 ? y - 1 : y;
      grid.appendChild(wsBuildDay(prevY, prevM, d, true, todayKey));
    }
    // 当月
    const lastDay = new Date(y, m, 0).getDate();
    for (let d = 1; d <= lastDay; d++) {
      grid.appendChild(wsBuildDay(y, m, d, false, todayKey));
    }
    // 下月填充到 42 格
    const total = grid.children.length;
    let nextD = 1;
    const nextM = m === 12 ? 1 : m + 1;
    const nextY = m === 12 ? y + 1 : y;
    for (let i = total; i < 42; i++) {
      grid.appendChild(wsBuildDay(nextY, nextM, nextD, true, todayKey));
      nextD++;
    }
    wsUpdateCalDetail();
  }
  function wsBuildDay(y, m, d, other, todayKey) {
    const cell = document.createElement("div");
    cell.className = "ws-cal-day";
    const key = wsFmtKey(y, m, d);
    const isToday = key === todayKey;
    if (other) cell.classList.add("other");
    if (isToday) cell.classList.add("today");
    const sel = wsSelectedDate && wsFmtKey(wsSelectedDate.getFullYear(), wsSelectedDate.getMonth() + 1, wsSelectedDate.getDate()) === key;
    if (sel) cell.classList.add("selected");
    // 节假日
    const hol = wsGetHolidays(y)[key];
    const wd = new Date(y, m - 1, d).getDay();
    const isWeekend = wd === 0 || wd === 6;
    let tagHtml = "";
    if (hol) {
      if (hol.rest) { cell.classList.add("rest-legal"); tagHtml = '<span class="ws-cal-tag rest-legal">休</span>'; }
      else { cell.classList.add("work-legal"); tagHtml = '<span class="ws-cal-tag work-legal">班</span>'; }
    } else if (isWeekend) {
      const wmode = wsWeekendModeForDate(new Date(y, m - 1, d));
      if (wmode === "none") {
        cell.classList.add("rest"); // 不显假期：仅灰显，不显示班/休标签（=原状）
      } else if (wmode === "dual") {
        cell.classList.add("rest"); tagHtml = '<span class="ws-cal-tag rest">休</span>';
      } else { // single：周六上班、周日休息
        if (wd === 6) { cell.classList.add("work"); tagHtml = '<span class="ws-cal-tag work">班</span>'; }
        else { cell.classList.add("rest"); tagHtml = '<span class="ws-cal-tag rest">休</span>'; }
      }
    }
    // 农历
    const lunar = wsSolarToLunar(y, m, d);
    let lunarTxt = "";
    let lunarFest = false;
    if (lunar) {
      if (lunar.day === 1) lunarTxt = WS_LUNAR_MONTH[lunar.month - 1];
      else lunarTxt = WS_LUNAR_DAY[lunar.day - 1];
      const fkey = lunar.month + "-" + lunar.day;
      if (hol && hol.rest) { lunarTxt = hol.name; lunarFest = true; }           // 法定休假日优先显示官方全称
      else if (WS_LUNAR_FEST[fkey]) { lunarTxt = WS_LUNAR_FEST[fkey]; lunarFest = true; }
    }
    const termKey = m + "-" + d;
    if (WS_SOLAR_TERM[termKey]) { lunarTxt = WS_SOLAR_TERM[termKey]; lunarFest = true; }
    cell.innerHTML = '<span class="ws-cal-num">' + d + '</span>' +
      (lunarTxt ? '<span class="ws-cal-lunar' + (lunarFest ? ' fest' : '') + '">' + lunarTxt + '</span>' : '') +
      tagHtml;
    cell.onclick = () => {
      wsSelectedDate = new Date(y, m - 1, d);
      wsRenderCalendar();
    };
    return cell;
  }
  function wsUpdateCalDetail() {
    const el = document.getElementById("wsCalDetail");
    if (!el || !wsSelectedDate) return;
    const y = wsSelectedDate.getFullYear();
    const m = wsSelectedDate.getMonth() + 1;
    const d = wsSelectedDate.getDate();
    const key = wsFmtKey(y, m, d);
    const hol = wsGetHolidays(y)[key];
    const lunar = wsSolarToLunar(y, m, d);
    const wd = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"][new Date(y, m-1, d).getDay()];
    let html = '<div class="ws-cal-detail-title"><span class="ws-cal-detail-title-text">' + y + '年' + m + '月' + d + '日 ' + wd + '</span>';
    const items = [];
    if (lunar) items.push("农历" + WS_LUNAR_MONTH[lunar.month - 1] + WS_LUNAR_DAY[lunar.day - 1]);
    const termKey = m + "-" + d;
    if (WS_SOLAR_TERM[termKey]) items.push("节气 · " + WS_SOLAR_TERM[termKey]);
    const festKey = lunar ? (lunar.month + "-" + lunar.day) : null;
    // 若当天是法定休假日，其名称已含官方全称（如"中秋节"），不再重复显示"传统 · 中秋"
    if (festKey && WS_LUNAR_FEST[festKey] && !(hol && hol.rest)) items.push("传统 · " + WS_LUNAR_FEST[festKey]);
    if (hol) {
      if (hol.rest) items.push("法定 · " + hol.name + "（休）");
      else items.push(hol.name); // 调休日 name 本身已是 "调休上班"，避免再拼 "调休 · " 导致重复
    }
    // 周末单/双休说明（无法定标记时补充，便于理解当前周班休安排）
    const wdNum = new Date(y, m - 1, d).getDay();
    const isWeekendDay = wdNum === 0 || wdNum === 6;
    if (isWeekendDay && !hol) {
      const wmode = wsWeekendModeForDate(new Date(y, m - 1, d));
      if (wmode === "dual") items.push("周末 · 双休");
      else if (wmode === "single") items.push(wdNum === 6 ? "周末 · 单休（周六上班）" : "周末 · 单休（周日休息）");
    }
    const today = new Date();
    const todayKey = wsFmtKey(today.getFullYear(), today.getMonth() + 1, today.getDate());
    if (key !== todayKey) {
      const diff = Math.round((new Date(y, m - 1, d) - today) / 86400000);
      if (diff > 0) html += '<span class="ws-cal-detail-diff">⏱ 距离 ' + key + ' 还有 ' + diff + ' 天</span>';
      else if (diff < 0) html += '<span class="ws-cal-detail-diff">⏱ ' + (-diff) + ' 天前</span>';
    }
    html += '</div>';
    if (items.length) html += '<div>' + items.join(" · ") + '</div>';
    el.innerHTML = html;
  }

  // 我的待办（中间栏 + 首页漂浮弹窗共用同一套渲染/交互）
  // 生成单个待办（或子待办）DOM；parentId 为空表示顶层
  function wsTodoItemEl(t, parentId) {
    const st = t.status || "todo";
    const prio = t.priority || "P4";
    const pColor = (WS_TODO_PRIORITY[prio] || WS_TODO_PRIORITY.P4).color;
    const item = document.createElement("div");
    item.className = "ws-todo-item" + (parentId ? " ws-todo-child" : "") + (st === "done" ? " done" : "");
    if (!parentId) item.draggable = true;
    item.dataset.id = t.id;
    item.dataset.parent = parentId || "";
    item.style.borderLeftColor = pColor;
    const prioOpts = WS_TODO_PRIO_SEQ.map(p => {
      const c = (WS_TODO_PRIORITY[p] || WS_TODO_PRIORITY.P4).color;
      return '<option value="' + p + '"' + (p === prio ? " selected" : "") + ' style="color:' + c + '">' + p + '</option>';
    }).join("");
    // 操作区（优先级 + 下级 + 编辑 + 删除）：默认隐藏，鼠标移到右侧热区才从右向左漂浮出来
    let actions = '<div class="ws-todo-actions">';
    actions += '<select class="ws-todo-prio" data-id="' + t.id + '" data-parent="' + (parentId || "") + '" title="设置优先级" style="color:' + pColor + '">' + prioOpts + '</select>';
    if (!parentId) actions += '<button type="button" class="ws-todo-sub" data-id="' + t.id + '" title="添加下级">＋</button>';
    actions += '<button type="button" class="ws-todo-act edit" data-id="' + t.id + '" data-parent="' + (parentId || "") + '" title="编辑">✎</button>';
    actions += '<button type="button" class="ws-todo-act del" data-id="' + t.id + '" data-parent="' + (parentId || "") + '" title="删除">🗑</button>';
    actions += '</div>';
    const row = document.createElement("div");
    row.className = "ws-todo-row";
    row.innerHTML =
      '<span class="ws-todo-grip">⠿</span>' +
      '<span class="ws-todo-status ' + st + '" data-id="' + t.id + '" data-parent="' + (parentId || "") + '" title="点击切换状态">' + (WS_TODO_STATUS[st] || "待办") + '</span>' +
      '<span class="ws-todo-text">' + wsTagHtml(t.text) + '</span>' +
      '<span class="ws-todo-hoverzone"></span>' +
      actions;
    item.appendChild(row);
    if (!parentId) {
      const children = Array.isArray(t.children) ? t.children : [];
      const wrap = document.createElement("div");
      wrap.className = "ws-todo-children";
      wrap.dataset.parent = t.id;
      children.forEach(c => wrap.appendChild(wsTodoItemEl(c, t.id)));
      item.appendChild(wrap);
    }
    return item;
  }
  // 核心渲染器：把 CONFIG.workspace.todos 渲染进任意列表容器并绑定事件
  function wsRenderTodoList(listEl) {
    if (!listEl) return;
    const todos = (CONFIG.workspace.todos || []).slice().sort((a, b) => (a.order || 0) - (b.order || 0));
    if (!todos.length) {
      listEl.innerHTML = '<div class="ws-todo-empty">还没有待办，有需要随时添加哦 ✨</div>';
      return;
    }
    listEl.innerHTML = "";
    todos.forEach((t) => listEl.appendChild(wsTodoItemEl(t, null)));
    wsBindTodoListEvents(listEl);
  }
  function wsFindTodo(id, parentId) {
    if (parentId) {
      const p = (CONFIG.workspace.todos || []).find(x => x.id === parentId);
      return p && Array.isArray(p.children) ? p.children.find(c => c.id === id) : null;
    }
    return (CONFIG.workspace.todos || []).find(x => x.id === id);
  }
  function wsBindTodoListEvents(listEl) {
    // 确保全局拖拽兜底已注册（防止待办拖出打开新页面），只在首次注册一次
    if (!document._wsSortDragGuard) {
      document._wsSortDragGuard = function (e) { if (wsActiveDrag) e.preventDefault(); };
      document.addEventListener("dragover", document._wsSortDragGuard, true);
      document.addEventListener("drop", document._wsSortDragGuard, true);
    }
    listEl.querySelectorAll(".ws-todo-status").forEach(c => {
      c.onclick = (e) => { e.stopPropagation(); wsCycleTodoStatus(c.dataset.id, c.dataset.parent); };
    });
    listEl.querySelectorAll(".ws-todo-act.del").forEach(b => {
      b.onclick = (e) => { e.stopPropagation(); wsDeleteTodo(b.dataset.id, b.dataset.parent); };
    });
    listEl.querySelectorAll(".ws-todo-act.edit").forEach(b => {
      b.onclick = (e) => { e.stopPropagation(); wsEditTodo(b.closest(".ws-todo-list"), b.dataset.id, b.dataset.parent); };
    });
    listEl.querySelectorAll(".ws-todo-sub").forEach(b => {
      b.onclick = (e) => { e.stopPropagation(); wsToggleTodoSubAdd(b.closest(".ws-todo-list"), b.dataset.id); };
    });
    listEl.querySelectorAll(".ws-todo-prio").forEach(sel => {
      sel.onchange = (e) => {
        e.stopPropagation();
        wsSetTodoPriority(sel.dataset.id, sel.value, sel.dataset.parent);
      };
      sel.onclick = (e) => e.stopPropagation();
      sel.onmousedown = (e) => e.stopPropagation();
    });
    // 拖拽排序（仅顶层，基于可见顺序实时重排，落点精准）
    listEl.querySelectorAll(".ws-todo-item:not(.ws-todo-child)").forEach(item => {
      item.addEventListener("dragstart", e => {
        if (e.target.closest(".ws-todo-prio") || e.target.closest(".ws-todo-act") || e.target.closest(".ws-todo-sub") || e.target.closest(".ws-todo-status")) {
          e.preventDefault();
          return;
        }
        wsActiveDrag = true;
        item.classList.add("dragging");
        e.dataTransfer.effectAllowed = "move";
        try { e.dataTransfer.setData("text/plain", item.dataset.id); } catch (_) {}
      });
      item.addEventListener("dragend", () => {
        wsActiveDrag = false;
        item.classList.remove("dragging");
        // 拖到列表外（无有效 drop）时按当前 DOM 顺序归一化，避免回弹错位
        const ids = Array.from(listEl.querySelectorAll(".ws-todo-item:not(.ws-todo-child)")).map(el => el.dataset.id);
        ids.forEach((id, i) => { const t = (CONFIG.workspace.todos || []).find(x => x.id === id); if (t) t.order = i; });
        saveConfig();
        wsRenderAllTodos();
      });
      item.addEventListener("dragover", e => {
        e.preventDefault();
        const dragging = listEl.querySelector(".ws-todo-item.dragging");
        if (!dragging || dragging === item) return;
        const box = item.getBoundingClientRect();
        const isAfter = e.clientY > box.top + box.height / 2;
        // 实时把被拖元素移动到光标所在位置，所见即所得
        listEl.insertBefore(dragging, isAfter ? item.nextSibling : item);
      });
      item.addEventListener("drop", e => {
        e.preventDefault();
        // 直接按当前 DOM 顺序持久化（与用户看到的完全一致）
        const ids = Array.from(listEl.querySelectorAll(".ws-todo-item:not(.ws-todo-child)")).map(el => el.dataset.id);
        ids.forEach((id, i) => { const t = (CONFIG.workspace.todos || []).find(x => x.id === id); if (t) t.order = i; });
        saveConfig();
        wsRenderAllTodos();
      });
    });
  }

  // 灵感火花（右栏）：支持一级 + 二级（下级），均可转待办、编辑、删除
  function wsNormalizeSparks() {
    let changed = false;
    const sparks = CONFIG.workspace.sparks || [];
    sparks.forEach(s => {
      if (!Array.isArray(s.children)) { s.children = []; changed = true; return; }
      const flat = [];
      const queue = s.children.slice();
      while (queue.length) {
        const c = queue.shift();
        if (c && typeof c === "object") {
          const { children, ...rest } = c;
          flat.push(rest);
          if (Array.isArray(children)) queue.push(...children);
        }
      }
      if (flat.length !== s.children.length) changed = true;
      s.children = flat;
    });
    if (changed) saveConfig();
  }
  // 兜底：渲染结束后再次把任何还残留的"二级套二级"强制拍平。
  // 逻辑：只要一个 .ws-spark-child 出现在另一个 .ws-spark-child 内部，就把外层 child
  // 降级为内层 child 的兄弟节点。最终保证 .ws-spark-item > .ws-spark-children
  // 是所有二级的唯一容器，且二级之间互不嵌套。
  function wsFlattenSparkDom() {
    const list = document.getElementById("wsSparkList");
    if (!list) return;
    list.querySelectorAll(".ws-spark-item").forEach(item => {
      // 找到一级卡片自己的二级容器
      let outer = item.querySelector(":scope > .ws-spark-children");
      if (!outer) {
        outer = document.createElement("div");
        outer.className = "ws-spark-children";
        item.appendChild(outer);
      }
      let safety = 200;
      while (safety-- > 0) {
        // 找出任何在 ws-spark-child 内部又包含 ws-spark-child 的元素
        const innerChild = item.querySelector(".ws-spark-child .ws-spark-child");
        if (!innerChild) break;
        const offending = innerChild.parentElement; // 这个就是错误的外层 child
        if (offending && offending.classList.contains("ws-spark-child") && offending.parentElement) {
          // 把 offending 移到 outer 下，作为兄弟
          outer.appendChild(offending);
        }
      }
      // 兜底再清一次空 children 容器
      item.querySelectorAll(".ws-spark-children .ws-spark-children").forEach(n => n.remove());
    });
  }
  function wsRenderSparks() {
    wsNormalizeSparks();
    const list = document.getElementById("wsSparkList");
    if (!list) return;
    const sparks = (CONFIG.workspace.sparks || []).slice().sort((a, b) => (b.created || 0) - (a.created || 0));
    list.innerHTML = "";
    if (!sparks.length) {
      list.innerHTML = '<div class="ws-spark-empty">还没有灵感，随手记一条吧 ✨</div>';
      wsRenderTopStats();
      return;
    }
    sparks.forEach(s => {
      // 用纯 DOM API 构建一级卡片，从根本上保证二级永远在 .ws-spark-children 容器下
      const item = document.createElement("div");
      item.className = "ws-spark-item";
      item.dataset.id = s.id;
      // 文本区
      const text = document.createElement("div");
      text.className = "ws-spark-text";
      text.innerHTML = (s.text || "").replace(/#([^\s#]+)/g, '<span class="ws-spark-tag">#$1</span>');
      item.appendChild(text);
      // 元信息 + 操作按钮
      const meta = document.createElement("div");
      meta.className = "ws-spark-meta";
      const dateSpan = document.createElement("span");
      dateSpan.textContent = wsSparkDateStr(s.updated || s.created) + (s.updated ? " 更新" : " 创建");
      meta.appendChild(dateSpan);
      const actions = document.createElement("div");
      actions.className = "ws-spark-actions";
      const mkBtn = (cls, txt, title, id, parent) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = cls;
        b.textContent = txt;
        b.title = title;
        b.dataset.id = id;
        if (parent) b.dataset.parent = parent;
        actions.appendChild(b);
      };
      mkBtn("ws-spark-btn sub", "+下级", "添加下级", s.id);
      mkBtn("ws-spark-btn totodo", "转待办", "转为待办", s.id);
      mkBtn("ws-spark-icon-btn edit", "✎", "编辑", s.id);
      mkBtn("ws-spark-icon-btn del", "🗑", "删除", s.id);
      meta.appendChild(actions);
      item.appendChild(meta);
      // 二级容器（永远是一级卡片的直接子元素）
      const childrenWrap = document.createElement("div");
      childrenWrap.className = "ws-spark-children";
      childrenWrap.dataset.parent = s.id;
      item.appendChild(childrenWrap);
      // 二级方框（直接挂到 childrenWrap，不允许任何嵌套）
      const children = Array.isArray(s.children) ? s.children : [];
      children.forEach(c => childrenWrap.appendChild(wsBuildSparkChild(c, s.id)));
      list.appendChild(item);
    });
    wsFlattenSparkDom();
    wsBindSparkEvents();
    wsRenderTopStats();
  }
  function wsBuildSparkChild(c, parentId) {
    const child = document.createElement("div");
    child.className = "ws-spark-child";
    child.dataset.id = c.id;
    child.dataset.parent = parentId;
    child.style.marginLeft = "0";
    const rawText = c.text || "";
    // 文字多于 9 字：功能区（转待办/编辑/删除）独占一行并右对齐；否则与文字同处一行
    const row = document.createElement("div");
    row.className = "ws-spark-row" + (rawText.length > 9 ? " ws-spark-row--wrap" : "");
    const text = document.createElement("div");
    text.className = "ws-spark-text";
    text.innerHTML = rawText.replace(/#([^\s#]+)/g, '<span class="ws-spark-tag">#$1</span>');
    const actions = document.createElement("div");
    actions.className = "ws-spark-actions";
    const mkBtn = (cls, txt, title, id, parent) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = cls;
      b.textContent = txt;
      b.title = title;
      b.dataset.id = id;
      if (parent) b.dataset.parent = parent;
      actions.appendChild(b);
    };
    // 注意：二级**故意不放** "+下级" 按钮，禁止在二级里再创建二级
    mkBtn("ws-spark-btn totodo", "转待办", "转为待办", c.id, parentId);
    mkBtn("ws-spark-icon-btn edit", "✎", "编辑", c.id, parentId);
    mkBtn("ws-spark-icon-btn del", "🗑", "删除", c.id, parentId);
    row.appendChild(text);
    row.appendChild(actions);
    child.appendChild(row);
    return child;
  }
  function wsSparkDateStr(ts) {
    const date = new Date(ts || Date.now());

  function wsSparkToTodo(id, parentId) {
    const s = wsFindSpark(id, parentId);
    if (!s) return;
    // 一级灵感火花且有二级时，询问是否连同二级一起转待办
    if (!parentId && Array.isArray(s.children) && s.children.length) {
      wsConfirm("您的灵感火花有二级，请问是否统一转待办二级？",
        () => wsSparkToTodoDo(s, true),
        () => wsSparkToTodoDo(s, false));
      return;
    }
    wsSparkToTodoDo(s, false);
  }
  function wsSparkToTodoDo(s, withChildren) {
    if (!Array.isArray(CONFIG.workspace.todos)) CONFIG.workspace.todos = [];
    const maxOrder = CONFIG.workspace.todos.reduce((m, t) => Math.max(m, t.order || 0), -1);
    const todo = { id: wsGenId(), text: s.text, status: "todo", priority: "P4", order: maxOrder + 1, created: Date.now() };
    if (withChildren && Array.isArray(s.children)) {
      todo.children = s.children.map(c => ({ id: wsGenId(), text: c.text, status: "todo", priority: "P4", created: Date.now() }));
    }
    CONFIG.workspace.todos.unshift(todo);
    saveConfig();
    wsRenderAllTodos();
    showToast(withChildren ? "已连同二级转为待办" : "已转为待办");
  }

  // 周末假期模式：计算日期所属「周」的 key（以周一为一周起点）
  function wsWeekKey(dt) {
    const d = new Date(dt.getFullYear(), dt.getMonth(), dt.getDate());
    const day = d.getDay(); // 0=日 1=一 ... 6=六
    const off = (day === 0) ? -6 : (1 - day);
    d.setDate(d.getDate() + off);
    return wsFmtKey(d.getFullYear(), d.getMonth() + 1, d.getDate());
  }
  // 返回某日期的周末模式：none(不显示) / single(单休) / dual(双休)
  // 规则：
  //   none / alwaysSingle / alwaysDual -> 固定
  //   weekSingle / weekDual -> 大小周：以设置当周为基准，每隔一周切换一次。
  //   例：本周单休 -> 本周/隔周单休，其余双休；本周双休 -> 本周/隔周双休，其余单休。
  function wsWeekendModeForDate(dt) {
    const s = CONFIG.settings || {};
    const mode = s.weekendMode || "alwaysDual";
    if (mode === "none") return "none";
    if (mode === "alwaysSingle") return "single";
    if (mode === "alwaysDual") return "dual";
    // 大小周计算
    let baseWeek = s.weekendBaseWeek;
    let baseMode = s.weekendBaseMode;
    // 兼容旧数据（之前只用 weekendWeekLog 记录当周）
    if (!baseWeek && s.weekendWeekLog) {
      const keys = Object.keys(s.weekendWeekLog);
      if (keys.length) { baseWeek = keys[0]; baseMode = s.weekendWeekLog[keys[0]]; }
    }
    if (!baseWeek) {
      // 尚未设置基准：按当前选择解释"本周"
      baseWeek = wsWeekKey(new Date());
      baseMode = (mode === "weekSingle") ? "single" : "dual";
    }
    const wk = wsWeekKey(dt);
    const parse = function (k) { const p = k.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); };
    const diffDays = (parse(wk) - parse(baseWeek)) / (24 * 60 * 60 * 1000);
    const diffWeeks = Math.round(diffDays / 7);
    const useBase = (diffWeeks % 2 === 0);
    return useBase ? baseMode : (baseMode === "single" ? "dual" : "single");
  }

  function startTick() {

  function tick() {
    const now = new Date();
    if (CONFIG.settings.showClock !== false) {
      const h = String(now.getHours()).padStart(2, "0");
      const m = String(now.getMinutes()).padStart(2, "0");
      const s = String(now.getSeconds()).padStart(2, "0");
      document.getElementById("clock").textContent = CONFIG.settings.clockFormat === "hm" ? (h + ":" + m) : (h + ":" + m + ":" + s);
      const days = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
      document.getElementById("dateStr").textContent = now.getFullYear() + "年" + (now.getMonth()+1) + "月" + now.getDate() + "日";
      document.getElementById("weekdayStr").textContent = days[now.getDay()];
    }
    if (CONFIG.settings.showOffWork) updateOffWork(now);
    if (CONFIG.settings.showPayday) updatePayday(now);
    if (CONFIG.settings.showEvents !== false) updateEvents(now);
    // 日出日落主题：每分钟检查一次，到日出/日落时刻自动切换
    if (CONFIG.settings.theme === "sun" && now.getSeconds() === 0) applyTheme();

  function greeting(now) {

    if (h < 5) base = "夜深了，注意休息 🌙";
    else if (h < 9) base = "早上好，新的一天 ☀️";
    else if (h < 12) base = "上午好，元气满满 ✨";
    else if (h < 14) base = "中午好，记得吃饭 🍱";

    // 健康提醒：每 10 分钟自动轮换一条
    const tips = [

  function updateOffWork(now) {
    const [h, m] = (CONFIG.settings.offWorkTime || "18:30").split(":").map(Number);
    let target = new Date(now); target.setHours(h, m, 0, 0);
    let passed = target <= now;
    if (passed) target.setDate(target.getDate() + 1);
    let diff = Math.max(0, Math.floor((target - now) / 1000));
    const hh = String(Math.floor(diff / 3600)).padStart(2, "0");
    const mm = String(Math.floor((diff % 3600) / 60)).padStart(2, "0");
    const ss = String(diff % 60).padStart(2, "0");
    document.getElementById("offWorkVal").textContent = hh + ":" + mm + ":" + ss;
    document.getElementById("offWorkSub").textContent = passed ? "已过下班时间 🎉" : "距 " + CONFIG.settings.offWorkTime;
  }
  function getNextPayday(day, now) {
    const clamp = (y, mo, d) => { const dim = new Date(y, mo + 1, 0).getDate(); return new Date(y, mo, Math.min(d, dim), 0, 0, 0); };
    let y = now.getFullYear(), mo = now.getMonth();
    let cand = clamp(y, mo, day);
    if (cand <= now) { mo++; if (mo > 11) { mo = 0; y++; } cand = clamp(y, mo, day); }
    return cand;
  }
  function updatePayday(now) {
    const day = parseInt(CONFIG.settings.payDay || "10", 10);
    const next = getNextPayday(day, now);
    const days = Math.ceil((next - now) / 86400000);
    document.getElementById("paydayVal").textContent = days + " 天";
    document.getElementById("paydaySub").textContent = (next.getMonth() + 1) + "月" + next.getDate() + "日 发薪";
  }

  function parseDateStr(str) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(str || "");
    if (!m) return null;
    return new Date(+m[1], +m[2] - 1, +m[3]);
  }
  function formatEventDate(dateStr) {
    const t = parseDateStr(dateStr);
    if (!t) return "";
    return t.getFullYear() + "年" + (t.getMonth() + 1) + "月" + t.getDate() + "日";
  }
  function eventDays(ev, now) {
    const t = parseDateStr(ev.date);
    if (!t) return null;
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    if (ev.type === "festival") {
      let target = new Date(now.getFullYear(), t.getMonth(), t.getDate());
      if (target < today) target = new Date(now.getFullYear() + 1, t.getMonth(), t.getDate());
      return Math.round((target - today) / 86400000);
    }
    return Math.round((today - t) / 86400000);
  }

    if (s.showEvents === false) return;

      const el = wrap.querySelector('.event-card[data-id="' + ev.id + '"] .w-value');

  // 按 IP 定位城市：script 注入（无跨域限制，file:// 与国内直连可用）优先，fetch 兜底；结果缓存 6 小时
  function loadScriptOnce(url, charset, timeoutMs) {
    return new Promise((resolve, reject) => {
      const s = document.createElement("script");
      let settled = false;
      const finish = (ok) => {
        if (settled) return;
        settled = true;
        clearTimeout(timer);
        s.onload = s.onerror = null;
        if (s.parentNode) s.parentNode.removeChild(s);
        ok ? resolve() : reject(new Error("load fail"));
      };
      const timer = setTimeout(() => finish(false), timeoutMs || 5000);
      s.onload = () => finish(true);
      s.onerror = () => finish(false);
      if (charset) s.charset = charset;
      s.src = url;
      document.head.appendChild(s);
    });
  }
  // 从「广东省深圳市 / 内蒙古自治区呼和浩特市 / 北京市」等字符串提取城市名
  function parseCityName(raw) {
    if (!raw) return "";
    let s = String(raw).trim();
    const zi = s.lastIndexOf("自治区");
    const idx = Math.max(s.lastIndexOf("省"), zi);
    if (idx > -1) s = s.slice(idx + (zi === idx ? 3 : 1));
    s = s.replace(/(特别行政区|维吾尔自治区|壮族自治区|回族自治区|自治区|省|市|地区|盟|自治州|州)+$/g, "");
    return s.trim();
  }
  // 校验定位结果：排除「未知」等无效值（代理环境下搜狐会返回 cname=未知）
  function validCity(c) {
    if (!c) return false;
    const s = String(c).trim();
    if (!s) return false;
    const bad = ["未知", "unknown", "none", "null", "-", " reserved"];
    return bad.indexOf(s.toLowerCase()) === -1;
  }
  async function detectCityByIP() {
    try {
      const cache = JSON.parse(localStorage.getItem("nav_ipcity") || "null");
      if (cache && validCity(cache.city) && Date.now() - cache.ts < 6 * 3600e3) return cache.city;
      localStorage.removeItem("nav_ipcity"); // 清掉无效/过期缓存
    } catch (e) {}
    const save = (c) => { localStorage.setItem("nav_ipcity", JSON.stringify({ city: c, ts: Date.now() })); return c; };
    // 第一批：fetch 源（已实测返回 Access-Control-Allow-Origin:*，file:// 可用，国内直连）
    const fetchSources = [
      async () => { const r = await fetch("https://myip.ipip.net/json"); const j = await r.json(); return j.data && j.data.location && (j.data.location[2] || j.data.location[1]); },
      async () => { const r = await fetch("https://api.ip.sb/geoip"); const j = await r.json(); return j.city; }
    ];
    for (const fn of fetchSources) {
      try {
        const c = parseCityName(await fn());
        if (validCity(c)) return save(c);
      } catch (e) {}
    }
    // 第二批：script 注入源（避开 CORS；代理下可能返回「未知」，已用 validCity 校验）
    try {
      await loadScriptOnce("https://pv.sohu.com/cityjson?ie=utf-8", "utf-8", 5000);
      const c = parseCityName(window.returnCitySN && window.returnCitySN.cname);
      if (validCity(c)) return save(c);
    } catch (e) {}
    // 第三批：其余 fetch 兜底（境外/代理环境）
    const moreSources = [
      async () => { const r = await fetch("https://ip.useragentinfo.com/json"); const j = await r.json(); return j.city; },
      async () => { const r = await fetch("https://ipapi.co/json/"); const j = await r.json(); return j.city; }
    ];
    for (const fn of moreSources) {
      try {
        const c = parseCityName(await fn());
        if (validCity(c)) return save(c);
      } catch (e) {}
    }
    throw new Error("IP 定位失败");
  }

  async function loadWeather() {
    let city = (CONFIG.settings.weatherCity || "").trim();
    if (!city) return;
    const auto = city.toLowerCase() === "auto";
    document.getElementById("wCity").textContent = auto ? "📍 定位中…" : city;
    document.getElementById("wTemp").textContent = "…";
    document.getElementById("wMeta").textContent = "";
    try {
      if (auto) city = await detectCityByIP();
      const geo = await fetch("https://geocoding-api.open-meteo.com/v1/search?name=" + encodeURIComponent(city) + "&count=1&language=zh&format=json");
      const geoJ = await geo.json();
      if (!geoJ.results || !geoJ.results.length) throw new Error("城市未找到");
      const { latitude, longitude } = geoJ.results[0];
      const [wRes, aRes] = await Promise.all([
        fetch("https://api.open-meteo.com/v1/forecast?latitude=" + latitude + "&longitude=" + longitude + "&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&timezone=auto"),
        fetch("https://air-quality-api.open-meteo.com/v1/air-quality?latitude=" + latitude + "&longitude=" + longitude + "&current=us_aqi")
      ]);
      const w = await wRes.json();
      const a = await aRes.json();
      const code = w.current.weather_code;
      const info = WMO[code] || ["🌡️", "未知"];
      document.getElementById("wIcon").textContent = info[0];
      document.getElementById("wTemp").textContent = Math.round(w.current.temperature_2m) + "℃";
      document.getElementById("wCity").textContent = (auto ? "📍 " : "") + city + " · " + info[1];
      let meta = "湿度 " + w.current.relative_humidity_2m + "%";
      if (a.current && a.current.us_aqi != null) meta += " · AQI " + Math.round(a.current.us_aqi);
      document.getElementById("wMeta").textContent = meta;
    } catch (e) {
      document.getElementById("wTemp").textContent = "--℃";
      if (auto) document.getElementById("wCity").textContent = "📍 定位失败";
      document.getElementById("wMeta").textContent = auto ? "IP 定位失败，请手动选城市" : "天气获取失败";
    }
  }
