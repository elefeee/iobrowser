  // 汇总所有已保存的收藏 + 分类导航
  function allSavedSites() {
    const list = [];
    (CONFIG.favorites || []).forEach(f => list.push({ name: f.name, url: f.url, icon: f.icon }));
    (CONFIG.categories || []).forEach(c => (c.items || []).forEach(i => list.push({ name: i.name, url: i.url, icon: i.icon })));
    return list;
  }
  // 按名称检索已保存的网页：完全一致 > 前缀 > 包含，按 url 去重，最多 8 条
  function searchSavedSites(q) {
    const s = (q || "").trim().toLowerCase();
    if (!s) return [];
    const seen = {};
    return allSavedSites()
      .map(x => {
        const name = (x.name || "").toLowerCase();
        let score = -1;
        if (name === s) score = 0;
        else if (name.startsWith(s)) score = 1;
        else if (name.indexOf(s) > -1) score = 2;
        return { x, score };
      })
      .filter(a => a.score >= 0)
      .sort((a, b) => a.score - b.score)
      .filter(a => { const k = a.x.url; if (seen[k]) return false; seen[k] = 1; return true; })
      .slice(0, 8)
      .map(a => a.x);
  }
  function onSearchInput() {
    activeSearch = (document.getElementById("searchInput").value || "").trim();
    applySearchFilter();
  }
  // 实时过滤下方卡片：命中显示、未命中隐藏，无命中的分类整块隐藏
  function applySearchFilter() {
    const q = activeSearch;
    const content = document.getElementById("content");
    const es = document.getElementById("searchEmpty");
    if (!q) {
      content.querySelectorAll(".category-section").forEach(sec => { sec.style.display = ""; });
      content.querySelectorAll(".card").forEach(c => { c.style.display = ""; });
      if (es) es.remove();
    } else {
      const ql = q.toLowerCase();
      let anyVisible = false;
      content.querySelectorAll(".category-section").forEach(sec => {
        let any = false;
        sec.querySelectorAll(".card").forEach(card => {
          if (card.classList.contains("add-card")) { card.style.display = "none"; return; }
          const title = (card.querySelector(".card-title") || {}).textContent || "";
          const hit = title.toLowerCase().indexOf(ql) > -1;
          card.style.display = hit ? "" : "none";
          if (hit) any = true;
        });
        sec.style.display = any ? "" : "none";
        if (any) anyVisible = true;
      });
      if (!anyVisible) {
        if (!es) {
          const d = document.createElement("div");
          d.id = "searchEmpty";
          d.className = "empty-state";
          content.appendChild(d);
        }
        document.getElementById("searchEmpty").innerHTML = '<span class="es-icon">🔍</span>未找到与「' + escapeHtml(q) + '」匹配的导航';
      } else if (es) es.remove();
    }
    syncSubNavPortalVisibility();
  }
  function doSearch() {
    const q = document.getElementById("searchInput").value.trim();
    if (!q) return;
    // 优先：完全匹配已保存的网页名称，直接打开
    const exact = searchSavedSites(q).find(r => (r.name || "").toLowerCase() === q.toLowerCase());
    if (exact) {
      window.open(exact.url, "_blank");
      showToast("已打开：" + exact.name);
      return;
    }
    const engine = ENGINES[currentEngine()];
    // 看起来像网址则直接打开
    if (/^https?:\/\//i.test(q) || /^[\w-]+(\.[\w-]+)+(\/.*)?$/.test(q)) {
      const url = /^https?:\/\//i.test(q) ? q : "https://" + q;
      window.open(url, "_blank");
      return;
    }
    window.open(engine.url + encodeURIComponent(q), "_blank");
  }

  function fetchFaviconFromModal() {
    const url = (document.getElementById("fUrl") || {}).value || "";
    const host = getHost(url);
    if (!host) return showToast("请先填写有效网址");
    const prev = document.getElementById("iconPreview");
    if (prev) prev.innerHTML = '<span class="fav-fallback" style="display:flex">⏳</span>';
    const srcs = faviconCandidates(host);
    let i = 0;
    (function tryNext() {
      if (i >= srcs.length) {
        if (prev) prev.innerHTML = '<span class="fav-fallback" style="display:flex">🌐</span>';
        // img 全部失败：改用 fetch 抓支持 CORS 的服务
        fetchFaviconDataUrl(srcs).then(d => {
          if (!d) return showToast("图标抓取失败，将使用 Emoji/自动");
          const u = document.getElementById("fIconUrl");
          if (u) u.value = d;
          const e = document.getElementById("fIcon");
          if (e) e.value = "";
          renderModalIcon();
          showToast("已抓取网站图标");
        });
        return;
      }
      const img = new Image();
      img.onload = () => {
        if (!img.naturalWidth) { i++; tryNext(); return; } // 空占位图视为失败，切下一个候选
        freezeIcon(host, srcs[i]).then(val => {
          const u = document.getElementById("fIconUrl");
          if (u) u.value = val;
          const e = document.getElementById("fIcon");
          if (e) e.value = "";
          renderModalIcon();
          showToast(/^data:/.test(val) ? "已抓取并固化图标，刷新不丢" : "已抓取网站图标");
        });
      };
      img.onerror = () => { i++; tryNext(); };
      img.src = srcs[i];
    })();
  }
  function saveItem() {

    if (!name) return showToast("请输入名称");
    if (!url || url === "https://") return showToast("请输入有效网址");
    const normUrl = normalizeUrl(url);
    if (!normUrl) return showToast("请输入有效网址");
    // 填了自定义图标：仅该卡片锁定为 Emoji（并清空其 favicon）；没填则保持自动抓取 favicon
    const finalIconUrl = icon ? "" : iconUrl;
    const cat = findCategory(editState.categoryId);
    if (!cat) return showToast("分类不存在");
    if (editState.mode === "add") {
      if (!cat.items) cat.items = [];
      const item = { id: (document.getElementById("modalContent").dataset.newId || "nav_" + Date.now()), name, url: normUrl, icon, iconUrl: finalIconUrl, description: desc, subNav };
      if (icon) item.useEmoji = true;
      cat.items.push(item);
      showToast("已添加：" + name);
    } else {
      const it = findItem(editState.categoryId, editState.itemId);
      if (it) {
        it.name = name; it.url = normUrl; it.icon = icon; it.iconUrl = finalIconUrl; it.description = desc; it.subNav = subNav;

      '</div></div>'
    ).join("");
    pop.style.display = "block";
    const r = btn.getBoundingClientRect();
    const pw = pop.offsetWidth, ph = pop.offsetHeight;
    let left = r.left, top = r.bottom + 4;
    if (left + pw > window.innerWidth - 8) left = window.innerWidth - pw - 8;
    if (top + ph > window.innerHeight - 8) top = Math.max(8, r.top - ph - 4);
    pop.style.left = left + "px"; pop.style.top = top + "px";

  function ensureSubIconPop() {
    let pop = document.getElementById("subIconPop");
    if (!pop) {
      pop = document.createElement("div");

      pop.innerHTML = '<div class="sip-head">选择图标 <span style="opacity:.6">（点击即可）</span></div><div class="sip-grid"></div>';
      document.body.appendChild(pop);

        if (pop.style.display === "block" && !pop.contains(e.target) && !e.target.closest(".sn-icpick") && !e.target.closest(".sn-icon")) closeSubIconPop();

  // 二级导航：前端卡片展示
  function subIconHtml(sn) {
    if (sn.icon) return '<span class="fav-fallback">' + escapeHtml(sn.icon) + '</span>';
    if (sn.iconUrl && validIconUrl(sn.iconUrl)) {
      return '<span class="fav-fallback">🔗</span><img class="fav" src="' + escapeHtml(sn.iconUrl) + '" alt="" onload="if(!this.naturalWidth){this.style.display=\'none\';return}this.style.display=\'\';this.previousElementSibling.style.display=\'none\'" onerror="this.style.display=\'none\'">';
    }
    const host = getHost(sn.url || "");
    if (CONFIG.settings.cardIcon !== "emoji" && host) {
      const cands = faviconCandidates(host);
      const all = JSON.stringify(cands);
      return '<span class="fav-fallback">🔗</span><img class="fav" src="' + escapeHtml(cands[0]) + '" data-all="' + escapeHtml(all) + '" data-cands="' + escapeHtml(JSON.stringify(cands.slice(1))) + '" alt="" style="display:none" onload="if(!this.naturalWidth){favErrorNext(this);return}this.style.display=\'\';this.previousElementSibling.style.display=\'none\';persistIconOk(this)" onerror="favErrorNext(this)">';

  // 二级导航：卡片内只保留徽标；下拉菜单通过 renderSubNavPortal 放到 #subnavPortal
  function buildSubNavZone(subs) {
    return '<div class="subnav-zone" onclick="event.preventDefault();event.stopPropagation()">' +
      '<span class="subnav-badge">' + subs.length + '</span>' +
      '</div>';

  function buildSubNavItems(subs) {
    return subs.map(sn => {
      const url = normalizeUrl(sn.url) || sn.url || "";
      return '<div class="subnav-item" data-url="' + escapeHtml(url) + '" onclick="openSubUrl(this)">' +
        '<span class="si-icon">' + subIconHtml(sn) + '</span>' +

  function openSubUrl(el) {

  // 二级导航：悬停一级卡片右下角徽标才展开（带延迟，避免快速移动时闪烁）
  let subnavHideTimer = null;
  // 按卡片实时位置定位弹层（避免入口动画 transform 造成的偏移，hover 时才计算最准）
  function positionSubNavPop(pop, card) {
    const portal = document.getElementById("subnavPortal");
    if (!portal) return;
    const appRect = portal.getBoundingClientRect();
    const rect = card.getBoundingClientRect();
    pop.style.left = (rect.left - appRect.left) + "px";
    pop.style.top = (rect.bottom - appRect.top + 2) + "px";
    pop.style.width = rect.width + "px";
  }
  function showSubNavFor(cardId) {
    if (subnavHideTimer) { clearTimeout(subnavHideTimer); subnavHideTimer = null; }
    const portal = document.getElementById("subnavPortal");
    if (!portal) return;
    const pop = portal.querySelector('.subnav-pop[data-for="' + CSS.escape(cardId) + '"]');
    if (!pop) return;
    const card = document.querySelector('.card[data-id="' + CSS.escape(cardId) + '"]');
    if (card) positionSubNavPop(pop, card);
    pop.classList.add("open");
  }
  function hideSubNavFor(cardId) {
    if (subnavHideTimer) clearTimeout(subnavHideTimer);
    subnavHideTimer = setTimeout(() => {
      const portal = document.getElementById("subnavPortal");
      if (!portal) return;
      const pop = portal.querySelector('.subnav-pop[data-for="' + CSS.escape(cardId) + '"]');
      if (pop) pop.classList.remove("open");
    }, 200);
  }
  function renderSubNavPortal(subnavs) {
    let portal = document.getElementById("subnavPortal");
    if (!portal) {
      portal = document.createElement("div");
      portal.id = "subnavPortal";
      const app = document.getElementById("app");
      if (app) app.appendChild(portal);
    }
    portal.innerHTML = "";
    if (!portal.parentElement) return;
    subnavs.forEach(({ card, subs }) => {
      const pop = document.createElement("div");
      pop.className = "subnav-pop";
      pop.dataset.for = card.dataset.id;
      pop.innerHTML = buildSubNavItems(subs);
      positionSubNavPop(pop, card);
      portal.appendChild(pop);

      const cardId = card.dataset.id;
      const zone = card.querySelector(".subnav-zone");
      if (zone) {
        zone.addEventListener("mouseenter", () => showSubNavFor(cardId));
        zone.addEventListener("mouseleave", () => hideSubNavFor(cardId));
      }
      pop.addEventListener("mouseenter", () => showSubNavFor(cardId));
      pop.addEventListener("mouseleave", () => hideSubNavFor(cardId));
    });
  }
  function refreshSubNavPortal() {
    const portal = document.getElementById("subnavPortal");
    if (!portal) return;
    const subnavs = [];
    document.querySelectorAll(".card.has-subnav").forEach(card => {
      try {
        const subs = JSON.parse(card.dataset.subnav || "[]");
        if (subs.length) subnavs.push({ card, subs });
      } catch (e) {}
    });
    renderSubNavPortal(subnavs);
  }
  function syncSubNavPortalVisibility() {
    const portal = document.getElementById("subnavPortal");
    if (!portal) return;
    portal.querySelectorAll(".subnav-pop").forEach(pop => {
      const card = document.querySelector('.card[data-id="' + pop.dataset.for + '"]');
      const visible = card && card.offsetParent !== null;
      if (!visible) {
        pop.style.display = "none";
        pop.classList.remove("open");
      } else {
        pop.style.display = "";
      }
    });
  }

  // 分类管理：拖拽排序（按 sort 字段重新编号，主页面与导航栏随之更新）
  let dragCatIndex = -1;
  function catDragStart(ev, idx) {
    dragCatIndex = idx;
    ev.dataTransfer.effectAllowed = "move";
    try { ev.dataTransfer.setData("text/plain", String(idx)); } catch (e) {}
    const row = document.querySelectorAll("#catManageList .cm-item")[idx];
    if (row) row.classList.add("dragging");
  }
  function catDragOver(ev) {
    ev.preventDefault();
    ev.dataTransfer.dropEffect = "move";
    ev.currentTarget.classList.add("drag-over");
  }
  function catDragLeave(ev) { ev.currentTarget.classList.remove("drag-over"); }
  function catDrop(ev, targetIdx) {
    ev.preventDefault();
    if (dragCatIndex < 0 || dragCatIndex === targetIdx) { catDragEnd(); return; }
    const sorted = (CONFIG.categories || []).slice().sort((a, b) => a.sort - b.sort);
    if (dragCatIndex >= sorted.length || targetIdx < 0 || targetIdx >= sorted.length) { catDragEnd(); return; }
    const moved = sorted.splice(dragCatIndex, 1)[0];
    sorted.splice(targetIdx, 0, moved);
    sorted.forEach((c, i) => { c.sort = i + 1; });
    dragCatIndex = -1;
    saveConfig(); render(); ifOpenRefresh(); showToast("分类顺序已更新");
  }
  function catDragEnd() {
    dragCatIndex = -1;
    document.querySelectorAll("#catManageList .cm-item").forEach(r => r.classList.remove("dragging", "drag-over"));
  }

  }
  function sideEnableAll(val) {

  let dragSideIndex = -1;
  let sideDidDrop = false;
  function sideDragStart(ev, idx) {
    dragSideIndex = idx;
    sideDidDrop = false;
    ev.dataTransfer.effectAllowed = "move";
    try { ev.dataTransfer.setData("text/plain", String(idx)); } catch (e) {}
    const row = document.querySelectorAll("#sideManageList .cm-item")[idx];
    if (row) row.classList.add("dragging");
  }
  function sideDragOver(ev) { ev.preventDefault(); ev.dataTransfer.dropEffect = "move"; ev.currentTarget.classList.add("drag-over"); }
  function sideDragLeave(ev) { ev.currentTarget.classList.remove("drag-over"); }
  function sideDrop(ev, targetIdx) {
    ev.preventDefault();
    ev.stopPropagation();
    sideDidDrop = true;
    if (dragSideIndex < 0 || dragSideIndex === targetIdx) { sideDragEnd(); return; }
    let sorted = (CONFIG.sideItems || []).slice().sort((a, b) => (a.sort || 0) - (b.sort || 0));
    if (dragSideIndex >= sorted.length || targetIdx < 0 || targetIdx >= sorted.length) { sideDragEnd(); return; }
    const moved = sorted.splice(dragSideIndex, 1)[0];
    if (!moved) { sideDragEnd(); return; }
    sorted.splice(targetIdx, 0, moved);
    sorted.forEach((c, i) => { c.sort = i + 1; });
    CONFIG.sideItems = sorted;
    dragSideIndex = -1;
    saveConfig(); renderSideNav(); showToast("侧边栏顺序已更新");

  // ===== 书签导入导出（纯本地，无网络请求） =====
  function bmTimestamp() { var d = new Date(), p = function (n) { return (n < 10 ? "0" : "") + n; }; return "" + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()); }
  function bmCsvEscape(s) { s = (s == null ? "" : String(s)); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
  function bmSplitCsvLine(line) {
    var out = [], cur = "", q = false, i = 0;
    while (i < line.length) {
      var ch = line[i];
      if (q) {
        if (ch === '"') { if (line[i + 1] === '"') { cur += '"'; i += 2; continue; } q = false; i++; continue; }
        cur += ch; i++; continue;
      }
      if (ch === '"') { q = true; i++; continue; }
      if (ch === ",") { out.push(cur); cur = ""; i++; continue; }
      cur += ch; i++;
    }
    out.push(cur); return out;
  }
  function bmToUnix(s) {
    if (!s) return 0; s = String(s).trim();
    if (/^\d+$/.test(s)) return s.length >= 13 ? Math.floor(parseInt(s, 10) / 1000) : parseInt(s, 10);
    var t = Date.parse(s); return isNaN(t) ? 0 : Math.floor(t / 1000);
  }
  function bmResolveCategory(name) {
    name = (name || "").trim() || "默认";
    var cats = CONFIG.categories || (CONFIG.categories = []);
    for (var i = 0; i < cats.length; i++) if (cats[i].name === name) return cats[i];
    var maxSort = 0; cats.forEach(function (c) { if ((c.sort || 0) > maxSort) maxSort = c.sort; });
    var cat = { id: wsGenId(), name: name, icon: "📁", sort: maxSort + 1, items: [] };
    cats.push(cat); return cat;
  }
  // 内部模型 → 规范化记录（folder 为单层/路径串）
  function bmRecordsFromConfig() {
    var recs = [];
    (CONFIG.categories || []).forEach(function (c) {
      (c.items || []).forEach(function (it) {
        recs.push({
          title: it.name || "", url: it.url || "", tags: it.tags || [], folder: c.name || "默认",
          notes: it.description || "", createdAt: it.createdAt || "", icon: it.icon || it.iconUrl || "",
          visitCount: it.visitCount || 0, subNav: it.subNav || []
        });
      });
    });
    return recs;
  }
  function bmBuildJSON(recs) { return JSON.stringify({ version: 1, exportedAt: new Date().toISOString(), bookmarks: recs }, null, 2); }
  function bmBuildCSV(recs) {
    var rows = ["title,url,tags,folder,notes,createdAt"];
    recs.forEach(function (r) {
      rows.push([bmCsvEscape(r.title), bmCsvEscape(r.url), bmCsvEscape((r.tags || []).join(",")), bmCsvEscape(r.folder), bmCsvEscape(r.notes), bmCsvEscape(r.createdAt)].join(","));
    });
    return rows.join("\n");
  }
  function bmBuildHTML(recs) {
    var groups = {};
    recs.forEach(function (r) { var f = r.folder || "默认"; (groups[f] = groups[f] || []).push(r); });
    function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
    var body = Object.keys(groups).map(function (f) {
      var items = groups[f].map(function (r) {
        var uni = bmToUnix(r.createdAt);
        var tags = (r.tags || []).length ? ' TAGS="' + esc((r.tags || []).join(",")) + '"' : "";
        var line = '        <DT><A HREF="' + esc(r.url) + '" ADD_DATE="' + uni + '"' + tags + ">" + esc(r.title || r.url) + "</A>";
        if (r.notes) line += "\n        <DD>" + esc(r.notes);
        return line;
      }).join("\n");
      return '    <DT><H3 ADD_DATE="0">' + esc(f) + "</H3>\n    <DL><p>\n" + items + "\n    </DL><p>";
    }).join("\n");
    return '<!DOCTYPE NETSCAPE-Bookmark-file-1>\n<META HTTP-EQUIV="Content-Type" CONTENT="text/html; charset=UTF-8">\n<TITLE>Bookmarks</TITLE>\n<H1>Bookmarks</H1>\n<DL><p>\n' + body + "\n</DL><p>\n";
  }

  function bmExport() {
    var fmt = document.getElementById("bmExportFmt").value;
    var recs = bmRecordsFromConfig();
    if (!recs.length) { showToast("暂无书签可导出"); return; }
    var ts = bmTimestamp(), name, content, mime;
    if (fmt === "json") { name = "nav-bookmarks_" + ts + ".json"; content = bmBuildJSON(recs); mime = "application/json"; }
    else if (fmt === "html") { name = "bookmarks_" + ts + ".html"; content = bmBuildHTML(recs); mime = "text/html"; }
    else { name = "bookmarks_" + ts + ".csv"; content = bmBuildCSV(recs); mime = "text/csv"; }
    var blob = new Blob([content], { type: mime }), a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name; a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    showToast("已导出 " + recs.length + " 条书签");
  }
  // ---- 解析 ----
  function bmDetect(text, name) {
    var t = (text || "").trim(), lower = (name || "").toLowerCase();
    if (lower.endsWith(".json") || t.charAt(0) === "{") return "json";
    if (lower.endsWith(".csv") || /^title,url/i.test(t)) return "csv";
    if (lower.endsWith(".html") || /NETSCAPE-Bookmark-file-1|<DL|<A\s+HREF/i.test(t)) return "html";
    return "html";
  }
  function bmNormRecord(b) {
    return {
      title: b.title || b.name || "", url: (b.url || "").trim(),
      tags: Array.isArray(b.tags) ? b.tags : (b.tags ? [b.tags] : []),
      folder: b.folder || (b.category && b.category.name) || "默认",
      notes: b.notes || b.description || "", createdAt: b.createdAt || b.addDate || "",
      icon: b.icon || b.iconUrl || "", visitCount: b.visitCount || 0,
      subNav: Array.isArray(b.subNav) ? b.subNav : []
    };
  }
  function bmParseJSON(text) {
    var data = JSON.parse(text);
    var arr = Array.isArray(data) ? data : (data.bookmarks || data.navBookmarks || []);

  let wsDIYDragId = null;

  function wsDIYDragOver(e) {
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";
    const card = this.closest(".ws-diy-card");
    if (!card || card.dataset.id === wsDIYDragId) return;
    const rect = card.getBoundingClientRect();
    const mid = rect.left + rect.width / 2;
    card.classList.toggle("drop-before", e.clientX < mid);
  }
  function wsDIYDrop(e) {
    e.preventDefault();
    const card = this.closest(".ws-diy-card");
    if (!card || !wsDIYDragId || card.dataset.id === wsDIYDragId) return;
    const fromId = wsDIYDragId;
    const toId = card.dataset.id;
    const before = card.classList.contains("drop-before");
    const list = CONFIG.workspace.components.slice().sort((a, b) => (a.sort || 0) - (b.sort || 0));
    const fromIdx = list.findIndex(c => c.id === fromId);
    const toIdx = list.findIndex(c => c.id === toId);
    if (fromIdx < 0 || toIdx < 0) return;
    const [moved] = list.splice(fromIdx, 1);
    let insertIdx = before ? toIdx : toIdx + 1;
    if (fromIdx < insertIdx) insertIdx--;
    list.splice(insertIdx, 0, moved);
    list.forEach((c, i) => c.sort = i);
    CONFIG.workspace.components = list;
    saveConfig();
    wsRenderDIY();
  }

  function wsTodayKey() { return new Date().toLocaleDateString("zh-CN", { year: "numeric", month: "2-digit", day: "2-digit" }).replace(/\//g, "-"); }
  function wsParseTime(t) {
    const [h, m] = String(t).split(":").map(Number);
    const now = new Date();
    return new Date(now.getFullYear(), now.getMonth(), now.getDate(), h || 0, m || 0, 0, 0);

  // 日常打卡
  function wsClockinActiveIndex(cmp) {
    const now = new Date().getTime();
    const periods = (cmp.config && cmp.config.periods) || [];
    if (!periods.length) return -1;
    // 按时间排序后计算切换点：每段的下一段打卡时间的一半耗时作为切换到该段的起点
    const idxs = periods
      .map((p, i) => ({ i, t: wsParseTime(p.time).getTime() }))
      .sort((a, b) => a.t - b.t);
    let active = idxs[0].i;
    for (let k = 0; k < idxs.length; k++) {
      const cur = idxs[k];
      let threshold;
      if (k === 0) {
        // 第一个时段：自身时间前 30 分钟即可切换进来
        threshold = cur.t - 30 * 60 * 1000;
      } else {
        // 其余时段：上一个时段与本时段的中点
        threshold = (idxs[k - 1].t + cur.t) / 2;
      }
      if (now >= threshold) active = cur.i;
    }
    return active;
  }
  function wsClockinFindRecord(cmp, idx, key) {
    const recs = (cmp.records && cmp.records[key || wsTodayKey()]) || [];
    return recs.find(r => r.idx === idx);
  }
  function wsClockinViewIndex(cmp) {
    if (!window.__clockinViewIdx) window.__clockinViewIdx = {};
    const periods = (cmp.config && cmp.config.periods) || [];
    if (!periods.length) return -1;
    const active = wsClockinActiveIndex(cmp);
    if (!(cmp.id in window.__clockinViewIdx)) return active >= 0 ? active : 0;
    return Math.max(0, Math.min(window.__clockinViewIdx[cmp.id], periods.length - 1));
  }
  function wsClockinNav(cmpId, delta) {
    const cmp = (CONFIG.workspace.components || []).find(c => c.id === cmpId);
    if (!cmp) return;
    const periods = (cmp.config && cmp.config.periods) || [];
    if (!periods.length) return;
    if (!window.__clockinViewIdx) window.__clockinViewIdx = {};
    const current = wsClockinViewIndex(cmp);
    window.__clockinViewIdx[cmpId] = Math.max(0, Math.min(current + delta, periods.length - 1));
    wsRenderDIY();
  }
  function wsClockinCheck(cmpId, idx) {
    const cmp = (CONFIG.workspace.components || []).find(c => c.id === cmpId);
    if (!cmp) return;
    const active = wsClockinActiveIndex(cmp);
    const targetIdx = typeof idx === "number" ? idx : active;
    if (targetIdx < 0) return;
    const key = wsTodayKey();
    if (!cmp.records) cmp.records = {};
    if (!cmp.records[key]) cmp.records[key] = [];
    const rec = wsClockinFindRecord(cmp, targetIdx, key);
    if (rec) {
      // 再次点击：取消该时段打卡（来回切换）
      cmp.records[key] = cmp.records[key].filter(r => r.idx !== targetIdx);
      saveConfig();
      wsRenderDIY();
      showToast("已取消打卡");
      return;
    }
    cmp.records[key].push({ idx: targetIdx, ts: Date.now() });
    saveConfig();
    wsRenderDIY();
    showToast("打卡成功");
  }
  function wsClockinConfig(cmpId) {
    const cmp = (CONFIG.workspace.components || []).find(c => c.id === cmpId);
    if (!cmp) return;
    if (!window.__clockinConfigDraft) window.__clockinConfigDraft = {};
    const src = (cmp.config && cmp.config.periods) || [];
    window.__clockinConfigDraft[cmpId] = src.map(p => ({ time: p.time, label: p.label }));
    // 打开时按打卡时间自动排序（编辑过程中的新增空行不参与实时排序）
    window.__clockinConfigDraft[cmpId].sort((a, b) => wsParseTime(a.time).getTime() - wsParseTime(b.time).getTime());
    wsClockinRenderConfigModal(cmpId);
  }
  function wsClockinRenderConfigModal(cmpId) {
    const cmp = (CONFIG.workspace.components || []).find(c => c.id === cmpId);

  function wsClockinUpdatePeriod(cmpId, idx, field, value) {
    const draft = window.__clockinConfigDraft && window.__clockinConfigDraft[cmpId];
    if (!draft || !draft[idx]) return;

  function wsClockinTimeBlur(cmpId, idx, value, el) {
    const draft = window.__clockinConfigDraft && window.__clockinConfigDraft[cmpId];
    if (!draft || !draft[idx]) return;

    // 填完时分后焦点自动切到同行的标签输入框，方便连续录入
    const labelInput = el.parentNode.querySelector('input[type="text"]');

  function wsClockinAddPeriod(cmpId) {
    const draft = window.__clockinConfigDraft && window.__clockinConfigDraft[cmpId];
    if (!draft) return;
    // 在底部追加一行空时段（不立刻参与排序），并将键盘焦点定位到该空行的时分输入框

  function wsClockinSaveConfig(cmpId) {

    if (!cmp) return;
    const draft = window.__clockinConfigDraft && window.__clockinConfigDraft[cmpId];
    if (!draft) return;
    if (!cmp.config) cmp.config = {};
    // 丢弃未填写时分的空行，补全默认标签，并按时间重新排序
    cmp.config.periods = draft
      .filter(p => p.time && p.time.trim())
      .map(p => ({ time: p.time, label: (p.label && p.label.trim()) || "打卡" }))
      .sort((a, b) => wsParseTime(a.time).getTime() - wsParseTime(b.time).getTime());

    wsRenderDIY();

  }
  function wsClockinCancelConfig(cmpId) {

  }
  function wsClockinResetRecords(cmpId) {

    if (!cmp) return;

    cmp.records = {};
    saveConfig();

    showToast("已重置打卡记录");
  }
  function wsRenderClockin(el, cmp) {
    const periods = (cmp.config && cmp.config.periods) || [];
    if (!periods.length) {
      el.innerHTML = '<div class="ws-clockin-empty">暂无打卡时段<br><button class="btn btn-secondary btn-sm" style="margin-top:8px" onclick="wsClockinConfig(\'' + cmp.id + '\')">配置时段</button></div>';
      return;
    }
    const activeIdx = wsClockinActiveIndex(cmp);
    const viewIdx = wsClockinViewIndex(cmp);
    const now = new Date();
    const period = periods[viewIdx] || periods[periods.length - 1];
    const isFuture = wsParseTime(period.time) > now;
    const key = wsTodayKey();
    const rec = wsClockinFindRecord(cmp, viewIdx, key);
    let nextLabel = "今日打卡已完成";
    // 按时间顺序取当前时段之后的下一个时段作为“下次打卡”
    const sorted = periods.map((p, i) => ({ i, t: wsParseTime(p.time).getTime() })).sort((a, b) => a.t - b.t);
    const curT = wsParseTime(period.time).getTime();
    const nxt = sorted.find(s => s.t > curT + 1);
    if (nxt) nextLabel = "下次打卡时间 " + periods[nxt.i].time;
    const statusText = rec ? "已打卡，" + nextLabel : "未打卡，请记得及时打卡哦";
    const statusCls = rec ? "done" : "warn";
    const doneCount = periods.reduce((c, _, i) => wsClockinFindRecord(cmp, i, key) ? c + 1 : c, 0);
    const pct = Math.min(100, Math.round(doneCount / periods.length * 100));
    const leftDisabled = viewIdx <= 0;
    const rightDisabled = viewIdx >= periods.length - 1;
    el.innerHTML =
      '<div class="ws-cmp-head">' +
        '<span class="ws-cmp-icon">🕘</span>' +
        '<span class="ws-cmp-title">日常打卡</span>' +
        '<span class="ws-cmp-actions">' +
          '<span class="ws-cmp-btn" onclick="wsClockinConfig(\'' + cmp.id + '\')" title="配置">⚙️</span>' +
        '</span>' +
      '</div>' +
      '<div class="ws-clockin-main">' +
        '<button class="ws-clockin-arrow" onclick="wsClockinNav(\'' + cmp.id + '\', -1)" ' + (leftDisabled ? 'disabled' : '') + ' title="上一个时段">&lt;</button>' +
        '<div class="ws-clockin-ring" style="--p:' + pct + '%">' +
          '<span class="ws-clockin-ring-text">' + doneCount + '/' + periods.length + '</span>' +
          '<span class="ws-clockin-ring-label">今日完成</span>' +
        '</div>' +
        '<div class="ws-clockin-info">' +
          '<div class="ws-clockin-period">' + escapeHtml(period.time + " " + period.label) + '</div>' +
          '<div class="ws-clockin-status ' + statusCls + '">' + escapeHtml(statusText) + '</div>' +
        '</div>' +
        '<button class="ws-clockin-arrow" onclick="wsClockinNav(\'' + cmp.id + '\', 1)" ' + (rightDisabled ? 'disabled' : '') + ' title="下一个时段">&gt;</button>' +
      '</div>' +
      '<button class="ws-clockin-btn' + (rec ? ' done' : '') + '" ' + (isFuture ? 'disabled' : '') + ' onclick="wsClockinCheck(\'' + cmp.id + '\',' + viewIdx + ')">' + (rec ? '已打卡' : '打卡') + '</button>';
  }

  // 喝水记录
  function wsWaterTodayTotal(cmp) {
    const key = wsTodayKey();
    const recs = (cmp.records && cmp.records[key]) || [];
    return recs.reduce((s, r) => s + (parseInt(r.ml) || 0), 0);
  }
  function wsWaterNextTime(cmp) {
    const key = wsTodayKey();
    const recs = (cmp.records && cmp.records[key]) || [];
    const interval = (cmp.config && cmp.config.interval) || 60;
    if (!recs.length) {
      const start = new Date(); start.setHours(9, 0, 0, 0);
      return start.getTime() + interval * 60 * 1000;
    }
    const last = Math.max(...recs.map(r => r.ts));
    return last + interval * 60 * 1000;
  }
  function wsWaterOpenAdd(cmpId) {
    const cmp = (CONFIG.workspace.components || []).find(c => c.id === cmpId);
    if (!cmp) return;
    let selected = 250;
    const m = document.getElementById("modalContent");
    const renderOpts = (customVal) => {
      const opts = [150, 250, 350].map(v =>
        '<div class="ws-water-option' + (selected === v ? ' selected' : '') + '" onclick="wsWaterSelect(' + v + ')">' +
          '<span class="amount">+' + v + '</span>' +
          '<span class="unit">ml</span>' +
        '</div>'
      ).join("");
      return opts +
        '<div class="ws-water-option' + (selected === -1 ? ' selected' : '') + '" onclick="wsWaterSelect(-1)">' +
          '<span class="amount">自定义</span>' +
          '<input type="number" id="wsWaterCustom" value="' + escapeHtml(customVal || '500') + '" style="width:58px;padding:4px 6px;border-radius:6px;border:1px solid var(--border);background:var(--bg-card);color:var(--text-primary);font-size:.8rem;text-align:center;margin-top:4px" onfocus="wsWaterSelect(-1)">' +
        '</div>';
    };
    window.wsWaterSelect = (v) => {
      const custom = document.getElementById("wsWaterCustom");

      document.getElementById("wsWaterOptions").innerHTML = renderOpts(custom ? custom.value : "500");
    };

      if (!ml || ml <= 0) { showToast("请输入有效水量"); return; }
      const key = wsTodayKey();
      if (!cmp.records) cmp.records = {};
      if (!cmp.records[key]) cmp.records[key] = [];
      cmp.records[key].push({ ml: ml, ts: Date.now() });
      saveConfig();
      closeModal();
      wsRenderDIY();
      const target = (cmp.config && cmp.config.target) || 2000;
      const total = wsWaterTodayTotal(cmp);
      const diff = Math.max(0, target - total);

    };
    m.innerHTML =
      '<div class="modal-header"><h3>💧 记录喝水</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>' +
      '<div class="ws-water-slider" id="wsWaterOptions">' + renderOpts("500") + '</div>' +
      '<div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="wsWaterDoAdd()">确认</button></div>';
    document.getElementById("modalOverlay").classList.add("open");
  }
  function wsWaterConfig(cmpId) {

    if (!cmp) return;
    const target = (cmp.config && cmp.config.target) || 2000;

        '<button class="btn btn-danger-ghost" onclick="wsWaterResetRecords(\'' + cmpId + '\')">重置记录</button>' +

  function wsWaterSaveConfig(cmpId) {

  function wsWaterResetRecords(cmpId) {

  function wsRenderWater(el, cmp) {
    const target = (cmp.config && cmp.config.target) || 2000;

    const pct = Math.round(total / target * 100);
    const ringPct = Math.min(100, pct);

    const lineText = total >= target
      ? ('已喝 ' + total + 'ml，超出 ' + (total - target) + 'ml 🎉')
      : ('已喝 ' + total + 'ml，还差 ' + diff + 'ml');
    const nextTs = wsWaterNextTime(cmp);
    const isOverdue = total < target && nextTs <= Date.now();
    const nextStr = nextTs > Date.now() ? new Date(nextTs).toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" }) : "已到提醒时间";
    const card = el.closest(".ws-diy-card");

  /* ===== 天气组件 (Weather) ===== */
  var wsWeatherState = {}; // cmpId -> { status, statusType, _statusTimer }
  var wsWeatherDetailCmpId = null; // 当前打开详情弹窗的天气组件 id
  function wsWeatherSetStatus(cmpId, msg, type) {
    type = type || "info";
    wsWeatherState[cmpId] = wsWeatherState[cmpId] || {};
    wsWeatherState[cmpId].status = msg || "";
    wsWeatherState[cmpId].statusType = type;
    var el = document.getElementById("ws_weather_status_" + cmpId);
    if (el) {
      el.textContent = msg || "";
      el.className = "ws-weather-status" + (type ? " is-" + type : "");
    }
    clearTimeout(wsWeatherState[cmpId]._statusTimer);
    if (msg && type !== "error" && type !== "err" && type !== "loading") {
      wsWeatherState[cmpId]._statusTimer = setTimeout(function () {
        if (wsWeatherState[cmpId] && wsWeatherState[cmpId].status === msg) wsWeatherSetStatus(cmpId, "");
      }, 2200);
    }
  }
  function wsWeatherCacheKey(city) {
    return "ws_weather_cache_" + (city || "").toLowerCase();
  }
  function wsLoadWeatherCache(city) {
    try {
      const raw = localStorage.getItem(wsWeatherCacheKey(city));
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }
  function wsPersistWeatherCache(city, obj) {
    try { localStorage.setItem(wsWeatherCacheKey(city), JSON.stringify(obj)); } catch (e) {}
  }
  async function loadWeatherForecast(reqCity, cmp, onDone) {
    if (!reqCity) return;
    const auto = reqCity.toLowerCase() === "auto";
    const oldCache = (cmp.cache && !cmp.cache.error) ? cmp.cache : null; // 失败时保留旧缓存
    let city = reqCity;
    try {
      if (auto) city = await detectCityByIP();
      const geo = await fetch("https://geocoding-api.open-meteo.com/v1/search?name=" + encodeURIComponent(city) + "&count=1&language=zh&format=json");
      const geoJ = await geo.json();
      if (!geoJ.results || !geoJ.results.length) throw new Error("城市未找到");
      const { latitude, longitude } = geoJ.results[0];
      const [wRes, aRes] = await Promise.all([
        fetch("https://api.open-meteo.com/v1/forecast?latitude=" + latitude + "&longitude=" + longitude + "&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,wind_direction_10m&hourly=temperature_2m,weather_code,precipitation_probability&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,uv_index_max,sunrise,sunset&timezone=auto&forecast_days=7"),
        fetch("https://air-quality-api.open-meteo.com/v1/air-quality?latitude=" + latitude + "&longitude=" + longitude + "&current=us_aqi")
      ]);
      const w = await wRes.json();
      const a = await aRes.json();
      const newCache = {
        city: city,
        auto: auto,
        current: w.current,
        daily: w.daily,
        hourly: w.hourly,
        aqi: a.current ? a.current.us_aqi : null,
        updated: Date.now()
      };
      cmp.cache = newCache;
      wsPersistWeatherCache(reqCity, newCache); // 持久化到 localStorage，关闭页面后再打开可直接读缓存
      if (onDone) onDone(true);
    } catch (e) {
      // 获取失败：保留旧缓存继续显示；仅首次无任何缓存时才标记错误
      if (!oldCache) cmp.cache = { error: true, city: city, auto: auto };
      if (onDone) onDone(false);
    }
    wsRenderDIY();
  }
  function wsRenderWeather(el, cmp) {
    const cfg = cmp.config || {};
    const days = cfg.days || 7;
    const city = (CONFIG.settings.weatherCity || "").trim();
    const autoMode = city.toLowerCase() === "auto";
    const st = wsWeatherState[cmp.id] || {};
    const statusHtml = '<div class="ws-weather-status' + (st.statusType ? ' is-' + st.statusType : '') + '" id="ws_weather_status_' + cmp.id + '">' + escapeHtml(st.status || '') + '</div>';
    if (!city) {
      el.innerHTML = statusHtml + '<div class="ws-weather-empty">请在设置中配置天气城市</div>';
      return;
    }
    // 内存无缓存时，先从 localStorage 恢复持久化缓存（关闭页面后再打开可直接读旧缓存）
    if (!cmp.cache) {
      const persisted = wsLoadWeatherCache(city);
      if (persisted && !persisted.error) cmp.cache = persisted;
    }
    const cache = cmp.cache;
    const cityMatch = autoMode ? !!(cache && cache.auto) : !!(cache && cache.city === city);
    // 缓存有效期 2 小时；未过期则直接复用，不再触发请求
    const fresh = !!(cache && !cache.error && cityMatch && (Date.now() - (cache.updated || 0) <= 2 * 60 * 60 * 1000));

    if (!cache || cache.error || !cityMatch) {
      // 没有任何可用缓存：显示加载态并后台静默获取
      el.innerHTML = statusHtml + '<div class="ws-weather-loading">正在加载天气…</div>';
      loadWeatherForecast(city, cmp);
      return;
    }
    const current = cache.current;
    const daily = cache.daily;
    const info = WMO[current.weather_code] || ["🌡️", "未知"];
    const weekLabels = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];
    let forecastHtml = "";
    const count = Math.min(days, (daily && daily.time ? daily.time.length : 0));
    for (let i = 0; i < count; i++) {
      const date = new Date(daily.time[i]);
      const isToday = i === 0;
      const label = isToday ? "今天" : weekLabels[date.getDay()];
      const dInfo = WMO[daily.weather_code[i]] || ["🌡️", "未知"];
      forecastHtml +=
        '<div class="ws-weather-day' + (isToday ? " today" : "") + '">' +
          '<div class="ws-weather-day-label">' + label + '</div>' +
          '<div class="ws-weather-day-icon">' + dInfo[0] + '</div>' +
          '<div class="ws-weather-day-temps">' +
            '<span class="ws-weather-day-high">' + Math.round(daily.temperature_2m_max[i]) + '°</span>' +
            '<span class="ws-weather-day-sep">/</span>' +
            '<span class="ws-weather-day-low">' + Math.round(daily.temperature_2m_min[i]) + '°</span>' +
          '</div>' +
        '</div>';
    }
    const metaTags = [];
    if (current.apparent_temperature != null) metaTags.push('<span class="ws-weather-tag">体感 ' + Math.round(current.apparent_temperature) + '°</span>');
    if (current.relative_humidity_2m != null) metaTags.push('<span class="ws-weather-tag">湿度 ' + current.relative_humidity_2m + '%</span>');
    if (current.wind_speed_10m != null) metaTags.push('<span class="ws-weather-tag">' + Math.round(current.wind_speed_10m) + ' km/h</span>');
    if (cache.aqi != null) metaTags.push('<span class="ws-weather-tag aqi">AQI ' + Math.round(cache.aqi) + '</span>');
    el.innerHTML =
      statusHtml +
      '<div class="ws-cmp-head">' +
        '<span class="ws-cmp-icon" title="天气位置">📍</span>' +
        '<span class="ws-cmp-title ws-weather-city" onclick="toggleCityMenu(event)" title="点击切换城市">' + escapeHtml(cache.city) + '</span>' +
        '<div class="ws-cmp-actions">' +
          '<button class="ws-cmp-btn" onclick="wsWeatherOpenDetail(\'' + cmp.id + '\')" title="天气详情">' +
            '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' +
              '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />' +
              '<polyline points="14 2 14 8 20 8" />' +
              '<line x1="16" y1="13" x2="8" y2="13" />' +
              '<line x1="16" y1="17" x2="8" y2="17" />' +
              '<line x1="10" y1="9" x2="8" y2="9" />' +
            '</svg>' +
          '</button>' +
          '<button class="ws-cmp-btn ws-weather-refresh" id="ws_weather_refresh_' + cmp.id + '" onclick="wsWeatherRefresh(\'' + cmp.id + '\')" title="刷新">' +
            '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' +
              '<path d="M21 12a9 9 0 1 1-2.64-6.36" />' +
              '<polyline points="21 3 21 9 15 9" />' +
            '</svg>' +
          '</button>' +
        '</div>' +
      '</div>' +
      '<div class="ws-weather-main" onclick="wsWeatherOpenDetail(\'' + cmp.id + '\')" title="点击查看天气详情">' +
        '<div class="ws-weather-icon">' + info[0] + '</div>' +
        '<div class="ws-weather-temp">' + Math.round(current.temperature_2m) + '°</div>' +
        '<div class="ws-weather-info">' +
          '<div class="ws-weather-desc">' + info[1] + '</div>' +
          '<div class="ws-weather-tags">' + metaTags.join("") + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="ws-weather-forecast">' + forecastHtml + '</div>';
    // 缓存已过期（>2h）则后台静默刷新一次：保留当前显示，拿到新数据才更新界面
    if (!fresh) loadWeatherForecast(city, cmp);
  }
  function wsWeatherRefresh(cmpId) {
    const cmp = (CONFIG.workspace.components || []).find(c => c.id === cmpId);
    if (!cmp || cmp.type !== "weather") return;
    const city = (CONFIG.settings.weatherCity || "").trim();
    const btn = document.getElementById("ws_weather_refresh_" + cmpId);
    if (!city) { wsWeatherSetStatus(cmpId, "请先在设置中配置天气城市", "info"); return; }
    wsWeatherSetStatus(cmpId, "正在刷新天气…", "loading");
    if (btn) btn.classList.add("spinning");
    loadWeatherForecast(city, cmp, function (ok) {
      if (btn) btn.classList.remove("spinning");
      if (ok) wsWeatherSetStatus(cmpId, "刷新成功", "success");
      else wsWeatherSetStatus(cmpId, "刷新失败，已保留上次数据", "error");
    });
  }
  function wsWeatherOpenDetail(cmpId) {
    const cmp = (CONFIG.workspace.components || []).find(c => c.id === cmpId);
    if (!cmp || cmp.type !== "weather") return;
    const city = (CONFIG.settings.weatherCity || "").trim();
    if (!city) { showToast("请先在设置中配置天气城市"); return; }
    const overlay = document.getElementById("weatherOverlay");
    wsWeatherDetailCmpId = cmpId;
    if (!cmp.cache || cmp.cache.error || !cmp.cache.hourly || !cmp.cache.daily) {
      overlay.querySelector(".weather-pop").innerHTML = '<div class="weather-pop-loading">正在加载天气详情…</div>';
      overlay.classList.add("open");
      overlay.setAttribute("aria-hidden", "false");
      loadWeatherForecast(city, cmp, function () { if (wsWeatherDetailCmpId === cmpId) wsRenderWeatherDetailBody(cmp); });
      return;
    }
    wsRenderWeatherDetailBody(cmp);
    overlay.classList.add("open");
    overlay.setAttribute("aria-hidden", "false");
    if (Date.now() - (cmp.cache.updated || 0) > 2 * 60 * 60 * 1000) {
      loadWeatherForecast(city, cmp, function () { if (wsWeatherDetailCmpId === cmpId) wsRenderWeatherDetailBody(cmp); });
    }
  }
  function wsWeatherClose() {
    const overlay = document.getElementById("weatherOverlay");
    overlay.classList.remove("open");
    overlay.setAttribute("aria-hidden", "true");
    wsWeatherDetailCmpId = null;
    wsWeatherDetailSetStatus("");
  }
  // 详情弹窗下飘状态条（独立于 .weather-pop 内容，切换城市刷新时显示）
  function wsWeatherDetailSetStatus(msg, type) {
    type = type || "info";
    const el = document.getElementById("weatherPopStatus");
    if (!el) return;
    el.textContent = msg || "";
    el.className = "weather-pop-status" + (type ? " is-" + type : "");
    clearTimeout(el._t);
    if (msg && type !== "loading") {
      el._t = setTimeout(function () { if (el.textContent === msg) wsWeatherDetailSetStatus(""); }, 2200);
    }
  }
  // 切换城市时：保持弹窗内容/尺寸不动，后台异步刷新，成功后才更新内容
  function wsWeatherRefreshDetail(cmpId) {
    const cmp = (CONFIG.workspace.components || []).find(c => c.id === cmpId);
    if (!cmp || cmp.type !== "weather") return;
    const city = (CONFIG.settings.weatherCity || "").trim();
    if (!city) { showToast("请先在设置中配置天气城市"); return; }
    wsWeatherDetailSetStatus("正在刷新天气…", "loading");
    loadWeatherForecast(city, cmp, function (ok) {
      if (wsWeatherDetailCmpId !== cmpId) return; // 期间已关闭弹窗，丢弃结果
      if (ok) {
        wsWeatherDetailSetStatus("刷新成功", "success");
        wsRenderWeatherDetailBody(cmp);
      } else {
        wsWeatherDetailSetStatus("刷新失败，已保留上次数据", "error");
      }
    });
  }
  function wsRenderWeatherDetailBody(cmp) {
    const cache = cmp.cache;
    if (!cache || cache.error || !cache.current) return;
    const cur = cache.current || {};
    const daily = cache.daily || {};
    const hourly = cache.hourly || {};
    const info = WMO[cur.weather_code] || ["🌡️", "未知"];
    const cityName = (cache.auto ? "📍 " : "") + (cache.city || "");
    const maxArr = daily.temperature_2m_max || [];
    const minArr = daily.temperature_2m_min || [];
    const dCode = daily.weather_code || [];
    const dTime = daily.time || [];
    const precip = daily.precipitation_probability_max || [];
    const uvArr = daily.uv_index_max || [];
    const aqiV = cache.aqi;
    const aqi = aqiLevel(aqiV);
    const uv = uvLevel(uvArr[0]);
    const tags = [
      '<span class="weather-pop-tag q-' + aqi[1] + '">' + aqi[0] + " " + (aqiV != null ? Math.round(aqiV) : "--") + " AQI</span>",
      '<span class="weather-pop-tag">' + windDirText(cur.wind_direction_10m) + " " + windLevel(cur.wind_speed_10m) + "</span>",
      '<span class="weather-pop-tag">湿度 ' + (cur.relative_humidity_2m != null ? cur.relative_humidity_2m : "--") + "%</span>",
      '<span class="weather-pop-tag">紫外线 ' + uv[0] + "</span>"
    ];
    let hoursHtml = "";
    let hourlyCurveSvg = "";
    const hColW = 64, hGap = 8, hSvgH = 76;
    if (hourly.time && hourly.time.length) {
      const nowMs = Date.now();
      let startIdx = hourly.time.findIndex(function (t) { return new Date(t).getTime() >= nowMs - 30 * 60 * 1000; });
      if (startIdx < 0) startIdx = 0;
      const end = Math.min(startIdx + 24, hourly.time.length);
      const hTemps = [];
      for (let i = startIdx; i < end; i++) {
        hTemps.push(hourly.temperature_2m[i] != null ? hourly.temperature_2m[i] : null);
      }
      const hCount = hTemps.length;
      let minT = Infinity, maxT = -Infinity;
      hTemps.forEach(function (v) { if (v != null) { minT = Math.min(minT, v); maxT = Math.max(maxT, v); } });
      if (minT === Infinity) { minT = 0; maxT = 0; }
      const range = Math.max(maxT - minT, 0.1);
      const totalW = hCount * hColW + (hCount - 1) * hGap;
      let pts = "", hasPts = false;
      for (let i = 0; i < hCount; i++) {
        const t = new Date(hourly.time[startIdx + i]);
        const isNow = (i === 0);
        const label = isNow ? "现在" : (t.getHours() + "时");
        const hInfo = WMO[hourly.weather_code[startIdx + i]] || ["🌡️", "未知"];
        const tempVal = hTemps[i];
        const temp = tempVal != null ? Math.round(tempVal) + "°" : "--";
        const pp = hourly.precipitation_probability[startIdx + i] != null ? Math.round(hourly.precipitation_probability[startIdx + i]) + "%" : "";
        let dotHtml = "", tempStyle = "";
        if (tempVal != null) {
          const x = i * (hColW + hGap) + hColW / 2;
          const y = hSvgH - 36 - ((tempVal - minT) / range) * (hSvgH - 56);
          pts += (hasPts ? " " : "") + x + "," + y;
          hasPts = true;
          dotHtml = '<div class="weather-hour-dot" style="top:' + y + 'px"></div>';
          tempStyle = ' style="top:' + (y + 9) + 'px"';
        }
        hoursHtml +=
          '<div class="weather-hour-col">' +
            '<div class="weather-hour-time">' + label + '</div>' +
            '<div class="weather-hour-icon">' + hInfo[0] + '</div>' +
            '<div class="weather-hour-precip">' + pp + '</div>' +
            '<div class="weather-hour-text">' + hInfo[1] + '</div>' +
            '<div class="weather-hour-chart">' +
              dotHtml +
              '<div class="weather-hour-temp"' + tempStyle + '>' + temp + '</div>' +
            '</div>' +
          '</div>';
      }
      if (hasPts) {
        hourlyCurveSvg = '<svg class="weather-hour-curve" viewBox="0 0 ' + totalW + ' ' + hSvgH + '" width="' + totalW + '" height="' + hSvgH + '"><polyline points="' + pts + '" /></svg>';
      }
    }
    let daysHtml = "";
    let dailyCurveSvg = "";
    let dailyTempLabels = "";
    const dColW = 92, dGap = 10, dSvgH = 86;
    const weekLabels = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];
    const dCount = Math.min(7, dTime.length);
    const hiTemps = [], loTemps = [];
    const dayData = [];
    for (let i = 0; i < dCount; i++) {
      const date = new Date(dTime[i]);
      const label = i === 0 ? "今天" : (i === 1 ? "明天" : weekLabels[date.getDay()]);
      const dateStr = (date.getMonth() + 1) + "-" + date.getDate();
      const dInfo = WMO[dCode[i]] || ["🌡️", "未知"];
      const hiVal = maxArr[i], loVal = minArr[i];
      const dPp = precip[i] != null ? Math.round(precip[i]) + "%" : "";
      dayData.push({ label, dateStr, dInfo, hiVal, loVal, dPp });
      if (hiVal != null) hiTemps.push(hiVal);
      if (loVal != null) loTemps.push(loVal);
    }
    if (hiTemps.length > 1 && loTemps.length > 1) {
      const dCountReal = Math.min(hiTemps.length, loTemps.length);
      const totalW = dCountReal * dColW + (dCountReal - 1) * dGap;
      const allT = hiTemps.concat(loTemps);
      const minT = Math.min.apply(null, allT), maxT = Math.max.apply(null, allT);
      const range = Math.max(maxT - minT, 0.1);
      let hiPts = "", loPts = "";
      for (let i = 0; i < dCountReal; i++) {
        const d = dayData[i];
        const x = i * (dColW + dGap) + dColW / 2;
        const hiY = 18 + ((maxT - d.hiVal) / range) * 18;
        const loY = 42 + ((maxT - d.loVal) / range) * 18;
        hiPts += (i ? " " : "") + x + "," + hiY;
        loPts += (i ? " " : "") + x + "," + loY;
        daysHtml +=
          '<div class="weather-day-col">' +
            '<div class="weather-day-name">' + d.label + '</div>' +
            '<div class="weather-day-date">' + d.dateStr + '</div>' +
            '<div class="weather-day-icon">' + d.dInfo[0] + '</div>' +
            '<div class="weather-day-precip">' + d.dPp + '</div>' +
            '<div class="weather-day-text">' + d.dInfo[1] + '</div>' +
            '<div class="weather-day-chart">' +
              '<div class="weather-day-dot-hi" style="top:' + hiY + 'px"></div>' +
              '<div class="weather-day-dot-lo" style="top:' + loY + 'px"></div>' +
            '</div>' +
          '</div>';
        dailyTempLabels +=
          '<span class="weather-day-temp-hi" style="left:' + x + 'px;bottom:' + (dSvgH + 18 - hiY + 12) + 'px">' + Math.round(d.hiVal) + '°</span>' +
          '<span class="weather-day-temp-lo" style="left:' + x + 'px;bottom:' + (dSvgH + 18 - loY - 20) + 'px">' + Math.round(d.loVal) + '°</span>';
      }
      dailyCurveSvg =
        '<svg class="weather-day-curve-wrap" viewBox="0 0 ' + totalW + ' ' + dSvgH + '" width="' + totalW + '" height="' + dSvgH + '">' +
          '<polyline class="weather-day-curve-hi" points="' + hiPts + '" />' +
          '<polyline class="weather-day-curve-lo" points="' + loPts + '" />' +
        '</svg>';
    } else {
      for (let i = 0; i < dayData.length; i++) {
        const d = dayData[i];
        daysHtml +=
          '<div class="weather-day-col">' +
            '<div class="weather-day-name">' + d.label + '</div>' +
            '<div class="weather-day-date">' + d.dateStr + '</div>' +
            '<div class="weather-day-icon">' + d.dInfo[0] + '</div>' +
            '<div class="weather-day-precip">' + d.dPp + '</div>' +
            '<div class="weather-day-text">' + d.dInfo[1] + '</div>' +
          '</div>';
      }
    }
    document.querySelector("#weatherOverlay .weather-pop").innerHTML =
      '<div class="weather-pop-head">' +
        '<button class="weather-pop-city" onclick="toggleCityMenu(event)" title="切换城市">' +
          '<span class="weather-pop-city-name">' + escapeHtml(cityName) + '</span>' +
          '<span class="weather-pop-city-caret">▾</span>' +
        '</button>' +
        '<button class="weather-pop-close" onclick="wsWeatherClose()" title="关闭 (Esc)">×</button>' +
      '</div>' +
      '<div class="weather-pop-hero">' +
        '<div class="weather-pop-hero-left">' +
          '<div class="weather-pop-icon">' + info[0] + '</div>' +
          '<div class="weather-pop-temp">' + (cur.temperature_2m != null ? Math.round(cur.temperature_2m) : "--") + '°</div>' +
        '</div>' +
        '<div class="weather-pop-hero-body">' +
          '<div class="weather-pop-hero-top">' +
            '<div class="weather-pop-desc">' + info[1] + '</div>' +
          '</div>' +
          '<div class="weather-pop-tags hero-tags">' + tags.join("") + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="weather-pop-section">' +
        '<div class="weather-pop-section-title">24 小时预报</div>' +
        '<div class="weather-pop-hours">' +
          '<div class="weather-hour-items">' + hoursHtml + '</div>' +
          hourlyCurveSvg +
        '</div>' +
      '</div>' +
      '<div class="weather-pop-section">' +
        '<div class="weather-pop-section-title">7 天预报</div>' +
        '<div class="weather-pop-days">' +
          '<div class="weather-day-items">' + daysHtml + '</div>' +
          dailyCurveSvg +
          dailyTempLabels +
        '</div>' +
      '</div>';
  }

  /* ===== 专注模式 (Focus) ===== */

  }
  function wsFocusSetMode(cmpId, mode) {
    const cmp = (CONFIG.workspace.components || []).find(c => c.id === cmpId);
    if (!cmp) return;

  /* ===== 本地相册组件 ===== */
  var wsAlbumState = {};   // cmpId -> { photos:[dataURL...], index:0 }
  var wsAlbumTimer = null;
  function wsAlbumEnsureTimer() {
    if (wsAlbumTimer) return;
    wsAlbumTimer = setInterval(function () {
      Object.keys(wsAlbumState).forEach(function (id) {
        var s = wsAlbumState[id];
        if (!s || !s.photos || !s.photos.length) return;
        s.index = (s.index + 1) % s.photos.length;
        var img = document.getElementById("ws_album_preview_" + id);
        if (img) img.src = s.photos[s.index];
      });
    }, 10000);
  }
  function wsAlbumIDB() {
    return new Promise(function (res, rej) {
      var req = indexedDB.open("albumCacheDB", 1);
      req.onupgradeneeded = function () { req.result.createObjectStore("albums"); };
      req.onsuccess = function () { res(req.result); };
      req.onerror = function () { rej(req.error); };
    });
  }
  function wsAlbumSaveCache(cmpId, photos) {
    wsAlbumIDB().then(function (db) {
      var tx = db.transaction("albums", "readwrite");
      var req = tx.objectStore("albums").put(photos, cmpId);
      var handled = false;
      function onQuota() {
        if (handled) return; handled = true;
        showToast("缓存空间不足，本次照片仅本次会话可用");
      }
      req.onerror = function () {
        if (req.error && (req.error.name === "QuotaExceededError" || req.error.name === "NS_ERROR_DOM_QUOTA_REACHED")) onQuota();
      };
      tx.onerror = function () {
        if (tx.error && (tx.error.name === "QuotaExceededError" || tx.error.name === "NS_ERROR_DOM_QUOTA_REACHED")) onQuota();
        try { db.close(); } catch (e) {}
      };
      tx.oncomplete = function () { db.close(); };
    }).catch(function () {});
  }
  function wsAlbumLoadCache(cmpId) {
    wsAlbumIDB().then(function (db) {
      var tx = db.transaction("albums", "readonly");
      var r = tx.objectStore("albums").get(cmpId);
      r.onsuccess = function () {
        db.close();
        var photos = r.result;
        if (photos && photos.length) {
          wsAlbumState[cmpId] = { photos: photos, index: 0 };
          wsAlbumEnsureTimer();
          wsRenderDIY();
        }
      };
      r.onerror = function () { db.close(); };
    }).catch(function () {});
  }
  function wsAlbumFileToDataURL(file, maxW, cb) {
    var reader = new FileReader();
    reader.onload = function () {
      var img = new Image();
      img.onload = function () {
        var w = img.width, h = img.height;
        if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
        var c = document.createElement("canvas");
        c.width = w; c.height = h;
        c.getContext("2d").drawImage(img, 0, 0, w, h);
        try { cb(c.toDataURL("image/jpeg", 0.7)); }
        catch (e) { cb(reader.result); }
      };
      img.onerror = function () { cb(reader.result); };
      img.src = reader.result;
    };
    reader.onerror = function () { cb(null); };
    reader.readAsDataURL(file);
  }
  function wsAlbumPick(cmpId) {
    var inp = document.getElementById("ws_album_fileinput");
    if (!inp) {
      inp = document.createElement("input");
      inp.type = "file"; inp.id = "ws_album_fileinput";
      inp.setAttribute("webkitdirectory", "");
      inp.setAttribute("directory", "");
      inp.multiple = true; inp.accept = "image/*";
      inp.style.display = "none";
      document.body.appendChild(inp);
      inp.addEventListener("change", function () {
        var id = inp.getAttribute("data-cmp");
        wsAlbumOnPicked(id, inp.files);
      });
    }
    inp.setAttribute("data-cmp", cmpId);
    inp.value = "";
    inp.click();
  }
  function wsAlbumPickFiles(cmpId) {
    var inp = document.getElementById("ws_album_files_input");
    if (!inp) {
      inp = document.createElement("input");
      inp.type = "file"; inp.id = "ws_album_files_input";
      inp.multiple = true; inp.accept = "image/*";
      inp.style.display = "none";
      document.body.appendChild(inp);
      inp.addEventListener("change", function () {
        var id = inp.getAttribute("data-cmp");
        wsAlbumOnPicked(id, inp.files);
      });
    }
    inp.setAttribute("data-cmp", cmpId);
    inp.value = "";
    inp.click();
  }
  var WS_ALBUM_CACHE_LIMIT = 20;
  function wsAlbumOnPicked(cmpId, fileList) {
    var all = Array.prototype.slice.call(fileList || []).filter(function (f) {
      return f.type && f.type.indexOf("image/") === 0;
    });
    if (!all.length) { showToast("未找到图片文件"); return; }
    // 按文件名排序，保证每次选取顺序一致（避免浏览器顺序随机）
    all.sort(function (a, b) { return a.name < b.name ? -1 : (a.name > b.name ? 1 : 0); });
    var files = all, skipped = 0;
    if (all.length > WS_ALBUM_CACHE_LIMIT) {
      files = all.slice(0, WS_ALBUM_CACHE_LIMIT);
      skipped = all.length - WS_ALBUM_CACHE_LIMIT;
    }
    showToast(skipped
      ? ("一次最多缓存 " + WS_ALBUM_CACHE_LIMIT + " 张，已加载前 " + WS_ALBUM_CACHE_LIMIT + " 张（共 " + all.length + " 张）")
      : ("正在加载 " + files.length + " 张照片…"));
    var photos = [], done = 0;
    files.forEach(function (f, i) {
      wsAlbumFileToDataURL(f, 1280, function (dataUrl) {
        if (dataUrl) photos[i] = dataUrl;
        done++;
        if (done === files.length) {
          var arr = photos.filter(Boolean);
          wsAlbumState[cmpId] = { photos: arr, index: 0 };
          wsAlbumSaveCache(cmpId, arr);
          wsRenderDIY();
          showToast("已加载 " + arr.length + " 张照片" + (skipped ? "（超出部分未缓存）" : ""));
        }
      });
    });
  }
  function wsAlbumConfig(cmpId) {
    var s = wsAlbumState[cmpId];
    var cnt = s && s.photos ? s.photos.length : 0;
    var m = document.getElementById("modalContent");
    m.innerHTML =
      '<div class="modal-header"><span>本地相册设置</span><button class="modal-close" onclick="closeModal()">×</button></div>' +
      '<div class="ws-album-cfg">' +
        '<p class="ws-album-cfg-tip">当前已加载 ' + cnt + ' 张照片' + (cnt ? '（已缓存，刷新免重选）' : '') + '。<br>选择文件夹或多选图片可更换相册，一次最多缓存 20 张。</p>' +
        '<div class="modal-actions ws-water-cfg-actions ws-album-cfg-actions">' +
          '<button class="btn btn-danger-ghost" onclick="wsAlbumClearCache(\'' + cmpId + '\')">清除缓存</button>' +
          '<button class="btn btn-secondary" onclick="closeModal();wsAlbumPickFiles(\'' + cmpId + '\')">多选图片</button>' +
          '<button class="btn btn-primary" onclick="closeModal();wsAlbumPick(\'' + cmpId + '\')">选择文件夹</button>' +
        '</div>' +
      '</div>';
    document.getElementById("modalOverlay").classList.add("open");
  }
  function wsAlbumClearCache(cmpId) {
    wsAlbumIDB().then(function (db) {
      var tx = db.transaction("albums", "readwrite");
      tx.objectStore("albums").delete(cmpId);
      tx.oncomplete = function () {
        db.close();
        // 同时清空内存状态，避免卡片仍显示旧轮播
        delete wsAlbumState[cmpId];
        // 重新渲染卡片，回到「需重新选择」的空状态
        var cmp = (CONFIG.workspace.components || []).find(function (c) { return c.id === cmpId; });
        var body = document.getElementById("ws_cmp_body_" + cmpId);
        if (cmp && body) wsRenderAlbum(body, cmp);
        closeModal();
        showToast("已清除相册缓存，请重新选择");
      };
      tx.onerror = function () { try { db.close(); } catch (e) {} };
    }).catch(function () {});
  }

  function wsAlbumCardNav(cmpId, dir) {
    var s = wsAlbumState[cmpId];
    if (!s || !s.photos || !s.photos.length) return;
    var idx = (s.index || 0) + dir;
    if (idx < 0) idx = s.photos.length - 1;

    wsFocusDrag = { dx: e.clientX - rect.left, dy: e.clientY - rect.top };
    document.addEventListener("pointermove", wsFocusPopupDragMove);
    document.addEventListener("pointerup", wsFocusPopupDragEnd);
    e.preventDefault();
  }
  function wsFocusPopupDragMove(e) {
    if (!wsFocusDrag) return;
    const p = document.getElementById("focusPopup");
    let x = e.clientX - wsFocusDrag.dx;
    let y = e.clientY - wsFocusDrag.dy;
    x = Math.max(0, Math.min(window.innerWidth - p.offsetWidth, x));
    y = Math.max(0, Math.min(window.innerHeight - p.offsetHeight, y));
    p.style.left = x + "px";
    p.style.top = y + "px";
  }
  function wsFocusPopupDragEnd() {
    document.removeEventListener("pointermove", wsFocusPopupDragMove);
    document.removeEventListener("pointerup", wsFocusPopupDragEnd);
    if (wsFocusDrag && wsFocusState) {
      const p = document.getElementById("focusPopup");
      const cmp = (CONFIG.workspace.components || []).find(c => c.id === wsFocusState.cmpId);
      if (cmp) {
        if (!cmp.config) cmp.config = {};
        cmp.config.popupPos = { x: parseInt(p.style.left, 10) || 0, y: parseInt(p.style.top, 10) || 0 };
        saveConfig();
      }
    }
    wsFocusDrag = null;
  }
  function wsFocusSelectChip(el, minutes) {
    const chips = el.parentNode.querySelectorAll(".ws-focus-chip");
    chips.forEach(c => c.classList.remove("active"));
    el.classList.add("active");
    const custom = document.getElementById("wsFocusCustomMin");
    if (custom) custom.style.display = minutes === 0 ? "block" : "none";
  }
  function wsFocusStart(cmpId) {
    const cmp = (CONFIG.workspace.components || []).find(c => c.id === cmpId);
    if (!cmp) return;
    const cfg = cmp.config || {};
    const mode = cfg.mode === "stopwatch" ? "stopwatch" : "pomodoro";
    let minutes = 25;
    if (mode === "pomodoro") {
      const activeChip = document.querySelector('#wsFocusChips .ws-focus-chip.active');
      if (activeChip) {
        const dm = activeChip.dataset.min;
        if (dm === "custom") {
          const v = parseInt(document.getElementById("wsFocusCustomMin").value || "25", 10);
          minutes = isNaN(v) || v <= 0 ? 25 : v;
        } else {
          minutes = parseInt(dm, 10) || 25;
        }
      }
    }
    const task = document.getElementById("wsFocusTask").value.trim();
    if (!cmp.config) cmp.config = {};
    cmp.config.mode = mode;
    if (mode === "pomodoro") cmp.config.defaultMinutes = minutes;
    if (task) cmp.config.defaultTask = task;
    else delete cmp.config.defaultTask;
    saveConfig();
    closeModal();
    if (wsFocusState && wsFocusState.timerId) clearInterval(wsFocusState.timerId);
    const style = cfg.style === "popup" ? "popup" : "fullscreen";
    wsFocusState = {
      cmpId,
      mode,
      duration: mode === "pomodoro" ? minutes * 60 : 0,
      remaining: mode === "pomodoro" ? minutes * 60 : 0,
      task: task || (mode === "pomodoro" ? "专注中" : "计时中"),
      paused: false,
      timerId: null
    };
    // 先隐藏另一种形态，避免残留
    document.getElementById("focusOverlay").classList.remove("open");
    document.getElementById("focusOverlay").setAttribute("aria-hidden", "true");
    document.getElementById("focusPopup").classList.remove("open");
    document.getElementById("focusPopup").setAttribute("aria-hidden", "true");
    if (style === "popup") {
      wsFocusShowPopup();
    } else {
      document.getElementById("focusOverlay").setAttribute("aria-hidden", "false");
      document.getElementById("focusOverlay").classList.add("open");
    }
    wsFocusState.timerId = setInterval(wsFocusTick, 1000);
    wsFocusTick();
    wsRenderDIY();
  }
  function wsFocusTick() {
    if (!wsFocusState) return;
    if (!wsFocusState.paused) {
      if (wsFocusState.mode === "stopwatch") {
        wsFocusState.remaining++;
      } else {
        wsFocusState.remaining--;
        if (wsFocusState.remaining <= 0) {
          wsFocusState.remaining = 0;
          wsFocusRender();
          clearInterval(wsFocusState.timerId);
          wsFocusState.timerId = null;
          showToast("专注时间结束，休息一下吧");
          return;
        }
      }
    }
    wsFocusRender();
  }
  function wsFocusRender() {
    if (!wsFocusState) return;
    const modeText = wsFocusState.mode === "stopwatch" ? "正计时" : "番茄钟";
    const t = wsFocusFormatTime(wsFocusState.remaining);
    // 全屏遮罩
    const fh = document.getElementById("focusHead");
    if (fh) fh.textContent = modeText;
    const ft = document.getElementById("focusTimer");
    if (ft) ft.textContent = t;
    const fta = document.getElementById("focusTask");
    if (fta) fta.textContent = wsFocusState.task;
    const pauseBtn = document.getElementById("focusPauseBtn");
    if (pauseBtn) pauseBtn.textContent = wsFocusState.paused ? "继续" : "暂停";
    // 弹窗
    const ph = document.getElementById("focusPopupHead");
    if (ph) ph.textContent = modeText;
    const pt = document.getElementById("focusPopupTimer");
    if (pt) pt.textContent = t;
    const pta = document.getElementById("focusPopupTask");
    if (pta) pta.textContent = wsFocusState.task;
    const pp = document.getElementById("focusPopupPause");
    if (pp) pp.textContent = wsFocusState.paused ? "继续" : "暂停";
  }
  function wsFocusShowPopup() {
    const p = document.getElementById("focusPopup");
    if (!p) return;
    const cmp = (CONFIG.workspace.components || []).find(c => c.id === (wsFocusState && wsFocusState.cmpId));
    const pos = cmp && cmp.config && cmp.config.popupPos;
    if (pos && typeof pos.x === "number" && typeof pos.y === "number") {
      p.style.left = pos.x + "px";
      p.style.top = pos.y + "px";
    } else {
      p.style.left = (window.innerWidth - p.offsetWidth - 24) + "px";
      p.style.top = (window.innerHeight - p.offsetHeight - 24) + "px";
    }
    p.setAttribute("aria-hidden", "false");
    p.classList.add("open");
  }
  function wsFocusTogglePause() {
    if (!wsFocusState) return;
    wsFocusState.paused = !wsFocusState.paused;
    wsFocusRender();
  }
  // 重置：番茄钟回到设定时长，正计时归零；并解除暂停、必要时重启计时（番茄钟结束后计时器已停）
  function wsFocusReset() {
    if (!wsFocusState) return;
    wsFocusState.remaining = wsFocusState.mode === "pomodoro" ? wsFocusState.duration : 0;
    wsFocusState.paused = false;
    if (!wsFocusState.timerId) {
      wsFocusState.timerId = setInterval(wsFocusTick, 1000);
    }
    wsFocusRender();
  }
  function wsFocusStop(exit) {
    if (!wsFocusState) return;
    if (wsFocusState.timerId) clearInterval(wsFocusState.timerId);
    const elapsed = wsFocusState.remaining || 0;
    const isStopwatch = wsFocusState.mode === "stopwatch";
    const overlay = document.getElementById("focusOverlay");
    overlay.classList.remove("open");
    overlay.setAttribute("aria-hidden", "true");
    const popup = document.getElementById("focusPopup");
    popup.classList.remove("open");
    popup.setAttribute("aria-hidden", "true");
    if (exit) {
      if (isStopwatch && elapsed > 0) {
        showToast("本次正计时：" + wsFocusFormatTime(elapsed));
      }
      wsFocusState = null;
    }
    wsRenderDIY();
  }
  function wsFocusFormatTime(seconds) {
    const m = Math.floor(seconds / 60);
    const s = seconds % 60;
    return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
  }

  // =====================================================================
  //  工作台 DIY 组件：密码管理器（纯前端 Web Crypto，本地加密存储）
  //  约束：不调用外部接口；AES-GCM 密钥仅存内存；密文/iv/salt 存 IndexedDB(localStorage 降级)；
  //        支持导出/导入加密 .encrypted.json；主密码 PBKDF2-HMAC-SHA256(150000)+AES-GCM(256)。
  // =====================================================================
  var wsPwdState = {};      // cmpId -> { unlocked, key(CryptoKey,仅内存), salt(Uint8Array), accounts:[] }
  var wsPwdIdleTimers = {}; // cmpId -> timeout id
  var wsPwdReveal = {};     // cmpId -> Set(已临时显示明文的 account id)
  var wsPwdCurrent = null;  // 当前打开管理 overlay 的 cmpId

  const WS_PWD_ITER = 150000;
  const WS_PWD_DBNAME = "passwordVaultDB";
  const WS_PWD_IDLE_MIN = 5; // 闲置自动锁定（分钟）

  function wsPwdCryptoReady() {
    return !!(window.crypto && window.crypto.subtle && window.crypto.getRandomValues);
  }
  function wsPwdCryptoWarn() {
    showToast("当前环境不支持 Web Crypto：请通过 http://localhost 打开（勿用 file://），例如运行 python -m http.server");
  }

  // ---- base64 ----
  function wsPwdB64Encode(buf) {
    var bytes = (buf instanceof Uint8Array) ? buf : new Uint8Array(buf);
    var bin = "";
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin);
  }
  function wsPwdB64Decode(b64) {
    var bin = atob(b64), a = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
    return a;
  }
  function wsPwdRandom(n) { var a = new Uint8Array(n); crypto.getRandomValues(a); return a; }

  // ---- 密钥派生 + 加解密 ----
  function wsPwdDeriveKey(masterPwd, salt) {
    return crypto.subtle.importKey("raw", new TextEncoder().encode(masterPwd), "PBKDF2", false, ["deriveKey"])
      .then(function (base) {
        return crypto.subtle.deriveKey(
          { name: "PBKDF2", salt: salt, iterations: WS_PWD_ITER, hash: "SHA-256" },
          base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]
        );
      });
  }
  function wsPwdEncryptWithKey(key, salt, obj) {
    var iv = wsPwdRandom(12);
    return crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, key, new TextEncoder().encode(JSON.stringify(obj)))
      .then(function (ct) { return { salt: wsPwdB64Encode(salt), iv: wsPwdB64Encode(iv), ciphertext: wsPwdB64Encode(ct) }; });
  }
  function wsPwdEncrypt(masterPwd, obj) {
    var salt = wsPwdRandom(16);
    return wsPwdDeriveKey(masterPwd, salt).then(function (key) {
      return wsPwdEncryptWithKey(key, salt, obj).then(function (data) { return { key: key, salt: salt, data: data }; });
    });
  }
  function wsPwdDecryptWithKey(key, data) {
    return crypto.subtle.decrypt({ name: "AES-GCM", iv: wsPwdB64Decode(data.iv) }, key, wsPwdB64Decode(data.ciphertext))
      .then(function (pt) { return JSON.parse(new TextDecoder().decode(pt)); });
  }
  function wsPwdDecrypt(masterPwd, data) {
    var salt = wsPwdB64Decode(data.salt);
    return wsPwdDeriveKey(masterPwd, salt).then(function (key) {
      return wsPwdDecryptWithKey(key, data).then(function (obj) { return { key: key, salt: salt, obj: obj }; });
    });
  }

  // ---- 存储（IndexedDB 优先，localStorage 降级）----
  function wsPwdIDB() {
    return new Promise(function (res, rej) {
      if (!("indexedDB" in window) || !window.indexedDB) { rej(new Error("no-idb")); return; }
      var req = indexedDB.open(WS_PWD_DBNAME, 1);
      req.onupgradeneeded = function () { req.result.createObjectStore("vaults"); };
      req.onsuccess = function () { res(req.result); };
      req.onerror = function () { rej(req.error); };
    });
  }
  // 写入保险库：密文优先存入组件配置 cmp.config.vault，随 CONFIG 由 saveConfig() 持久化到 config.json（绑定磁盘文件时）或 localStorage（兜底）；
  // 同时冗余写 IndexedDB 作双保险。落盘数据全部为密文 {ciphertext,iv,salt}，密钥仅驻留内存，安全不泄露。
  function wsPwdSaveVault(cmpId, data) {
    try {
      var cmp = (CONFIG.workspace.components || []).find(function (c) { return c.id === cmpId; });
      if (cmp) { cmp.config = cmp.config || {}; cmp.config.vault = data; }
    } catch (e) {}
    try { saveConfig(); } catch (e) {}
    wsPwdIDB().then(function (db) {
      var tx = db.transaction("vaults", "readwrite");
      tx.objectStore("vaults").put(data, cmpId);
      tx.oncomplete = function () { db.close(); };
      tx.onerror = function () { db.close(); };
    }).catch(function () {});
    return Promise.resolve();
  }
  // 读取保险库：优先 cmp.config.vault（即 config.json / 磁盘文件中的密文，最安全、不丢失）；
  // 回退 IndexedDB / localStorage（旧数据），并自动回填到 config.vault 完成迁移，使单一数据源收敛到 config。
  function wsPwdLoadVault(cmpId) {
    var getCmp = function () { try { return (CONFIG.workspace.components || []).find(function (c) { return c.id === cmpId; }); } catch (e) { return null; } };
    var cmp = getCmp();
    if (cmp && cmp.config && cmp.config.vault && cmp.config.vault.ciphertext) {
      return Promise.resolve(cmp.config.vault);
    }
    var migrate = function (d) {
      if (d && !(cmp && cmp.config && cmp.config.vault && cmp.config.vault.ciphertext)) {
        try { cmp = cmp || getCmp(); if (cmp) { cmp.config = cmp.config || {}; cmp.config.vault = d; saveConfig(); } } catch (e) {}
      }
      return d;
    };
    return wsPwdIDB().then(function (db) {
      return new Promise(function (res) {
        var tx = db.transaction("vaults", "readonly");
        var r = tx.objectStore("vaults").get(cmpId);
        r.onsuccess = function () { db.close(); res(migrate(r.result || null)); };
        r.onerror = function () { db.close(); res(null); };
      });
    }).catch(function () {
      try { var raw = localStorage.getItem("pwdvault_" + cmpId); var d = raw ? JSON.parse(raw) : null; return Promise.resolve(migrate(d)); }
      catch (e) { return Promise.resolve(null); }
    });
  }
  function wsPwdHasVault(cmpId) {
    return wsPwdLoadVault(cmpId).then(function (d) { return !!d; });
  }

  // 保险库规范：保证 categories / 账号 categoryId 字段存在（兼容旧数据）
  function wsPwdNormalizeVault(obj) {
    obj = obj || {};
    var cats = (obj.categories && Array.isArray(obj.categories) && obj.categories.length)
      ? obj.categories : [{ id: "default", name: "默认" }];
    var ids = {}; cats.forEach(function (c) { ids[c.id] = true; });
    var accounts = Array.isArray(obj.accounts) ? obj.accounts : [];
    accounts.forEach(function (a) {
      if (!a.id) a.id = wsGenId();
      if (!a.categoryId || !ids[a.categoryId]) a.categoryId = "default";
    });
    return { accounts: accounts, categories: cats };
  }

  // ---- 卡片渲染 ----
  function wsRenderPassword(body, cmp) {
    var id = cmp.id;
    var st = wsPwdState[id];
    var unlocked = !!(st && st.unlocked);
    var count = unlocked && st.accounts ? st.accounts.length : 0;
    var mainAction = unlocked ? 'wsPwdOpenManager(\'' + id + '\')' : 'wsPwdUnlock(\'' + id + '\')';
    var btnText = unlocked ? '🔑 管理密码' : '🔓 解锁';
    body.innerHTML =
      '<div class="ws-cmp-head">' +
        '<span class="ws-cmp-icon">🔐</span>' +
        '<span class="ws-cmp-title">密码管理器</span>' +
        '<span class="ws-cmp-actions">' +
          '<span class="ws-cmp-btn" onclick="event.stopPropagation();wsPwdOpenCardMenu(\'' + id + '\')" title="更多">⚙️</span>' +
        '</span>' +
      '</div>' +
      '<div class="ws-pwd-main" onclick="' + mainAction + '">' +
        '<div class="ws-pwd-ring">' + (unlocked ? '🔓' : '🔒') + '</div>' +
        '<div class="ws-pwd-info">' +
          '<div class="ws-pwd-line1">' + (unlocked ? ('已保存 ' + count + ' 条账号') : '账户密码已锁定') + '</div>' +
          '<div class="ws-pwd-line2">加密存储 · 主密码不可遗失</div>' +
        '</div>' +
      '</div>' +
      '<button class="ws-pwd-btn" onclick="event.stopPropagation();' + mainAction + '">' + btnText + '</button>';
    var card = body.closest(".ws-diy-card");
    if (card) card.onclick = function (e) {
      if (wsDiyEditMode) return;
      if (e.target.closest(".ws-pwd-btn") || e.target.closest(".ws-cmp-actions")) return;
      if (unlocked) wsPwdOpenManager(id); else wsPwdUnlock(id);
    };
  }

  // 卡片齿轮菜单：导出 / 导入 / 改密 / 锁定
  function wsPwdOpenCardMenu(cmpId) {
    var st = wsPwdState[cmpId];
    var unlocked = !!(st && st.unlocked);
    var items = [
      { label: '⬆ 导出加密备份', action: 'wsPwdExport(\'' + cmpId + '\')' },
      { label: '⬇ 导入加密备份', action: 'wsPwdImport(\'' + cmpId + '\')' },
