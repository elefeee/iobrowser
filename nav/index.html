        }).join('') +
        '<div class="ws-pwd-menu-sep"></div>' +
        '<button class="ws-pwd-menu-item danger" onclick="wsPwdClearConfirm()">🗑 清空数据</button>' +
      '</div>';
    document.getElementById("modalOverlay").classList.add("open");
  }

  // ---- 清空数据：二次确认（需手输话术）----
  function wsPwdClearConfirm() {
    var PHRASE = "我需要清空密码管理器的账号密码数据";
    var m = document.getElementById("modalContent");
    m.innerHTML =
      '<div class="modal-header"><h3>⚠️ 清空数据</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>' +
      '<div class="modal-body ws-pwd-clear">' +
        '<p class="ws-pwd-tip ws-pwd-danger">此操作将<b>永久删除</b>本地所有密码管理器的账号密码数据（含 config.json 文件与浏览器加密库），<b>不可恢复</b>，主密码也无法找回。</p>' +
        '<p class="ws-pwd-tip">请在下方完整输入以下话术以确认：</p>' +
        '<div class="ws-pwd-phrase">' + PHRASE + '</div>' +
        '<input type="text" id="wsPwdClearInput" class="ws-pwd-input" placeholder="输入上述话术" autocomplete="off" oninput="wsPwdClearInputChanged()">' +
        '<div class="ws-pwd-err" id="wsPwdClearErr"></div>' +
      '</div>' +
      '<div class="modal-actions">' +
        '<button class="btn btn-secondary" onclick="closeModal()">取消</button>' +
        '<button class="btn btn-danger" id="wsPwdClearBtn" disabled onclick="wsPwdClearDo()">确认清空</button>' +
      '</div>';
    document.getElementById("modalOverlay").classList.add("open");
    setTimeout(function () { var e = document.getElementById("wsPwdClearInput"); if (e) e.focus(); }, 50);
  }
  function wsPwdClearInputChanged() {
    var inp = document.getElementById("wsPwdClearInput");
    var btn = document.getElementById("wsPwdClearBtn");
    var err = document.getElementById("wsPwdClearErr");
    if (!inp || !btn) return;
    if (inp.value.trim() === "我需要清空密码管理器的账号密码数据") {
      btn.disabled = false; err.textContent = "";
    } else {
      btn.disabled = true; err.textContent = "";
    }
  }
  function wsPwdClearDo() {
    var inp = document.getElementById("wsPwdClearInput");
    if (!inp || inp.value.trim() !== "我需要清空密码管理器的账号密码数据") { return; }
    var cmps = (CONFIG.workspace.components || []).filter(function (c) { return c.type === "password"; });
    cmps.forEach(function (c) {
      if (c.config) { delete c.config.vault; }
      try { localStorage.removeItem("pwdvault_" + c.id); } catch (e) {}
      delete wsPwdState[c.id];
      delete wsPwdReveal[c.id];
    });
    wsPwdIDB().then(function (db) {
      var tx = db.transaction("vaults", "readwrite");
      tx.objectStore("vaults").clear();
      tx.oncomplete = function () { db.close(); };
      tx.onerror = function () { db.close(); };
    }).catch(function () {});
    try { saveConfig(); } catch (e) {}
    try { wsPwdCloseManager(); } catch (e) {}
    closeModal();
    wsRenderDIY();
    showToast("已清空所有密码管理器数据");
  }

  // ---- 主密码弹窗（初始化 / 解锁）----
  function wsPwdUnlock(cmpId) {
    if (!wsPwdCryptoReady()) { wsPwdCryptoWarn(); return; }
    wsPwdHasVault(cmpId).then(function (has) {
      var m = document.getElementById("modalContent");
      var html;
      if (has) {
        html =
          '<div class="modal-header"><h3>🔓 解锁密码管理器</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>' +
          '<div class="modal-body">' +
            '<p class="ws-pwd-tip">输入主密码以解密本地账号数据。密码仅用于本机派生密钥，不会上传任何服务器。</p>' +
            '<input type="password" id="wsPwdMaster" class="ws-pwd-input" placeholder="主密码" autocomplete="off" onkeydown="if(event.key===\'Enter\')wsPwdDoUnlock(\'' + cmpId + '\')">' +
            '<div class="ws-pwd-err" id="wsPwdErr"></div>' +
          '</div>' +
          '<div class="modal-actions">' +
            '<button class="btn btn-secondary" onclick="closeModal()">取消</button>' +
            '<button class="btn btn-primary" onclick="wsPwdDoUnlock(\'' + cmpId + '\')">解锁</button>' +
          '</div>';
      } else {
        html =
          '<div class="modal-header"><h3>🔐 初始化主密码</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>' +
          '<div class="modal-body">' +
            '<p class="ws-pwd-tip">首次使用，请设置主密码。它将通过 PBKDF2(150000 次迭代)+AES-GCM 加密本地数据。' +
            '<b>主密码遗忘将无法找回数据</b>，请务必牢记并妥善保存。</p>' +
            '<input type="password" id="wsPwdMaster" class="ws-pwd-input" placeholder="设置主密码" autocomplete="off" onkeydown="if(event.key===\'Enter\'){var e=document.getElementById(\'wsPwdMaster2\');if(e)e.focus();}">' +
            '<input type="password" id="wsPwdMaster2" class="ws-pwd-input" placeholder="再次输入主密码" autocomplete="off" style="margin-top:8px" onkeydown="if(event.key===\'Enter\')wsPwdDoInit(\'' + cmpId + '\')">' +
            '<div class="ws-pwd-err" id="wsPwdErr"></div>' +
          '</div>' +
          '<div class="modal-actions">' +
            '<button class="btn btn-secondary" onclick="closeModal()">取消</button>' +
            '<button class="btn btn-primary" onclick="wsPwdDoInit(\'' + cmpId + '\')">创建保险库</button>' +
          '</div>';
      }
      m.innerHTML = html;
      document.getElementById("modalOverlay").classList.add("open");
      setTimeout(function () { var el = document.getElementById("wsPwdMaster"); if (el) el.focus(); }, 50);
    });
  }
  function wsPwdDoInit(cmpId) {
    var p1 = document.getElementById("wsPwdMaster").value;
    var p2 = document.getElementById("wsPwdMaster2").value;
    var err = document.getElementById("wsPwdErr");
    if (!p1) { err.textContent = "请输入主密码"; return; }
    if (p1.length < 6) { err.textContent = "主密码至少 6 位，更安全些"; return; }
    if (p1 !== p2) { err.textContent = "两次输入不一致"; return; }
    wsPwdEncrypt(p1, { accounts: [] }).then(function (r) {
      return wsPwdSaveVault(cmpId, r.data).then(function () {
        wsPwdState[cmpId] = { unlocked: true, key: r.key, salt: r.salt, accounts: [], categories: [{ id: "default", name: "默认" }] };
        wsPwdReveal[cmpId] = wsPwdReveal[cmpId] || new Set();
        closeModal();
        wsRenderDIY();
        wsPwdStartIdle(cmpId);
        wsPwdOpenManager(cmpId);
        showToast("保险库已创建");
      });
    }).catch(function () { err.textContent = "初始化失败，请重试"; });
  }
  function wsPwdDoUnlock(cmpId) {
    var p = document.getElementById("wsPwdMaster").value;
    var err = document.getElementById("wsPwdErr");
    if (!p) { err.textContent = "请输入主密码"; return; }
    wsPwdLoadVault(cmpId).then(function (data) {
      if (!data) { err.textContent = "未找到保险库数据"; return; }
      wsPwdDecrypt(p, data).then(function (r) {
        var obj = r.obj || {};
        var nv = wsPwdNormalizeVault(obj);
        wsPwdState[cmpId] = { unlocked: true, key: r.key, salt: r.salt, accounts: nv.accounts, categories: nv.categories, selectedCat: "all", search: "", catAdding: false, catRenaming: null };
        wsPwdReveal[cmpId] = wsPwdReveal[cmpId] || new Set();
        closeModal();
        wsRenderDIY();
        wsPwdStartIdle(cmpId);
        wsPwdOpenManager(cmpId);
      }).catch(function () { err.textContent = "主密码错误，无法解密"; });
    }).catch(function () { err.textContent = "读取保险库失败"; });
  }

  // ---- 用内存密钥重新加密并保存 ----
  function wsPwdPersist(cmpId) {
    var st = wsPwdState[cmpId];
    if (!st || !st.unlocked) return Promise.reject(new Error("locked"));
    return wsPwdEncryptWithKey(st.key, st.salt, { accounts: st.accounts, categories: st.categories }).then(function (data) {
      return wsPwdSaveVault(cmpId, data);
    });
  }

  // ---- 锁定 / 闲置 ----
  function wsPwdLock(cmpId) {
    if (wsPwdIdleTimers[cmpId]) { clearTimeout(wsPwdIdleTimers[cmpId]); delete wsPwdIdleTimers[cmpId]; }
    delete wsPwdState[cmpId];
    delete wsPwdReveal[cmpId];
    if (wsPwdCurrent === cmpId) { var ov = document.getElementById("pwdOverlay"); if (ov) ov.classList.remove("open"); wsPwdCurrent = null; }
    wsRenderDIY();
    showToast("已锁定，密钥已从内存清除");
  }
  function wsPwdStartIdle(cmpId) {
    if (wsPwdIdleTimers[cmpId]) clearTimeout(wsPwdIdleTimers[cmpId]);
    wsPwdIdleTimers[cmpId] = setTimeout(function () { wsPwdLock(cmpId); }, WS_PWD_IDLE_MIN * 60000);
  }
  function wsPwdResetIdle(cmpId) {
    if (wsPwdState[cmpId] && wsPwdState[cmpId].unlocked) wsPwdStartIdle(cmpId);
  }

  // ---- 管理 overlay ----
  function wsPwdEnsureOverlay() {
    var ov = document.getElementById("pwdOverlay");
    if (ov) return ov;
    ov = document.createElement("div");
    ov.id = "pwdOverlay"; ov.className = "pwd-overlay"; ov.setAttribute("aria-hidden", "true");
    ov.innerHTML = '<div class="pwd-panel">' +
      '<div class="pwd-panel-head" id="pwdPanelHead"></div>' +
      '<div class="pwd-body">' +
        '<div class="pwd-sidebar">' +
          '<div class="pwd-sidebar-head"><span>分类</span></div>' +
          '<div class="pwd-cat-list" id="pwdCatList"></div>' +
          '<div class="pwd-cat-add" id="pwdCatAdd"></div>' +
        '</div>' +
        '<div class="pwd-main">' +
          '<div class="pwd-toolbar" id="pwdToolbar"></div>' +
          '<div class="pwd-list" id="pwdList"></div>' +
        '</div>' +
      '</div>' +
      '<div class="pwd-panel-foot" id="pwdPanelFoot"></div>' +
    '</div>';
    document.body.appendChild(ov);
    return ov;
  }
  function wsPwdOpenManager(cmpId) {
    var st = wsPwdState[cmpId];
    if (!st || !st.unlocked) { wsPwdUnlock(cmpId); return; }
    wsPwdCurrent = cmpId;
    var ov = wsPwdEnsureOverlay();
    ov.classList.add("open");
    ov.setAttribute("aria-hidden", "false");
    ov.onclick = function (e) { if (e.target === ov) wsPwdCloseManager(); };
    ov.onmousemove = function () { wsPwdResetIdle(cmpId); };
    wsPwdRenderManager(cmpId);
  }
  function wsPwdCloseManager() {
    var ov = document.getElementById("pwdOverlay");
    if (ov) { ov.classList.remove("open"); ov.setAttribute("aria-hidden", "true"); }
    wsPwdCurrent = null;
  }
  function wsPwdRenderManager(cmpId) {
    var st = wsPwdState[cmpId];
    if (!st) return;
    var head = document.getElementById("pwdPanelHead");
    var foot = document.getElementById("pwdPanelFoot");
    var count = st.accounts.length;
    head.innerHTML =
      '<div class="pwd-head-title">🔐 密码管理器</div>' +
      '<div class="pwd-head-sub">' + count + ' 条账号 · 闲置 ' + WS_PWD_IDLE_MIN + ' 分钟自动锁定</div>' +
      '<div class="pwd-head-actions">' +
        '<button class="pwd-hbtn" onclick="wsPwdExport(\'' + cmpId + '\')" title="导出加密备份">⬆ 导出</button>' +
        '<button class="pwd-hbtn" onclick="wsPwdImport(\'' + cmpId + '\')" title="导入加密备份">⬇ 导入</button>' +
        '<button class="pwd-hbtn" onclick="wsPwdChangeMaster(\'' + cmpId + '\')" title="修改主密码">✎ 改密</button>' +
        '<button class="pwd-hbtn" onclick="wsPwdLock(\'' + cmpId + '\')" title="锁定">🔒 锁定</button>' +
        '<button class="pwd-hbtn close" onclick="wsPwdCloseManager()">×</button>' +
      '</div>';
    wsPwdRenderCats(cmpId);
    var tb = document.getElementById("pwdToolbar");
    if (tb) {
      tb.innerHTML =
        '<div class="pwd-search"><span class="pwd-search-ico">🔍</span><input id="pwdSearch" class="ws-pwd-input" placeholder="搜索标题 / 账号 / 站点…" value="' + escapeHtml(st.search || "") + '" oninput="wsPwdSearch(\'' + cmpId + '\',this.value)"></div>' +
        '<button class="pwd-hbtn primary" onclick="wsPwdEdit(\'' + cmpId + '\',null)">+ 新增账号</button>';
    }
    wsPwdRenderList(cmpId);
    foot.innerHTML =
      '<span class="pwd-foot-hint">⚠ 本工具为前端加密+本地JSON文件储存，非专业密码管理器；主密码遗忘数据无法找回，高敏感账号密码不建议存放。</span>';
  }

  // ---- 左侧分类 ----
  function wsPwdCatItem(cmpId, id, name, cnt, active, deletable) {
    var st = wsPwdState[cmpId];
    var renaming = st.catRenaming === id;
    var inner;
    if (renaming) {
      inner = '<input id="pwdCatInput" class="pwd-cat-input" value="' + escapeHtml(name) + '" autocomplete="off" onclick="event.stopPropagation()" onkeydown="if(event.key===\'Enter\')wsPwdRenameCatConfirm(\'' + cmpId + '\',\'' + id + '\',this.value);if(event.key===\'Escape\')wsPwdRenameCatCancel(\'' + cmpId + '\')" onblur="wsPwdRenameCatConfirm(\'' + cmpId + '\',\'' + id + '\',this.value)">';
    } else {
      inner = '<span class="pwd-cat-name">' + escapeHtml(name) + '</span><span class="pwd-cat-count">' + cnt + '</span>';
    }
    var ops = "";
    if (!renaming && id !== "all") {
      ops = '<span class="pwd-cat-ops">' +
        '<button class="pwd-cat-op" title="改名" onclick="event.stopPropagation();wsPwdRenameCatStart(\'' + cmpId + '\',\'' + id + '\')">✎</button>' +
        (deletable ? '<button class="pwd-cat-op danger" title="删除" onclick="event.stopPropagation();wsPwdDeleteCat(\'' + cmpId + '\',\'' + id + '\')">🗑</button>' : '') +
        '</span>';
    }
    var dragAttr = (!renaming && id !== "all")
      ? ' draggable="true" ondragstart="wsPwdCatDragStart(\'' + cmpId + '\',\'' + id + '\',event)" ondragover="wsPwdCatDragOver(event);this.classList.add(\'drop-target\')" ondragleave="this.classList.remove(\'drop-target\')" ondrop="this.classList.remove(\'drop-target\');wsPwdCatDrop(\'' + cmpId + '\',\'' + id + '\',event)" ondragend="wsPwdCatDragEnd(event)"'
      : '';
    return '<div class="pwd-cat' + (active ? " active" : "") + (renaming ? " renaming" : "") + '"' + dragAttr + ' onclick="wsPwdSelectCat(\'' + cmpId + '\',\'' + id + '\')">' + inner + ops + '</div>';
  }
  function wsPwdRenderCats(cmpId) {
    var st = wsPwdState[cmpId];
    var box = document.getElementById("pwdCatList");
    if (!box) return;
    var counts = {};
    st.accounts.forEach(function (a) { counts[a.categoryId] = (counts[a.categoryId] || 0) + 1; });
    var html = wsPwdCatItem(cmpId, "all", "全部", st.accounts.length, st.selectedCat === "all", false);
    st.categories.forEach(function (c) {
      html += wsPwdCatItem(cmpId, c.id, c.name, counts[c.id] || 0, st.selectedCat === c.id, c.id !== "default");
    });
    box.innerHTML = html;
    // 分类操作图标：仅在鼠标移动到右侧计数/图标区域时显示
    box.querySelectorAll(".pwd-cat").forEach(function (cat) {
      var count = cat.querySelector(".pwd-cat-count");
      var ops = cat.querySelector(".pwd-cat-ops");
      function showOps() { cat.classList.add("show-ops"); }
      function hideOps() { cat.classList.remove("show-ops"); }
      if (count && ops) {
        count.addEventListener("mouseenter", showOps);
        count.addEventListener("mouseleave", function (e) {
          if (!ops.contains(e.relatedTarget)) hideOps();
        });
        ops.addEventListener("mouseenter", showOps);
        ops.addEventListener("mouseleave", function (e) {
          if (!count.contains(e.relatedTarget)) hideOps();
        });
      }
    });
    var addBox = document.getElementById("pwdCatAdd");
    if (st.catAdding) {
      addBox.innerHTML = '<input id="pwdCatInput" class="pwd-cat-input" placeholder="分类名称，回车保存" autocomplete="off" onkeydown="if(event.key===\'Enter\')wsPwdAddCatConfirm(\'' + cmpId + '\',this.value)" onblur="wsPwdAddCatConfirm(\'' + cmpId + '\',this.value)">';
    } else {
      addBox.innerHTML = '<button class="pwd-cat-add-btn" onclick="wsPwdAddCatStart(\'' + cmpId + '\')">+ 新增分类</button>';
    }
    if (st.catAdding || st.catRenaming) {
      setTimeout(function () { var e = document.getElementById("pwdCatInput"); if (e) { e.focus(); if (e.select) e.select(); } }, 0);
    }
  }
  function wsPwdSelectCat(cmpId, catId) {
    var st = wsPwdState[cmpId]; if (!st) return;
    st.selectedCat = catId; st.catAdding = false; st.catRenaming = null; st.search = "";
    wsPwdRenderManager(cmpId);
  }
  function wsPwdAddCatStart(cmpId) {
    var st = wsPwdState[cmpId]; if (!st) return;
    st.catAdding = true; st.catRenaming = null; wsPwdRenderManager(cmpId);
  }
  function wsPwdAddCatConfirm(cmpId, name) {
    var st = wsPwdState[cmpId]; if (!st) return;
    st.catAdding = false;
    name = (name || "").trim();
    if (name) {
      var id = wsGenId();
      st.categories.push({ id: id, name: name });
      st.selectedCat = id;
      wsPwdPersist(cmpId).then(function () { wsPwdRenderManager(cmpId); });
      return;
    }
    wsPwdRenderManager(cmpId);
  }
  function wsPwdRenameCatStart(cmpId, catId) {
    var st = wsPwdState[cmpId]; if (!st) return;
    st.catRenaming = catId; st.catAdding = false; wsPwdRenderManager(cmpId);
  }
  function wsPwdRenameCatCancel(cmpId) {
    var st = wsPwdState[cmpId]; if (!st) return;
    st.catRenaming = null; wsPwdRenderManager(cmpId);
  }
  function wsPwdRenameCatConfirm(cmpId, catId, name) {
    var st = wsPwdState[cmpId]; if (!st) return;
    var cat = st.categories.find(function (c) { return c.id === catId; });
    st.catRenaming = null;
    name = (name || "").trim();
    if (cat && name) {
      cat.name = name;
      wsPwdPersist(cmpId).then(function () { wsPwdRenderManager(cmpId); });
      return;
    }
    wsPwdRenderManager(cmpId);
  }
  function wsPwdDeleteCat(cmpId, catId) {
    var st = wsPwdState[cmpId]; if (!st) return;
    if (!confirm("删除该分类？其中的账号将移到「默认」分类。")) return;
    st.categories = st.categories.filter(function (c) { return c.id !== catId; });
    st.accounts.forEach(function (a) { if (a.categoryId === catId) a.categoryId = "default"; });
    if (st.selectedCat === catId) st.selectedCat = "all";
    st.catRenaming = null;
    wsPwdPersist(cmpId).then(function () { wsPwdRenderManager(cmpId); });
  }
  function wsPwdCatDragStart(cmpId, id, e) {
    window.__wsPwdDragCatId = id;
    if (e && e.dataTransfer) { try { e.dataTransfer.setData("text/plain", id); e.dataTransfer.effectAllowed = "move"; } catch (_) {} }
  }
  function wsPwdCatDragOver(e) { e.preventDefault(); if (e.dataTransfer) e.dataTransfer.dropEffect = "move"; }
  function wsPwdCatDrop(cmpId, targetId, e) {
    e.preventDefault();
    var id = window.__wsPwdDragCatId;
    if (!id || id === targetId) return;
    if (id === "all" || targetId === "all") return;
    var st = wsPwdState[cmpId]; if (!st) return;
    var arr = st.categories;
    var from = -1, to = -1;
    for (var i = 0; i < arr.length; i++) { if (arr[i].id === id) from = i; if (arr[i].id === targetId) to = i; }
    if (from < 0 || to < 0) return;
    var item = arr.splice(from, 1)[0];
    to = -1; for (var j = 0; j < arr.length; j++) { if (arr[j].id === targetId) { to = j; break; } }
    if (to < 0) arr.push(item); else arr.splice(to, 0, item);
    wsPwdPersist(cmpId).then(function () { wsPwdRenderManager(cmpId); });
  }
  function wsPwdCatDragEnd(e) { window.__wsPwdDragCatId = null; }
  function wsPwdSearch(cmpId, q) {
    var st = wsPwdState[cmpId]; if (!st) return;
    st.search = q; wsPwdRenderList(cmpId);
  }

  // ---- 右侧账号列表（表格形式）----
  function wsPwdRenderList(cmpId) {
    var st = wsPwdState[cmpId];
    var list = document.getElementById("pwdList");
    if (!list) return;
    var accs = st.accounts;
    if (st.selectedCat && st.selectedCat !== "all") accs = accs.filter(function (a) { return a.categoryId === st.selectedCat; });
    if (st.search) {
      var q = st.search.toLowerCase();
      accs = accs.filter(function (a) {
        return ((a.title || "") + (a.username || "") + (a.url || "") + (a.note || "")).toLowerCase().indexOf(q) >= 0;
      });
    }
    if (!accs.length) {
      list.innerHTML = '<div class="pwd-empty">' + (st.accounts.length ? "该分类下暂无账号，点击右上角「+ 新增账号」添加。" : "暂无账号，点击右上角「+ 新增账号」开始保存。") + '</div>';
      return;
    }
    var headHtml =
      '<div class="pwd-table-head">' +
        '<div class="pwd-table-row head">' +
          '<div class="pwd-table-cell head">标题 / 站点</div>' +
          '<div class="pwd-table-cell head">账号</div>' +
          '<div class="pwd-table-cell head">密码</div>' +
          '<div class="pwd-table-cell head">备注</div>' +
          '<div class="pwd-table-cell head">操作</div>' +
        '</div>' +
      '</div>';
    var rowsHtml = accs.map(function (a) {
      var revealed = wsPwdReveal[cmpId] && wsPwdReveal[cmpId].has(a.id);
      var pw = revealed ? (a.password || "") : "••••••••";
      var catName = "";
      if (st.selectedCat === "all") { var c = st.categories.find(function (x) { return x.id === a.categoryId; }); catName = c ? c.name : ""; }
      return '<div class="pwd-table-row">' +
        '<div class="pwd-table-cell pwd-cell-title">' +
          '<div class="pwd-title-line">' + escapeHtml(a.title || "未命名") +
            (a.url ? ' <a class="pwd-row-url" href="' + escapeHtml(a.url) + '" target="_blank" rel="noopener" onclick="event.stopPropagation()">↗</a>' : '') +
            (catName ? ' <span class="pwd-row-cat">' + escapeHtml(catName) + '</span>' : '') +
          '</div>' +
        '</div>' +
        '<div class="pwd-table-cell">' +
          '<span class="pwd-field-v" title="' + escapeHtml(a.username || "") + '">' + escapeHtml(a.username || "") + '</span>' +
          '<button class="pwd-ico sm" title="复制账号" onclick="wsPwdCopy(\'' + cmpId + '\',\'' + a.id + '\',\'username\')">⧉</button>' +
        '</div>' +
        '<div class="pwd-table-cell">' +
          '<span class="pwd-field-v pwd-field-pw" title="' + (revealed ? escapeHtml(a.password || "") : "") + '">' + escapeHtml(pw) + '</span>' +
          '<button class="pwd-ico sm" title="' + (revealed ? "隐藏" : "显示") + '" onclick="wsPwdToggleReveal(\'' + cmpId + '\',\'' + a.id + '\')">' + (revealed ? "🙈" : "👁") + '</button>' +
          '<button class="pwd-ico sm" title="复制密码" onclick="wsPwdCopy(\'' + cmpId + '\',\'' + a.id + '\',\'password\')">⧉</button>' +
        '</div>' +
        '<div class="pwd-table-cell pwd-cell-note" title="' + escapeHtml(a.note || "") + '">' +
          (a.note ? escapeHtml(a.note) : '<span class="pwd-note-empty">—</span>') +
        '</div>' +
        '<div class="pwd-table-cell pwd-cell-ops">' +
          '<button class="pwd-ico sm" title="编辑" onclick="wsPwdEdit(\'' + cmpId + '\',\'' + a.id + '\')">✎</button>' +
          '<button class="pwd-ico sm danger" title="删除" onclick="wsPwdDelete(\'' + cmpId + '\',\'' + a.id + '\')">🗑</button>' +
        '</div>' +
      '</div>';
    }).join("");
    list.innerHTML = headHtml + '<div class="pwd-table-body">' + rowsHtml + '</div>';
  }
  function wsPwdToggleReveal(cmpId, aid) {
    wsPwdReveal[cmpId] = wsPwdReveal[cmpId] || new Set();
    if (wsPwdReveal[cmpId].has(aid)) wsPwdReveal[cmpId].delete(aid); else wsPwdReveal[cmpId].add(aid);
    wsPwdRenderManager(cmpId);
  }
  function wsPwdClipboard(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text);
    return new Promise(function (res, rej) {
      try {
        var ta = document.createElement("textarea");
        ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
        document.body.appendChild(ta); ta.select();
        var ok = document.execCommand("copy");
        document.body.removeChild(ta);
        ok ? res() : rej(new Error("copy-fail"));
      } catch (e) { rej(e); }
    });
  }
  function wsPwdCopy(cmpId, aid, field) {
    var st = wsPwdState[cmpId];
    if (!st) return;
    var a = st.accounts.find(function (x) { return x.id === aid; });
    if (!a) return;
    var text = field === "password" ? (a.password || "") : (a.username || "");
    var label = field === "password" ? "密码" : "账号";
    if (!text) { showToast("无" + label + "可复制"); return; }
    wsPwdClipboard(text).then(function () {
      showToast(label + "已复制到剪贴板");
      setTimeout(function () { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText("").catch(function () {}); }, 15000);
    }).catch(function () { showToast("复制失败"); });
    wsPwdResetIdle(cmpId);
  }
  // 把编辑表单里的当前内容（可能含未保存改动）按 字段名：内容 格式多行复制
  function wsPwdCopyAll(cmpId, aid) {
    var st = wsPwdState[cmpId];
    if (!st) return;
    var title = document.getElementById("wsPwdF_title").value.trim();
    var url = document.getElementById("wsPwdF_url").value.trim();
    var username = document.getElementById("wsPwdF_user").value;
    var password = document.getElementById("wsPwdF_pw").value;
    var note = document.getElementById("wsPwdF_note").value;
    var categoryId = document.getElementById("wsPwdF_cat").value;
    var cat = st.categories.find(function (c) { return c.id === categoryId; });
    var lines = [];
    if (title) lines.push("标题：" + title);
    if (url) lines.push("网址：" + url);
    if (cat) lines.push("分类：" + cat.name);
    if (username) lines.push("账号：" + username);
    if (password) lines.push("密码：" + password);
    if (note) lines.push("备注：" + note);
    if (!lines.length) { showToast("当前账号没有可复制的内容"); return; }
    wsPwdClipboard(lines.join("\n")).then(function () {
      showToast("已复制全部到剪贴板");
      setTimeout(function () { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText("").catch(function () {}); }, 15000);
    }).catch(function () { showToast("复制失败，请手动复制"); });
  }
  function wsPwdEdit(cmpId, aid) {
    var st = wsPwdState[cmpId];
    if (!st || !st.unlocked) return;
    var edit = aid ? st.accounts.find(function (a) { return a.id === aid; }) : null;
    var acc = edit || { id: wsGenId(), title: "", url: "", username: "", password: "", note: "", categoryId: "", created: Date.now(), updated: Date.now() };
    var defCat = acc.categoryId || (st.selectedCat && st.selectedCat !== "all" ? st.selectedCat : "default");
    if (!st.categories.some(function (c) { return c.id === defCat; })) defCat = "default";
    var catOpts = st.categories.map(function (c) {
      return '<option value="' + c.id + '"' + (c.id === defCat ? " selected" : "") + '>' + escapeHtml(c.name) + '</option>';
    }).join("");
    var m = document.getElementById("modalContent");
    m.innerHTML =
      '<div class="modal-header"><h3>' + (edit ? "编辑账号" : "新增账号") + '</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>' +
      '<div class="modal-body ws-pwd-form">' +
        '<label>标题（站点名称）</label><input id="wsPwdF_title" class="ws-pwd-input" value="' + escapeHtml(acc.title) + '">' +
        '<label>网站 URL</label><input id="wsPwdF_url" class="ws-pwd-input" value="' + escapeHtml(acc.url) + '" placeholder="https://...">' +
        '<label>分类</label><select id="wsPwdF_cat" class="ws-pwd-input">' + catOpts + '</select>' +
        '<label>登录账号</label><input id="wsPwdF_user" class="ws-pwd-input" value="' + escapeHtml(acc.username) + '">' +
        '<label>登录密码</label>' +
          '<div class="ws-pwd-pwrow"><input id="wsPwdF_pw" class="ws-pwd-input" type="password" value="' + escapeHtml(acc.password) + '"><button type="button" class="pwd-ico" onclick="wsPwdToggleFpw()">👁</button></div>' +
        '<label>备注</label><textarea id="wsPwdF_note" class="ws-pwd-input" rows="2">' + escapeHtml(acc.note) + '</textarea>' +
      '</div>' +
      '<div class="modal-actions">' +
        '<button type="button" class="btn btn-secondary ws-pwd-copy-all" onclick="wsPwdCopyAll(\'' + cmpId + '\',\'' + (edit ? acc.id : "") + '\')" title="按 字段名：内容 的格式多行复制当前账号全部信息">📋 复制全部</button>' +
        '<button class="btn btn-secondary" onclick="closeModal()">取消</button>' +
        '<button class="btn btn-primary" onclick="wsPwdSaveEdit(\'' + cmpId + '\',\'' + (edit ? acc.id : "") + '\')">保存</button>' +
      '</div>';
    document.getElementById("modalOverlay").classList.add("open");
  }
  function wsPwdToggleFpw() {
    var el = document.getElementById("wsPwdF_pw");
    if (!el) return;
    el.type = el.type === "password" ? "text" : "password";
  }
  function wsPwdSaveEdit(cmpId, aid) {
    var st = wsPwdState[cmpId];
    if (!st || !st.unlocked) return;
    var title = document.getElementById("wsPwdF_title").value.trim();
    var url = document.getElementById("wsPwdF_url").value.trim();
    var username = document.getElementById("wsPwdF_user").value;
    var password = document.getElementById("wsPwdF_pw").value;
    var note = document.getElementById("wsPwdF_note").value;
    var categoryId = document.getElementById("wsPwdF_cat").value;
    if (!title && !username && !password) { showToast("请至少填写一项"); return; }
    var now = Date.now();
    if (aid) {
      var a = st.accounts.find(function (x) { return x.id === aid; });
      if (a) { a.title = title; a.url = url; a.username = username; a.password = password; a.note = note; a.categoryId = categoryId; a.updated = now; }
    } else {
      st.accounts.push({ id: wsGenId(), title: title, url: url, username: username, password: password, note: note, categoryId: categoryId, created: now, updated: now });
    }
    wsPwdPersist(cmpId).then(function () {
      closeModal();
      wsRenderDIY();
      wsPwdRenderManager(cmpId);
      showToast("已保存");
    }).catch(function () { showToast("保存失败"); });
  }
  function wsPwdDelete(cmpId, aid) {
    wsConfirm("确定删除该账号吗？删除后无法恢复。", function () {
      var st = wsPwdState[cmpId];
      if (!st) return;
      st.accounts = st.accounts.filter(function (a) { return a.id !== aid; });
      wsPwdPersist(cmpId).then(function () {
        wsRenderDIY();
        wsPwdRenderManager(cmpId);
        showToast("已删除");
      }).catch(function () { showToast("删除失败"); });
    });
  }

  // ---- 导出 / 导入 ----
  function wsPwdExport(cmpId) {
    wsPwdLoadVault(cmpId).then(function (data) {
      if (!data) { showToast("没有可导出的数据"); return; }
      var blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = "password-vault-" + cmpId + ".encrypted.json";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      showToast("已导出加密备份（全部为密文）");
    }).catch(function () { showToast("导出失败"); });
  }
  function wsPwdImport(cmpId) {
    var input = document.createElement("input");
    input.type = "file"; input.accept = ".json,application/json"; input.style.display = "none";
    input.onchange = function () {
      var f = input.files && input.files[0];
      if (!f) return;
      var reader = new FileReader();
      reader.onload = function () {
        var parsed;
        try { parsed = JSON.parse(reader.result); } catch (e) { showToast("文件不是有效 JSON"); return; }
        if (!parsed || !parsed.ciphertext || !parsed.iv || !parsed.salt) { showToast("不是有效的加密备份文件"); return; }
        var m = document.getElementById("modalContent");
        m.innerHTML =
          '<div class="modal-header"><h3>⬆ 导入加密备份</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>' +
          '<div class="modal-body">' +
            '<p class="ws-pwd-tip">导入将<b>覆盖</b>当前保险库。请输入主密码以解密并恢复账号。</p>' +
            '<input type="password" id="wsPwdImpPwd" class="ws-pwd-input" placeholder="主密码" autocomplete="off">' +
            '<div class="ws-pwd-err" id="wsPwdImpErr"></div>' +
          '</div>' +
          '<div class="modal-actions">' +
            '<button class="btn btn-secondary" onclick="closeModal()">取消</button>' +
            '<button class="btn btn-primary" onclick="wsPwdDoImport(\'' + cmpId + '\')">解密并导入</button>' +
          '</div>';
        window.__wsPwdImportData = parsed;
        document.getElementById("modalOverlay").classList.add("open");
      };
      reader.readAsText(f);
    };
    document.body.appendChild(input); input.click(); document.body.removeChild(input);
  }
  function wsPwdDoImport(cmpId) {
    var data = window.__wsPwdImportData;
    var p = document.getElementById("wsPwdImpPwd").value;
    var err = document.getElementById("wsPwdImpErr");
    if (!data) { err.textContent = "备份数据缺失"; return; }
    if (!p) { err.textContent = "请输入主密码"; return; }
    wsPwdDecrypt(p, data).then(function (r) {
      var nv = wsPwdNormalizeVault(r.obj || {});
      var finish = function (id, n) {
        closeModal();
        wsRenderDIY();
        if (wsPwdCurrent === id) wsPwdRenderManager(id);
        showToast("已导入 " + n + " 条账号");
      };
      if (wsPwdState[cmpId] && wsPwdState[cmpId].unlocked) {
        // 已解锁：用当前内存密钥重新加密覆盖，主密码不变
        var st = wsPwdState[cmpId];
        st.accounts = nv.accounts; st.categories = nv.categories;
        wsPwdPersist(cmpId).then(function () {
          finish(cmpId, nv.accounts.length);
        }).catch(function () { err.textContent = "导入保存失败"; });
      } else {
        // 未解锁：用导入文件的主密码派生新密钥并覆盖存储、解锁
        wsPwdSaveVault(cmpId, data).then(function () {
          wsPwdState[cmpId] = { unlocked: true, key: r.key, salt: r.salt, accounts: nv.accounts, categories: nv.categories, selectedCat: "all", search: "", catAdding: false, catRenaming: null };
          wsPwdReveal[cmpId] = wsPwdReveal[cmpId] || new Set();
          wsPwdStartIdle(cmpId);
          finish(cmpId, nv.accounts.length);
        }).catch(function () { err.textContent = "导入保存失败"; });
      }
    }).catch(function () { err.textContent = "主密码错误，无法解密备份"; });
  }

  // ---- 修改主密码 ----
  function wsPwdChangeMaster(cmpId) {
    var st = wsPwdState[cmpId];
    if (!st || !st.unlocked) { wsPwdUnlock(cmpId); return; }
    var m = document.getElementById("modalContent");
    m.innerHTML =
      '<div class="modal-header"><h3>✎ 修改主密码</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>' +
      '<div class="modal-body">' +
        '<p class="ws-pwd-tip">将用旧主密码验证并解密全部数据，再用新主密码重新加密。过程完全在本地完成，旧密钥立即清除。</p>' +
        '<input type="password" id="wsPwdOld" class="ws-pwd-input" placeholder="旧主密码">' +
        '<input type="password" id="wsPwdNew" class="ws-pwd-input" placeholder="新主密码（≥6 位）" style="margin-top:8px">' +
        '<input type="password" id="wsPwdNew2" class="ws-pwd-input" placeholder="再次输入新主密码" style="margin-top:8px">' +
        '<div class="ws-pwd-err" id="wsPwdChErr"></div>' +
      '</div>' +
      '<div class="modal-actions">' +
        '<button class="btn btn-secondary" onclick="closeModal()">取消</button>' +
        '<button class="btn btn-primary" onclick="wsPwdDoChangeMaster(\'' + cmpId + '\')">确认修改</button>' +
      '</div>';
    document.getElementById("modalOverlay").classList.add("open");
  }
  function wsPwdDoChangeMaster(cmpId) {
    var st = wsPwdState[cmpId];
    if (!st || !st.unlocked) return;
    var oldP = document.getElementById("wsPwdOld").value;
    var newP = document.getElementById("wsPwdNew").value;
    var newP2 = document.getElementById("wsPwdNew2").value;
    var err = document.getElementById("wsPwdChErr");
    if (!oldP) { err.textContent = "请输入旧主密码"; return; }
    if (newP.length < 6) { err.textContent = "新主密码至少 6 位"; return; }
    if (newP !== newP2) { err.textContent = "两次新密码不一致"; return; }
    wsPwdLoadVault(cmpId).then(function (data) {
      if (!data) { err.textContent = "未找到保险库数据"; return; }
      wsPwdDecrypt(oldP, data).then(function () {
        // 旧密码正确，用新密码重新加密并覆盖
        wsPwdEncrypt(newP, { accounts: st.accounts, categories: st.categories }).then(function (r) {
          wsPwdSaveVault(cmpId, r.data).then(function () {
            wsPwdState[cmpId] = { unlocked: true, key: r.key, salt: r.salt, accounts: st.accounts, categories: st.categories };
            closeModal();
            showToast("主密码已更新");
          });
        }).catch(function () { err.textContent = "加密失败，请重试"; });
      }).catch(function () { err.textContent = "旧主密码错误，无法解密"; });
    }).catch(function () { err.textContent = "读取保险库失败"; });
  }
  function wsStartComponentTick() {
    window.__wsComponentTickStarted = true;
    setInterval(wsComponentTick, 10000);
  }
  function wsComponentTick() {
    const page = document.getElementById("wsPage");
    if (!page || page.style.display === "none") return;
    (CONFIG.workspace.components || []).forEach(cmp => {
      const body = document.getElementById("ws_cmp_body_" + cmp.id);
      if (!body) return;
      if (cmp.type === "clockin") wsRenderClockin(body, cmp);
      else if (cmp.type === "water") wsRenderWater(body, cmp);
      else if (cmp.type === "focus") wsRenderFocus(body, cmp);
    });
  }
  </script>
</body>
</html>
